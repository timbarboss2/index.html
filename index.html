<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
    <title>VR Room Designer - Physics & Hand Tracking</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body { 
            overflow: hidden; 
            font-family: Arial, sans-serif; 
            background: #000;
            width: 100vw;
            height: 100vh;
        }
        
        #videoInput {
            position: fixed;
            top: 0;
            left: 0;
            width: 100vw;
            height: 100vh;
            object-fit: cover;
            z-index: 0;
        }
        
        #gameCanvas { 
            position: fixed;
            top: 0;
            left: 0;
            width: 100vw; 
            height: 100vh; 
            z-index: 1;
        }
        
        #handOverlay {
            position: fixed;
            top: 0;
            left: 0;
            width: 100vw;
            height: 100vh;
            z-index: 2;
            pointer-events: none;
        }
        
        #loading {
            position: fixed; 
            top: 0; left: 0; 
            width: 100%; height: 100%;
            background: linear-gradient(135deg, #1a1a2e 0%, #16213e 100%);
            display: flex; 
            flex-direction: column; 
            justify-content: center; 
            align-items: center;
            z-index: 10000; 
            color: white;
        }
        
        #loading h1 {
            margin-bottom: 20px; 
            font-size: 32px;
            background: linear-gradient(45deg, #00d4ff, #7b2cbf);
            -webkit-background-clip: text; 
            -webkit-text-fill-color: transparent;
        }
        
        .loader {
            width: 50px; height: 50px;
            border: 5px solid rgba(255, 255, 255, 0.1);
            border-top-color: #00d4ff; 
            border-radius: 50%;
            animation: spin 1s linear infinite;
        }
        
        @keyframes spin { to { transform: rotate(360deg); } }
        
        #gestureIndicator {
            position: fixed; 
            width: 100px; height: 100px;
            border: 5px solid rgba(0, 255, 0, 0.9);
            border-radius: 50%; 
            pointer-events: none;
            opacity: 0; 
            transition: opacity 0.15s, transform 0.15s;
            z-index: 100;
            box-shadow: 0 0 30px rgba(0, 255, 0, 0.8);
        }
        
        #gestureIndicator.active {
            opacity: 1;
            transform: scale(1.1);
        }
        
        #status {
            position: fixed;
            top: 20px;
            left: 20px;
            background: rgba(0, 0, 0, 0.9);
            color: #00ff00;
            padding: 12px 18px;
            border-radius: 10px;
            font-size: 13px;
            z-index: 1000;
            font-family: monospace;
            max-width: 350px;
            border: 2px solid #00ff00;
        }
        
        #fpsCounter {
            position: fixed;
            top: 20px;
            right: 20px;
            background: rgba(0, 0, 0, 0.9);
            color: #ffff00;
            padding: 10px 15px;
            border-radius: 8px;
            font-size: 14px;
            font-weight: bold;
            z-index: 1000;
            font-family: monospace;
            border: 2px solid #ffff00;
        }
        
        #handInfo {
            position: fixed;
            top: 80px;
            right: 20px;
            background: rgba(0, 0, 0, 0.9);
            color: #00d4ff;
            padding: 10px 15px;
            border-radius: 8px;
            font-size: 13px;
            z-index: 1000;
            font-family: monospace;
            border: 2px solid #00d4ff;
        }
        
        #instructions {
            position: fixed;
            bottom: 20px;
            left: 50%;
            transform: translateX(-50%);
            background: rgba(0, 0, 0, 0.9);
            color: white;
            padding: 15px 25px;
            border-radius: 12px;
            font-size: 14px;
            text-align: center;
            z-index: 100;
            max-width: 90%;
            border: 2px solid #00d4ff;
        }
        
        #startButton {
            position: fixed;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            background: linear-gradient(45deg, #00d4ff, #7b2cbf);
            color: white;
            border: none;
            padding: 20px 50px;
            border-radius: 30px;
            font-size: 24px;
            font-weight: bold;
            cursor: pointer;
            z-index: 10001;
            box-shadow: 0 10px 40px rgba(0, 212, 255, 0.6);
            transition: transform 0.2s;
        }
        
        #startButton:hover {
            transform: translate(-50%, -50%) scale(1.05);
        }
        
        #error {
            position: fixed;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            background: rgba(255, 0, 0, 0.95);
            color: white;
            padding: 40px;
            border-radius: 15px;
            font-size: 18px;
            text-align: center;
            z-index: 10002;
            display: none;
            max-width: 80%;
        }
        
        #error button {
            margin-top: 20px;
            padding: 15px 40px;
            background: white;
            color: red;
            border: none;
            border-radius: 8px;
            font-size: 18px;
            cursor: pointer;
            font-weight: bold;
        }
    </style>
</head>
<body>
    <div id="loading">
        <h1>🖐 VR Room Designer</h1>
        <div class="loader"></div>
        <p style="margin-top: 20px; font-size: 18px;">Загрузка физики и трекинга...</p>
    </div>
    
    <button id="startButton">🎮 НАЧАТЬ ИГРУ</button>
    
    <div id="error">
        <h2>❌ Ошибка камеры</h2>
        <p id="errorMessage">Не удалось получить доступ к камере</p>
        <button onclick="location.reload()">Попробовать снова</button>
    </div>
    
    <video id="videoInput" autoplay playsinline muted></video>
    <canvas id="gameCanvas"></canvas>
    <canvas id="handOverlay"></canvas>
    
    <div id="gestureIndicator"></div>
    <div id="fpsCounter">FPS: --</div>
    <div id="handInfo">Рука: не обнаружена</div>
    <div id="status">Ожидание запуска...</div>
    <div id="instructions">
        ✋ Покажи руку камере | 🤏 Щипок = взять предмет | 🎯 Двойной щипок = меню | 👋 Толкай предметы рукой
    </div>
    
    <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/cannon@0.6.2/build/cannon.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/@mediapipe/hands@0.4.1646424915/hands.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/@mediapipe/camera_utils@0.3.1640029074/camera_utils.min.js"></script>
    
    <script>
        // ==================== ГЛОБАЛЬНЫЕ ПЕРЕМЕННЫЕ ====================
        let scene, camera, renderer;
        let world; // Cannon.js физический мир
        let physicsObjects = []; // Объекты с физикой
        let handSkeletons = { left: null, right: null };
        let hands, videoElement, overlayCanvas, overlayCtx;
        let isPinching = { left: false, right: false };
        let grabbedObject = null; // Какой объект сейчас захвачен
        let pinchCount = 0;
        let lastPinchTime = 0;
        let radialMenu = null;
        let isMenuOpen = false;
        let gameStarted = false;
        let currentHand = null; // Текущая обнаруженная рука
        
        // Отслеживание скорости руки для бросков
        let handPositionHistory = { left: [], right: [] };
        const HISTORY_SIZE = 5;
        
        // FPS counter
        let frameCount = 0;
        let lastFpsUpdate = 0;
        let currentFps = 0;
        
        // Оптимизация
        let lastProcessTime = 0;
        const PROCESS_INTERVAL = 33; // ~30 FPS для трекинга
        
        const HAND_CONNECTIONS = [
            [0, 1], [1, 2], [2, 3], [3, 4],
            [0, 5], [5, 6], [6, 7], [7, 8],
            [0, 9], [9, 10], [10, 11], [11, 12],
            [0, 13], [13, 14], [14, 15], [15, 16],
            [0, 17], [17, 18], [18, 19], [19, 20]
        ];
        
        const spawnItems = [
            { name: '🧊 Красный куб', type: 'cube', color: 0xe74c3c, size: 0.3 },
            { name: '🧊 Синий куб', type: 'cube', color: 0x3498db, size: 0.3 },
            { name: '🧊 Зелёный куб', type: 'cube', color: 0x2ecc71, size: 0.3 },
            { name: '🧊 Жёлтый куб', type: 'cube', color: 0xf1c40f, size: 0.3 },
            { name: '⚽ Футбольный мяч', type: 'ball', color: 0x2c3e50, size: 0.25 },
            { name: '🎾 Теннисный мяч', type: 'ball', color: 0xcddc39, size: 0.15 },
            { name: '🏀 Баскетбольный', type: 'ball', color: 0xff5722, size: 0.3 },
            { name: '🎱 Бильярдный шар', type: 'ball', color: 0x000000, size: 0.12 }
        ];
        
        // ==================== ЗАПУСК ИГРЫ ====================
        document.getElementById('startButton').addEventListener('click', async () => {
            document.getElementById('startButton').style.display = 'none';
            await startGame();
        });
        
        async function startGame() {
            try {
                initThreeJS();
                initPhysics();
                await initCamera();
                document.getElementById('loading').style.display = 'none';
                gameStarted = true;
                updateStatus('✅ Задняя камера активна! Покажи руку');
                animate();
            } catch (error) {
                console.error('Ошибка:', error);
                document.getElementById('loading').style.display = 'none';
                document.getElementById('errorMessage').textContent = error.message;
                document.getElementById('error').style.display = 'block';
            }
        }
        
        // ==================== THREE.JS ====================
        function initThreeJS() {
            scene = new THREE.Scene();
            
            camera = new THREE.PerspectiveCamera(75, window.innerWidth / window.innerHeight, 0.1, 1000);
            camera.position.set(0, 2, 5);
            camera.lookAt(0, 1, 0);
            
            renderer = new THREE.WebGLRenderer({ 
                canvas: document.getElementById('gameCanvas'), 
                antialias: false,
                alpha: true,
                powerPreference: "high-performance"
            });
            renderer.setSize(window.innerWidth, window.innerHeight);
            renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));
            renderer.setClearColor(0x000000, 0);
            
            const ambientLight = new THREE.AmbientLight(0xffffff, 0.8);
            scene.add(ambientLight);
            
            const dirLight = new THREE.DirectionalLight(0xffffff, 0.6);
            dirLight.position.set(5, 10, 5);
            scene.add(dirLight);
            
            createRoom();
            window.addEventListener('resize', onWindowResize);
        }
        
        function createRoom() {
            // Пол (полупрозрачный)
            const floorGeometry = new THREE.PlaneGeometry(10, 10);
            const floorMaterial = new THREE.MeshBasicMaterial({ 
                color: 0x8b7355,
                transparent: true,
                opacity: 0.3
            });
            const floor = new THREE.Mesh(floorGeometry, floorMaterial);
            floor.rotation.x = -Math.PI / 2;
            scene.add(floor);
            
            // Стены (полупрозрачные)
            createWall(0, 2.5, -5, 10, 5, 0.2, 0x95a5a6);
            createWall(-5, 2.5, 0, 0.2, 5, 10, 0x95a5a6);
            createWall(5, 2.5, 0, 0.2, 5, 10, 0x95a5a6);
        }
        
        function createWall(x, y, z, w, h, d, color) {
            const geometry = new THREE.BoxGeometry(w, h, d);
            const material = new THREE.MeshBasicMaterial({ 
                color: color,
                transparent: true,
                opacity: 0.2
            });
            const wall = new THREE.Mesh(geometry, material);
            wall.position.set(x, y, z);
            scene.add(wall);
        }
        
        // ==================== ФИЗИКА (CANNON.JS) ====================
        function initPhysics() {
            world = new CANNON.World();
            world.gravity.set(0, -9.82, 0);
            world.broadphase = new CANNON.NaiveBroadphase();
            world.solver.iterations = 5;
            
            // Материалы
            const defaultMaterial = new CANNON.Material('default');
            const contactMaterial = new CANNON.ContactMaterial(
                defaultMaterial, defaultMaterial,
                { friction: 0.3, restitution: 0.5 }
            );
            world.addContactMaterial(contactMaterial);
            world.defaultContactMaterial = contactMaterial;
            
            // Физический пол
            const floorShape = new CANNON.Plane();
            const floorBody = new CANNON.Body({ mass: 0 });
            floorBody.addShape(floorShape);
            floorBody.quaternion.setFromAxisAngle(new CANNON.Vec3(1, 0, 0), -Math.PI / 2);
            world.addBody(floorBody);
            
            // Физические стены
            createPhysicsWall(0, 2.5, -5, 10, 5, 0.2);
            createPhysicsWall(-5, 2.5, 0, 0.2, 5, 10);
            createPhysicsWall(5, 2.5, 0, 0.2, 5, 10);
        }
        
        function createPhysicsWall(x, y, z, w, h, d) {
            const shape = new CANNON.Box(new CANNON.Vec3(w/2, h/2, d/2));
            const body = new CANNON.Body({ mass: 0 });
            body.addShape(shape);
            body.position.set(x, y, z);
            world.addBody(body);
        }
        
        // ==================== КАМЕРА (ЗАДНЯЯ, БЕЗ ЗЕРКАЛА) ====================
        async function initCamera() {
            videoElement = document.getElementById('videoInput');
            overlayCanvas = document.getElementById('handOverlay');
            overlayCtx = overlayCanvas.getContext('2d');
            
            overlayCanvas.width = window.innerWidth;
            overlayCanvas.height = window.innerHeight;
            
            hands = new Hands({
                locateFile: (file) => {
                    return `https://cdn.jsdelivr.net/npm/@mediapipe/hands@0.4.1646424915/${file}`;
                }
            });
            
            hands.setOptions({
                maxNumHands: 1, // ТОЛЬКО ОДНА РУКА - убираем зеркальную
                modelComplexity: 0,
                minDetectionConfidence: 0.7,
                minTrackingConfidence: 0.6
            });
            
            hands.onResults(onHandResults);
            
            // Задняя камера
            const stream = await navigator.mediaDevices.getUserMedia({ 
                video: { 
                    width: { ideal: 640 },
                    height: { ideal: 480 },
                    facingMode: 'environment' // ЗАДНЯЯ КАМЕРА
                } 
            });
            
            videoElement.srcObject = stream;
            
            await new Promise((resolve, reject) => {
                videoElement.onloadedmetadata = () => {
                    videoElement.play().then(resolve).catch(reject);
                };
                videoElement.onerror = () => reject(new Error('Ошибка видео'));
            });
            
            const cam = new Camera(videoElement, {
                onFrame: async () => {
                    const now = performance.now();
                    if (now - lastProcessTime >= PROCESS_INTERVAL) {
                        await hands.send({ image: videoElement });
                        lastProcessTime = now;
                    }
                },
                width: 640,
                height: 480
            });
            cam.start();
        }
        
        // ==================== ТРЕКИНГ РУК ====================
        function onHandResults(results) {
            overlayCtx.clearRect(0, 0, overlayCanvas.width, overlayCanvas.height);
            
            if (results.multiHandLandmarks && results.multiHandLandmarks.length > 0) {
                // Берём только ПЕРВУЮ руку (maxNumHands = 1)
                const landmarks = results.multiHandLandmarks[0];
                const handedness = results.multiHandedness[0].label;
                
                // Для задней камеры handedness правильный: Right = правая рука
                currentHand = handedness.toLowerCase();
                
                document.getElementById('handInfo').textContent = 
                    `Рука: ${currentHand === 'left' ? '🤚 ЛЕВАЯ' : '🤚 ПРАВАЯ'}`;
                
                drawHandSkeleton(landmarks, currentHand);
                updateHandSkeleton3D(landmarks, currentHand);
                updateHandVelocity(landmarks, currentHand);
                checkGestures(landmarks, currentHand);
                interactWithObjects(landmarks, currentHand);
                
            } else {
                currentHand = null;
                document.getElementById('handInfo').textContent = 'Рука: не обнаружена';
                
                // Скрываем скелеты
                Object.values(handSkeletons).forEach(skeleton => {
                    if (skeleton) {
                        skeleton.joints.forEach(j => j.visible = false);
                        skeleton.bones.forEach(b => b.visible = false);
                    }
                });
                
                // Отпускаем объект если рука исчезла
                if (grabbedObject) {
                    releaseObject();
                }
            }
        }
        
        function drawHandSkeleton(landmarks, handedness) {
            const color = handedness === 'left' ? '#00ff00' : '#ff00ff';
            
            // Задняя камера НЕ зеркалится - координаты как есть
            overlayCtx.strokeStyle = color;
            overlayCtx.lineWidth = 3;
            overlayCtx.lineCap = 'round';
            
            HAND_CONNECTIONS.forEach(([start, end]) => {
                const x1 = landmarks[start].x * overlayCanvas.width;
                const y1 = landmarks[start].y * overlayCanvas.height;
                const x2 = landmarks[end].x * overlayCanvas.width;
                const y2 = landmarks[end].y * overlayCanvas.height;
                
                overlayCtx.beginPath();
                overlayCtx.moveTo(x1, y1);
                overlayCtx.lineTo(x2, y2);
                overlayCtx.stroke();
            });
            
            landmarks.forEach((landmark, index) => {
                const x = landmark.x * overlayCanvas.width;
                const y = landmark.y * overlayCanvas.height;
                
                const isFingertip = [4, 8, 12, 16, 20].includes(index);
                const radius = isFingertip ? 8 : 5;
                
                overlayCtx.fillStyle = isFingertip ? '#ffff00' : color;
                overlayCtx.beginPath();
                overlayCtx.arc(x, y, radius, 0, 2 * Math.PI);
                overlayCtx.fill();
                
                overlayCtx.strokeStyle = '#ffffff';
                overlayCtx.lineWidth = 2;
                overlayCtx.stroke();
            });
        }
        
        function updateHandSkeleton3D(landmarks, handedness) {
            if (!handSkeletons[handedness]) {
                handSkeletons[handedness] = createHandSkeleton3D(handedness);
            }
            
            const skeleton = handSkeletons[handedness];
            
            // Скрываем скелет другой руки
            const otherHand = handedness === 'left' ? 'right' : 'left';
            if (handSkeletons[otherHand]) {
                handSkeletons[otherHand].joints.forEach(j => j.visible = false);
                handSkeletons[otherHand].bones.forEach(b => b.visible = false);
            }
            
            skeleton.joints.forEach(j => j.visible = true);
            skeleton.bones.forEach(b => b.visible = true);
            
            landmarks.forEach((landmark, index) => {
                // Для задней камеры: X как есть, Y инвертируем, Z инвертируем
                const x = (landmark.x - 0.5) * 4;
                const y = (0.5 - landmark.y) * 4;
                const z = -landmark.z * 3;
                
                if (skeleton.joints[index]) {
                    skeleton.joints[index].position.set(x, y + 2, z);
                }
            });
            
            HAND_CONNECTIONS.forEach(([startIdx, endIdx], connIdx) => {
                if (skeleton.bones[connIdx]) {
                    const start = skeleton.joints[startIdx].position;
                    const end = skeleton.joints[endIdx].position;
                    
                    const direction = new THREE.Vector3().subVectors(end, start);
                    const length = direction.length();
                    const midpoint = new THREE.Vector3().addVectors(start, end).multiplyScalar(0.5);
                    
                    skeleton.bones[connIdx].position.copy(midpoint);
                    skeleton.bones[connIdx].scale.y = length;
                    
                    const axis = new THREE.Vector3(0, 1, 0);
                    const quaternion = new THREE.Quaternion().setFromUnitVectors(axis, direction.normalize());
                    skeleton.bones[connIdx].quaternion.copy(quaternion);
                }
            });
        }
        
        function createHandSkeleton3D(handKey) {
            const skeleton = { joints: [], bones: [] };
            const color = handKey === 'left' ? 0x00ff00 : 0xff00ff;
            
            for (let i = 0; i < 21; i++) {
                const isFingertip = [4, 8, 12, 16, 20].includes(i);
                const size = isFingertip ? 0.04 : 0.03;
                
                const geometry = new THREE.SphereGeometry(size, 8, 8);
                const material = new THREE.MeshBasicMaterial({ color: color });
                const joint = new THREE.Mesh(geometry, material);
                joint.visible = false;
                scene.add(joint);
                skeleton.joints.push(joint);
            }
            
            HAND_CONNECTIONS.forEach(() => {
                const geometry = new THREE.CylinderGeometry(0.015, 0.015, 1, 6);
                const material = new THREE.MeshBasicMaterial({ color: color });
                const bone = new THREE.Mesh(geometry, material);
                bone.visible = false;
                scene.add(bone);
                skeleton.bones.push(bone);
            });
            
            return skeleton;
        }
        
        // ==================== СКОРОСТЬ РУКИ (для бросков) ====================
        function updateHandVelocity(landmarks, handedness) {
            const indexTip = landmarks[8];
            const pos = getHandPosition3D(indexTip);
            
            const history = handPositionHistory[handedness];
            history.push({ pos: pos.clone(), time: performance.now() });
            
            // Ограничиваем размер истории
            if (history.length > HISTORY_SIZE) {
                history.shift();
            }
        }
        
        function getHandVelocity(handedness) {
            const history = handPositionHistory[handedness];
            if (history.length < 2) return new THREE.Vector3(0, 0, 0);
            
            const current = history[history.length - 1];
            const old = history[0];
            const timeDiff = (current.time - old.time) / 1000; // в секундах
            
            if (timeDiff < 0.001) return new THREE.Vector3(0, 0, 0);
            
            const velocity = new THREE.Vector3().subVectors(current.pos, old.pos);
            velocity.divideScalar(timeDiff);
            
            return velocity;
        }
        
        // ==================== ЖЕСТЫ ====================
        function checkGestures(landmarks, handedness) {
            const thumbTip = landmarks[4];
            const indexTip = landmarks[8];
            
            const distance = Math.sqrt(
                Math.pow(thumbTip.x - indexTip.x, 2) +
                Math.pow(thumbTip.y - indexTip.y, 2) +
                Math.pow(thumbTip.z - indexTip.z, 2)
            );
            
            const threshold = 0.06;
            const now = Date.now();
            
            if (distance < threshold && !isPinching[handedness]) {
                isPinching[handedness] = true;
                
                const indicator = document.getElementById('gestureIndicator');
                const x = thumbTip.x * overlayCanvas.width;
                const y = thumbTip.y * overlayCanvas.height;
                indicator.style.left = (x - 50) + 'px';
                indicator.style.top = (y - 50) + 'px';
                indicator.classList.add('active');
                
                // Двойной щипок для меню
                if (now - lastPinchTime > 400) {
                    pinchCount++;
                    lastPinchTime = now;
                    
                    if (pinchCount === 2) {
                        const menuPos = getHandPosition3D(thumbTip);
                        createQuest3Menu(menuPos);
                        pinchCount = 0;
                        updateStatus('✅ Меню открыто');
                    }
                    
                    setTimeout(() => {
                        if (pinchCount === 1) pinchCount = 0;
                    }, 800);
                }
                
                // Пытаемся захватить объект если меню закрыто
                if (!isMenuOpen && !grabbedObject) {
                    tryGrabObject(indexTip, handedness);
                }
                
            } else if (distance >= threshold && isPinching[handedness]) {
                isPinching[handedness] = false;
                document.getElementById('gestureIndicator').classList.remove('active');
                
                // Отпускаем объект с импульсом (бросок)
                if (grabbedObject) {
                    releaseObject(handedness);
                }
            }
        }
        
        function getHandPosition3D(landmark) {
            const x = (landmark.x - 0.5) * 4;
            const y = (0.5 - landmark.y) * 4;
            const z = -landmark.z * 3;
            return new THREE.Vector3(x, y + 2, z);
        }
        
        // ==================== ВЗАИМОДЕЙСТВИЕ С ОБЪЕКТАМИ ====================
        function tryGrabObject(indexTip, handedness) {
            const handPos = getHandPosition3D(indexTip);
            
            let closest = null;
            let closestDist = Infinity;
            
            physicsObjects.forEach(obj => {
                const objPos = new THREE.Vector3(
                    obj.body.position.x,
                    obj.body.position.y,
                    obj.body.position.z
                );
                const dist = handPos.distanceTo(objPos);
                
                // Радиус захвата зависит от размера объекта
                const grabRadius = obj.userData.size * 1.5;
                
                if (dist < grabRadius && dist < closestDist) {
                    closestDist = dist;
                    closest = obj;
                }
            });
            
            if (closest) {
                grabbedObject = closest;
                grabbedObject.userData.grabbed = true;
                grabbedObject.body.type = CANNON.Body.KINEMATIC;
                grabbedObject.body.velocity.set(0, 0, 0);
                grabbedObject.body.angularVelocity.set(0, 0, 0);
                
                // Подсветка
                grabbedObject.mesh.material.emissive = new THREE.Color(0x444444);
                
                updateStatus(`🎯 Захвачен: ${closest.userData.name}`);
            }
        }
        
        function releaseObject(handedness) {
            if (!grabbedObject) return;
            
            // Применяем импульс на основе скорости руки (бросок)
            const velocity = getHandVelocity(handedness);
            const throwMultiplier = 1.5;
            
            grabbedObject.body.type = CANNON.Body.DYNAMIC;
            grabbedObject.body.velocity.set(
                velocity.x * throwMultiplier,
                velocity.y * throwMultiplier,
                velocity.z * throwMultiplier
            );
            
            grabbedObject.mesh.material.emissive = new THREE.Color(0x000000);
            grabbedObject.userData.grabbed = false;
            grabbedObject = null;
            
            updateStatus('💨 Бросок!');
        }
        
        function interactWithObjects(landmarks, handedness) {
            if (grabbedObject) {
                // Двигаем захваченный объект за пальцем
                const indexTip = landmarks[8];
                const handPos = getHandPosition3D(indexTip);
                
                grabbedObject.body.position.set(handPos.x, handPos.y, handPos.z);
                grabbedObject.body.velocity.set(0, 0, 0);
                grabbedObject.body.angularVelocity.set(0, 0, 0);
                return;
            }
            
            // Толкание объектов при контакте (если не щипок)
            if (!isPinching[handedness]) {
                const indexTip = landmarks[8];
                const handPos = getHandPosition3D(indexTip);
                
                physicsObjects.forEach(obj => {
                    if (obj.userData.grabbed) return;
                    
                    const objPos = new THREE.Vector3(
                        obj.body.position.x,
                        obj.body.position.y,
                        obj.body.position.z
                    );
                    const dist = handPos.distanceTo(objPos);
                    
                    const pushRadius = obj.userData.size + 0.15;
                    
                    if (dist < pushRadius) {
                        // Вычисляем направление от руки к объекту
                        const direction = new THREE.Vector3()
                            .subVectors(objPos, handPos)
                            .normalize();
                        
                        // Сила толчка
                        const pushForce = 5;
                        obj.body.applyImpulse(
                            new CANNON.Vec3(
                                direction.x * pushForce,
                                direction.y * pushForce + 1,
                                direction.z * pushForce
                            ),
                            obj.body.position
                        );
                    }
                });
            }
        }
        
        // ==================== МЕНЮ В СТИЛЕ QUEST 3 ====================
        function createQuest3Menu(position) {
            if (radialMenu) scene.remove(radialMenu);
            
            radialMenu = new THREE.Group();
            radialMenu.position.copy(position);
            radialMenu.position.z -= 1;
            
            // Главная панель
            const panelGeometry = new THREE.PlaneGeometry(3, 2);
            const panelMaterial = new THREE.MeshBasicMaterial({ 
                color: 0x1a1a2e,
                transparent: true,
                opacity: 0.9,
                side: THREE.DoubleSide
            });
            const panel = new THREE.Mesh(panelGeometry, panelMaterial);
            radialMenu.add(panel);
            
            // Рамка
            const frameGeometry = new THREE.EdgesGeometry(panelGeometry);
            const frameMaterial = new THREE.LineBasicMaterial({ color: 0x00d4ff });
            const frame = new THREE.LineSegments(frameGeometry, frameMaterial);
            radialMenu.add(frame);
            
            // Заголовок
            const titleGeometry = new THREE.PlaneGeometry(2.5, 0.3);
            const titleMaterial = new THREE.MeshBasicMaterial({ 
                color: 0x00d4ff,
                transparent: true,
                opacity: 0.3,
                side: THREE.DoubleSide
            });
            const title = new THREE.Mesh(titleGeometry, titleMaterial);
            title.position.set(0, 0.8, 0.01);
            radialMenu.add(title);
            
            // Кнопки предметов
            const cols = 4;
            const spacing = 0.65;
            const startX = -((Math.min(spawnItems.length, cols) - 1) * spacing) / 2;
            
            spawnItems.forEach((item, index) => {
                const row = Math.floor(index / cols);
                const col = index % cols;
                const x = startX + col * spacing;
                const y = 0.3 - row * spacing;
                
                let buttonMesh;
                if (item.type === 'ball') {
                    const geometry = new THREE.SphereGeometry(0.2, 16, 16);
                    const material = new THREE.MeshBasicMaterial({ color: item.color });
                    buttonMesh = new THREE.Mesh(geometry, material);
                } else {
                    const geometry = new THREE.BoxGeometry(0.35, 0.35, 0.35);
                    const material = new THREE.MeshBasicMaterial({ color: item.color });
                    buttonMesh = new THREE.Mesh(geometry, material);
                }
                
                buttonMesh.position.set(x, y, 0.1);
                buttonMesh.userData = { item: item, originalColor: item.color, isSpawnButton: true };
                radialMenu.add(buttonMesh);
            });
            
            // Кнопка закрытия
            const closeGeometry = new THREE.SphereGeometry(0.15, 16, 16);
            const closeMaterial = new THREE.MeshBasicMaterial({ color: 0xe74c3c });
            const closeButton = new THREE.Mesh(closeGeometry, closeMaterial);
            closeButton.position.set(1.3, 0.85, 0.1);
            closeButton.userData = { isCloseButton: true, originalColor: 0xe74c3c };
            radialMenu.add(closeButton);
            
            scene.add(radialMenu);
            isMenuOpen = true;
        }
        
        function checkMenuInteraction(landmarks) {
            if (!radialMenu) return;
            
            const indexTip = landmarks[8];
            const handPos = getHandPosition3D(indexTip);
            
            radialMenu.children.forEach(button => {
                if (!button.userData) return;
                
                const buttonWorldPos = button.position.clone().add(radialMenu.position);
                const distance = handPos.distanceTo(buttonWorldPos);
                
                const hoverRadius = button.userData.isCloseButton ? 0.25 : 0.3;
                
                if (distance < hoverRadius) {
                    button.material.color.setHex(0xffff00);
                    button.scale.set(1.2, 1.2, 1.2);
                    
                    if (isPinching.left || isPinching.right) {
                        handleMenuClick(button);
                    }
                } else {
                    button.material.color.setHex(button.userData.originalColor);
                    button.scale.set(1, 1, 1);
                }
            });
        }
        
        function handleMenuClick(button) {
            if (button.userData.isCloseButton) {
                scene.remove(radialMenu);
                radialMenu = null;
                isMenuOpen = false;
                updateStatus('❌ Меню закрыто');
            } else if (button.userData.isSpawnButton) {
                spawnItem(button.userData.item);
                scene.remove(radialMenu);
                radialMenu = null;
                isMenuOpen = false;
                updateStatus(`✅ Создан: ${button.userData.item.name}`);
            }
        }
        
        // ==================== СПАВН ПРЕДМЕТОВ ====================
        function spawnItem(itemData) {
            let geometry, shape;
            
            if (itemData.type === 'ball') {
                geometry = new THREE.SphereGeometry(itemData.size, 16, 16);
                shape = new CANNON.Sphere(itemData.size);
            } else {
                geometry = new THREE.BoxGeometry(itemData.size, itemData.size, itemData.size);
                shape = new CANNON.Box(new CANNON.Vec3(
                    itemData.size/2, itemData.size/2, itemData.size/2
                ));
            }
            
            const material = new THREE.MeshBasicMaterial({ color: itemData.color });
            const mesh = new THREE.Mesh(geometry, material);
            
            // Спавним перед камерой
            const spawnPos = new THREE.Vector3(
                (Math.random() - 0.5) * 2,
                2 + Math.random(),
                2 + Math.random()
            );
            mesh.position.copy(spawnPos);
            scene.add(mesh);
            
            // Физическое тело
            const body = new CANNON.Body({
                mass: itemData.type === 'ball' ? 0.5 : 1,
                position: new CANNON.Vec3(spawnPos.x, spawnPos.y, spawnPos.z)
            });
            body.addShape(shape);
            body.linearDamping = 0.2;
            body.angularDamping = 0.3;
            world.addBody(body);
            
            const obj = {
                mesh: mesh,
                body: body,
                userData: {
                    name: itemData.name,
                    size: itemData.size,
                    type: itemData.type,
                    grabbed: false
                }
            };
            
            physicsObjects.push(obj);
            
            // Ограничиваем количество объектов
            if (physicsObjects.length > 30) {
                const old = physicsObjects.shift();
                scene.remove(old.mesh);
                world.remove(old.body);
            }
        }
        
        // ==================== УТИЛИТЫ ====================
        function updateStatus(text) {
            document.getElementById('status').textContent = text;
        }
        
        function updateFPS() {
            frameCount++;
            const now = performance.now();
            if (now - lastFpsUpdate >= 1000) {
                currentFps = frameCount;
                document.getElementById('fpsCounter').textContent = `FPS: ${currentFps}`;
                frameCount = 0;
                lastFpsUpdate = now;
            }
        }
        
        function onWindowResize() {
            camera.aspect = window.innerWidth / window.innerHeight;
            camera.updateProjectionMatrix();
            renderer.setSize(window.innerWidth, window.innerHeight);
            overlayCanvas.width = window.innerWidth;
            overlayCanvas.height = window.innerHeight;
        }
        
        // ==================== АНИМАЦИЯ ====================
        function animate() {
            if (!gameStarted) return;
            
            requestAnimationFrame(animate);
            
            // Обновляем физику
            world.step(1/60);
            
            // Синхронизация Three.js с Cannon.js
            physicsObjects.forEach(obj => {
                if (!obj.userData.grabbed) {
                    obj.mesh.position.copy(obj.body.position);
                    obj.mesh.quaternion.copy(obj.body.quaternion);
                }
            });
            
            // Обновляем меню если открыто
            if (isMenuOpen && radialMenu && currentHand) {
                // Получаем текущие landmarks из последней обработки
                // (нужно сохранить их глобально)
            }
            
            updateFPS();
            renderer.render(scene, camera);
        }
        
        // Переопределяем onHandResults чтобы обновлять меню
        const originalOnHandResults = onHandResults;
        onHandResults = function(results) {
            originalOnHandResults(results);
            
            if (isMenuOpen && radialMenu && results.multiHandLandmarks && results.multiHandLandmarks.length > 0) {
                checkMenuInteraction(results.multiHandLandmarks[0]);
            }
        };
    </script>
</body>
