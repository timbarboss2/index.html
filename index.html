<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no, maximum-scale=1.0">
  <title>Hand Tracking</title>
  <script src="https://cdn.jsdelivr.net/npm/@mediapipe/camera_utils/camera_utils.js" crossorigin="anonymous"></script>
  <script src="https://cdn.jsdelivr.net/npm/@mediapipe/hands/hands.js" crossorigin="anonymous"></script>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    html, body {
      width: 100%; height: 100%; overflow: hidden;
      background: #05070c; font-family: 'Segoe UI', system-ui, sans-serif; color: #fff;
    }

    #rotate-hint {
      display: none; position: fixed; inset: 0; z-index: 300;
      background: #0b0f1a; flex-direction: column; align-items: center;
      justify-content: center; gap: 16px; text-align: center; padding: 24px;
    }
    @media (orientation: portrait) {
      #rotate-hint { display: flex; }
      #startMenu, #game, #questMenu, #clockView, #browserView {
        visibility: hidden !important; pointer-events: none !important;
      }
    }

    #startMenu {
      position: fixed; inset: 0; z-index: 100;
      display: flex; flex-direction: column; align-items: center; justify-content: center;
      background: radial-gradient(ellipse at center, #152238 0%, #0a0e18 70%);
      gap: 14px; padding: 20px;
    }
    #startMenu h1 { font-size: clamp(1.3rem, 4vw, 1.9rem); font-weight: 600; }
    #startMenu .sub { opacity: 0.65; font-size: 0.9rem; margin-bottom: 6px; text-align: center; max-width: 320px; }
    .mode-btn {
      width: min(300px, 75vw); padding: 14px 20px;
      border: 1px solid rgba(120,180,255,0.35);
      border-radius: 18px;
      background: rgba(30,50,80,0.45);
      color: #fff; font-size: 1rem; cursor: pointer; text-align: left;
    }
    .mode-btn strong { display: block; font-size: 1.1rem; margin-bottom: 2px; }
    .mode-btn span { font-size: 0.78rem; opacity: 0.7; }
    #startMenu.hidden { display: none; }
    #startError {
      color: #ff8a80; font-size: 0.85rem; text-align: center; max-width: 90vw;
      min-height: 1.2em; margin-top: 8px;
    }

    /* Одна камера на весь экран */
    #game {
      position: fixed; inset: 0; display: none;
      width: 100vw; height: 100vh;
      background: #05070c;
    }
    #game.active { display: block; }

    #video {
      position: absolute; inset: 0;
      width: 100%; height: 100%;
      object-fit: cover;
      /* Живая рука скрыта — обводка руки как в Quest */
      opacity: 0;
      pointer-events: none;
    }
    #canvas {
      position: absolute; inset: 0;
      width: 100%; height: 100%;
      object-fit: cover;
      z-index: 70;
      pointer-events: none;
      transform: scaleX(-1);
    }

    #status {
      position: fixed; top: 12px; left: 50%; transform: translateX(-50%);
      z-index: 90; padding: 6px 14px; border-radius: 16px;
      background: rgba(0,0,0,0.55); font-size: 0.8rem;
      border: 1px solid rgba(120,180,255,0.25);
      pointer-events: none; white-space: nowrap;
    }

    #cursor {
      position: fixed; width: 28px; height: 28px; border-radius: 50%;
      border: 2px solid rgba(100,200,255,0.95);
      background: rgba(80,180,255,0.25);
      box-shadow: 0 0 16px rgba(80,180,255,0.6);
      z-index: 95; pointer-events: none; display: none;
      transform: translate(-50%, -50%);
    }
    #cursor.on { display: block; }

    /* Меню поверх камеры, скелет поверх меню */
    #questMenu {
      position: fixed; inset: 0; z-index: 50;
      display: none; align-items: center; justify-content: center;
      background: rgba(5, 10, 20, 0.72);
      backdrop-filter: blur(16px);
    }
    #questMenu.open { display: flex; }
    .quest-panel {
      padding: 36px 48px 28px; border-radius: 28px;
      background: linear-gradient(160deg, rgba(40,55,90,0.7), rgba(20,30,55,0.8));
      border: 1px solid rgba(140,180,255,0.28);
      box-shadow: 0 20px 60px rgba(0,0,0,0.45), 0 0 40px rgba(60,120,255,0.12);
      display: flex; flex-direction: column; align-items: center; gap: 28px;
      min-width: min(420px, 90vw);
    }
    .quest-title {
      font-size: 1.05rem; letter-spacing: 2px; text-transform: uppercase; opacity: 0.85;
    }
    .quest-icons { display: flex; gap: 36px; }
    .q-icon {
      width: 100px; height: 100px; border-radius: 50%;
      background: linear-gradient(145deg, rgba(50,70,110,0.75), rgba(25,40,70,0.85));
      border: 2px solid rgba(130,180,255,0.35);
      display: flex; flex-direction: column; align-items: center; justify-content: center;
      position: relative;
      transition: transform 0.2s, border-color 0.2s, box-shadow 0.2s;
    }
    .q-icon .emoji { font-size: 2.4rem; line-height: 1; }
    .q-icon .q-label {
      position: absolute; bottom: -28px; left: 50%; transform: translateX(-50%);
      font-size: 0.8rem; white-space: nowrap; opacity: 0.85;
    }
    .q-icon.hover {
      transform: scale(1.08);
      border-color: rgba(120,200,255,0.95);
      box-shadow: 0 0 32px rgba(80,180,255,0.45);
    }
    .q-icon canvas.prog {
      position: absolute; inset: -5px; width: calc(100% + 10px); height: calc(100% + 10px);
      pointer-events: none;
    }
    .quest-hint {
      margin-top: 18px; font-size: 0.78rem; opacity: 0.55; text-align: center; line-height: 1.4;
    }

    #clockView {
      position: fixed; inset: 0; z-index: 55;
      display: none; flex-direction: column; align-items: center; justify-content: center;
      background: rgba(5,10,20,0.78); backdrop-filter: blur(14px); gap: 10px;
    }
    #clockView.open { display: flex; }
    #clockView .time {
      font-size: clamp(3rem, 12vw, 5.5rem); font-weight: 300; letter-spacing: 4px;
      text-shadow: 0 0 30px rgba(100,180,255,0.5);
    }
    #clockView .date { font-size: clamp(1rem, 3.5vw, 1.5rem); opacity: 0.8; }
    #clockView .hint { margin-top: 28px; font-size: 0.8rem; opacity: 0.5; }

    #browserView {
      position: fixed; inset: 0; z-index: 55;
      display: none; flex-direction: column; background: #0b0f1a;
    }
    #browserView.open { display: flex; }
    .browser-bar {
      display: flex; gap: 8px; padding: 10px 12px;
      background: rgba(15,25,45,0.95); border-bottom: 1px solid rgba(100,160,255,0.2);
      align-items: center;
    }
    .browser-bar input {
      flex: 1; padding: 10px 14px; border-radius: 14px;
      border: 1px solid rgba(100,160,255,0.3);
      background: rgba(20,35,60,0.8); color: #fff; font-size: 0.95rem; outline: none;
    }
    .browser-bar button {
      padding: 10px 16px; border-radius: 14px; border: none;
      background: linear-gradient(135deg, #3a7bd5, #2b5ea8);
      color: #fff; font-size: 0.9rem; cursor: pointer; white-space: nowrap;
    }
    #browserFrame { flex: 1; width: 100%; border: none; background: #fff; }
    .browser-hint {
      padding: 6px; font-size: 0.72rem; opacity: 0.55; text-align: center;
      background: rgba(0,0,0,0.35);
    }
  </style>
</head>
<body>
  <div id="rotate-hint">
    <div style="font-size:2.8rem">📱</div>
    <div>Поверни телефон горизонтально</div>
  </div>

  <div id="startMenu">
    <h1>Hand Tracking</h1>
    <p class="sub">Одна камера · рука скрыта · обводка руки как в Quest · меню жестами</p>
    <button class="mode-btn" id="btnFull" type="button">
      <strong>Обводка руки</strong>
      <span>Силуэт как в Meta Quest 3</span>
    </button>
    <button class="mode-btn" id="btnTips" type="button">
      <strong>Только кончики</strong>
      <span>Быстрее на слабых телефонах</span>
    </button>
    <div id="startError"></div>
  </div>

  <div id="status">—</div>

  <div id="game">
    <!-- Видео скрыто (opacity:0), трекинг идёт, видна только обводка руки -->
    <video id="video" playsinline autoplay muted></video>
    <canvas id="canvas"></canvas>
  </div>

  <div id="cursor"></div>

  <!-- Меню на камере; скелет рисуется поверх (z-index canvas выше) -->
  <div id="questMenu">
    <div class="quest-panel">
      <div class="quest-title">Меню</div>
      <div class="quest-icons">
        <div class="q-icon" id="iconClock">
          <canvas class="prog" width="110" height="110"></canvas>
          <div class="emoji">🕐</div>
          <div class="q-label">Часы</div>
        </div>
        <div class="q-icon" id="iconBrowser">
          <canvas class="prog" width="110" height="110"></canvas>
          <div class="emoji">🌐</div>
          <div class="q-label">Браузер</div>
        </div>
      </div>
      <div class="quest-hint">
        Наведи указательный · 3 сек<br>
        Двойной щипок — закрыть
      </div>
    </div>
  </div>

  <div id="clockView">
    <div class="time" id="cvTime">00:00:00</div>
    <div class="date" id="cvDate">—</div>
    <div class="hint">Двойной щипок — назад</div>
  </div>

  <div id="browserView">
    <div class="browser-bar">
      <input type="text" id="searchInput" placeholder="Поиск..." enterkeyhint="search">
      <button id="btnSearch" type="button">Найти</button>
      <button id="btnBrowserBack" type="button">Назад</button>
    </div>
    <div class="browser-hint">Двойной щипок — закрыть</div>
    <iframe id="browserFrame" src="about:blank" sandbox="allow-scripts allow-same-origin allow-forms allow-popups"></iframe>
  </div>

  <script>
    const video = document.getElementById('video');
    const canvas = document.getElementById('canvas');
    const ctx = canvas.getContext('2d');
    const startMenu = document.getElementById('startMenu');
    const startError = document.getElementById('startError');
    const game = document.getElementById('game');
    const statusEl = document.getElementById('status');
    const questMenu = document.getElementById('questMenu');
    const clockView = document.getElementById('clockView');
    const browserView = document.getElementById('browserView');
    const cursor = document.getElementById('cursor');
    const iconClock = document.getElementById('iconClock');
    const iconBrowser = document.getElementById('iconBrowser');
    const searchInput = document.getElementById('searchInput');
    const browserFrame = document.getElementById('browserFrame');

    let tipsOnly = false;
    let running = false;
    // live | menu | clock | browser
    let ui = 'live';

    const TIP_IDX = [4, 8, 12, 16, 20];
    const TIP_COL = ['#FF6B6B', '#4ECDC4', '#FFE66D', '#95E1D3', '#F38181'];

    const isWeak = (() => {
      const c = navigator.hardwareConcurrency || 2;
      const m = navigator.deviceMemory || 2;
      return /Android|iPhone|iPad/i.test(navigator.userAgent) && (c <= 4 || m <= 3);
    })();
    const W = isWeak ? 480 : 640;
    const H = isWeak ? 360 : 480;

    function setStatus(t) { statusEl.textContent = t; }

    // Быстрое сглаживание с минимальной задержкой
    const SMOOTH = 0.72;
    let smoothState = [null, null];

    function smoothHand(lm, handIdx) {
      if (!smoothState[handIdx]) {
        smoothState[handIdx] = lm.map(p => ({ x: p.x, y: p.y, z: p.z || 0 }));
        return smoothState[handIdx];
      }
      const prev = smoothState[handIdx];
      for (let i = 0; i < lm.length; i++) {
        prev[i].x = SMOOTH * lm[i].x + (1 - SMOOTH) * prev[i].x;
        prev[i].y = SMOOTH * lm[i].y + (1 - SMOOTH) * prev[i].y;
        prev[i].z = SMOOTH * (lm[i].z || 0) + (1 - SMOOTH) * prev[i].z;
      }
      return prev;
    }
    function resetSmooth(i) { smoothState[i] = null; }

    // Щипок
    let wasPinch = false, lastPinchUp = 0, pinchClicks = 0;
    function handSpan(lm) {
      const dx = lm[0].x - lm[12].x, dy = lm[0].y - lm[12].y;
      return Math.sqrt(dx * dx + dy * dy);
    }
    function checkPinch(lm) {
      const span = handSpan(lm);
      if (span < 0.045 || span > 0.7) return false;
      const dx = lm[4].x - lm[8].x, dy = lm[4].y - lm[8].y;
      const d = Math.sqrt(dx * dx + dy * dy);
      return d < Math.max(0.035, Math.min(0.1, 0.055 * (span / 0.18)));
    }
    function onPinchFrame(pinching) {
      if (pinching && !wasPinch) wasPinch = true;
      else if (!pinching && wasPinch) {
        wasPinch = false;
        const t = performance.now();
        pinchClicks = (t - lastPinchUp < 800) ? pinchClicks + 1 : 1;
        lastPinchUp = t;
        if (pinchClicks >= 2) { pinchClicks = 0; doublePinch(); }
      }
    }
    function doublePinch() {
      if (ui === 'live') openMenu();
      else if (ui === 'menu') closeMenu();
      else if (ui === 'clock') { clockView.classList.remove('open'); openMenu(); }
      else if (ui === 'browser') { browserView.classList.remove('open'); openMenu(); }
    }

    function openMenu() {
      ui = 'menu';
      questMenu.classList.add('open');
      clockView.classList.remove('open');
      browserView.classList.remove('open');
      cursor.classList.add('on');
      resetDwell();
    }
    function closeMenu() {
      ui = 'live';
      questMenu.classList.remove('open');
      cursor.classList.remove('on');
      resetDwell();
    }
    function openClock() {
      ui = 'clock';
      questMenu.classList.remove('open');
      tickClock();
      clockView.classList.add('open');
      cursor.classList.remove('on');
      resetDwell();
    }
    function openBrowser() {
      ui = 'browser';
      questMenu.classList.remove('open');
      browserView.classList.add('open');
      cursor.classList.remove('on');
      resetDwell();
      if (!browserFrame.src || browserFrame.src === 'about:blank') {
        browserFrame.src = 'https://duckduckgo.com/';
      }
    }

    function tickClock() {
      const n = new Date();
      const p = v => String(v).padStart(2, '0');
      document.getElementById('cvTime').textContent =
        p(n.getHours()) + ':' + p(n.getMinutes()) + ':' + p(n.getSeconds());
      const days = ['Воскресенье','Понедельник','Вторник','Среда','Четверг','Пятница','Суббота'];
      const months = ['января','февраля','марта','апреля','мая','июня','июля','августа','сентября','октября','ноября','декабря'];
      document.getElementById('cvDate').textContent =
        days[n.getDay()] + ', ' + n.getDate() + ' ' + months[n.getMonth()] + ' ' + n.getFullYear();
    }
    setInterval(() => { if (ui === 'clock') tickClock(); }, 1000);

    // Dwell 3 сек
    const DWELL = 3000;
    let dwellId = null, dwellT0 = 0;
    function resetDwell() {
      dwellId = null; dwellT0 = 0;
      drawRing(iconClock, 0); drawRing(iconBrowser, 0);
      iconClock.classList.remove('hover'); iconBrowser.classList.remove('hover');
    }
    function drawRing(el, ratio) {
      const c = el.querySelector('.prog');
      const g = c.getContext('2d');
      const s = c.width, cx = s / 2, cy = s / 2, r = s / 2 - 4;
      g.clearRect(0, 0, s, s);
      if (ratio <= 0) return;
      g.beginPath();
      g.arc(cx, cy, r, -Math.PI / 2, -Math.PI / 2 + ratio * Math.PI * 2);
      g.strokeStyle = 'rgba(120,200,255,0.95)';
      g.lineWidth = 4; g.lineCap = 'round'; g.stroke();
    }
    function hitIcon(x, y, el) {
      const r = el.getBoundingClientRect();
      return x >= r.left && x <= r.right && y >= r.top && y <= r.bottom;
    }
    function updateDwell(x, y) {
      if (ui !== 'menu') return;
      let hit = null;
      if (hitIcon(x, y, iconClock)) hit = 'clock';
      else if (hitIcon(x, y, iconBrowser)) hit = 'browser';
      if (hit !== dwellId) {
        dwellId = hit;
        dwellT0 = hit ? performance.now() : 0;
        iconClock.classList.toggle('hover', hit === 'clock');
        iconBrowser.classList.toggle('hover', hit === 'browser');
        if (!hit) { drawRing(iconClock, 0); drawRing(iconBrowser, 0); }
      }
      if (dwellId) {
        const ratio = Math.min(1, (performance.now() - dwellT0) / DWELL);
        if (dwellId === 'clock') { drawRing(iconClock, ratio); drawRing(iconBrowser, 0); }
        else { drawRing(iconBrowser, ratio); drawRing(iconClock, 0); }
        if (ratio >= 1) {
          const a = dwellId; resetDwell();
          if (a === 'clock') openClock(); else openBrowser();
        }
      }
    }

    // Фронт + зеркало: экран X = (1 - tip.x)
    function tipScreen(lm) {
      return {
        x: (1 - lm[8].x) * window.innerWidth,
        y: lm[8].y * window.innerHeight
      };
    }

    // Quest-style solid hand mesh (не скелет)
    const FINGERS = [
      [1, 2, 3, 4],       // thumb
      [5, 6, 7, 8],       // index
      [9, 10, 11, 12],    // middle
      [13, 14, 15, 16],   // ring
      [17, 18, 19, 20]    // pinky
    ];
    // Контур ладони
    const PALM = [0, 1, 5, 9, 13, 17];

    function px(lm, i, w, h) {
      return { x: lm[i].x * w, y: lm[i].y * h };
    }

    function palmScale(lm, w, h) {
      const a = px(lm, 0, w, h), b = px(lm, 9, w, h);
      return Math.max(Math.hypot(a.x - b.x, a.y - b.y), 12);
    }

    // Толстый сегмент пальца как капсула (Quest look)
    function drawCapsule(ctx, ax, ay, bx, by, r, fill, stroke) {
      const dx = bx - ax, dy = by - ay;
      const len = Math.hypot(dx, dy) || 1;
      const nx = -dy / len, ny = dx / len;
      ctx.beginPath();
      ctx.moveTo(ax + nx * r, ay + ny * r);
      ctx.lineTo(bx + nx * r, by + ny * r);
      ctx.arc(bx, by, r, Math.atan2(ny, nx), Math.atan2(-ny, -nx));
      ctx.lineTo(ax - nx * r, ay - ny * r);
      ctx.arc(ax, ay, r, Math.atan2(-ny, -nx), Math.atan2(ny, nx));
      ctx.closePath();
      ctx.fillStyle = fill;
      ctx.fill();
      if (stroke) {
        ctx.strokeStyle = stroke;
        ctx.lineWidth = 1.5;
        ctx.stroke();
      }
    }

    function drawQuestHand(lm, w, h) {
      const scale = palmScale(lm, w, h);
      const baseR = scale * 0.22;
      const tipR = scale * 0.14;
      const fill = 'rgba(210, 225, 255, 0.42)';
      const fillDeep = 'rgba(160, 195, 255, 0.28)';
      const stroke = 'rgba(230, 240, 255, 0.85)';
      const glow = 'rgba(120, 180, 255, 0.35)';

      ctx.save();
      ctx.shadowColor = glow;
      ctx.shadowBlur = 18;

      // Ладонь — залитый многоугольник
      ctx.beginPath();
      PALM.forEach((idx, i) => {
        const p = px(lm, idx, w, h);
        if (i === 0) ctx.moveTo(p.x, p.y);
        else ctx.lineTo(p.x, p.y);
      });
      // скругление к запястью через точку 0
      ctx.closePath();
      ctx.fillStyle = fillDeep;
      ctx.fill();
      ctx.strokeStyle = stroke;
      ctx.lineWidth = 2;
      ctx.stroke();

      // Запястье / основание ладони
      const wrist = px(lm, 0, w, h);
      ctx.beginPath();
      ctx.arc(wrist.x, wrist.y, baseR * 0.85, 0, Math.PI * 2);
      ctx.fillStyle = fillDeep;
      ctx.fill();

      // Пальцы — капсулы по суставам
      FINGERS.forEach((chain, fi) => {
        // радиусы: толще у основания, тоньше к кончику
        const radii = fi === 0
          ? [baseR * 0.72, baseR * 0.62, tipR * 1.15, tipR]
          : [baseR * 0.7, baseR * 0.58, tipR * 1.2, tipR];
        for (let i = 0; i < chain.length - 1; i++) {
          const a = px(lm, chain[i], w, h);
          const b = px(lm, chain[i + 1], w, h);
          const r = (radii[i] + radii[i + 1]) * 0.5;
          drawCapsule(ctx, a.x, a.y, b.x, b.y, r, fill, stroke);
        }
        // кончик пальца
        const tip = px(lm, chain[chain.length - 1], w, h);
        ctx.beginPath();
        ctx.arc(tip.x, tip.y, radii[radii.length - 1], 0, Math.PI * 2);
        ctx.fillStyle = fill;
        ctx.fill();
        ctx.strokeStyle = stroke;
        ctx.lineWidth = 1.5;
        ctx.stroke();
      });

      // Внешний контур ладони + основания пальцев (обводка Quest)
      ctx.beginPath();
      const outline = [0, 1, 2, 3, 4, 3, 2, 5, 6, 7, 8, 7, 6, 5, 9, 10, 11, 12, 11, 10, 9, 13, 14, 15, 16, 15, 14, 13, 17, 18, 19, 20, 19, 18, 17, 0];
      // Проще: обвести силуэт по внешним точкам
      const hull = [0, 1, 2, 3, 4, 8, 12, 16, 20, 19, 18, 17];
      hull.forEach((idx, i) => {
        const p = px(lm, idx, w, h);
        if (i === 0) ctx.moveTo(p.x, p.y);
        else ctx.lineTo(p.x, p.y);
      });
      ctx.closePath();
      ctx.strokeStyle = 'rgba(255,255,255,0.55)';
      ctx.lineWidth = 2.2;
      ctx.stroke();

      ctx.restore();
    }

    function drawTips(lm, w, h) {
      // Режим кончиков — тоже Quest-style, только кончики + короткие сегменты
      const scale = palmScale(lm, w, h);
      const r = scale * 0.16;
      const fill = 'rgba(210, 225, 255, 0.5)';
      const stroke = 'rgba(230, 240, 255, 0.9)';
      ctx.save();
      ctx.shadowColor = 'rgba(120,180,255,0.4)';
      ctx.shadowBlur = 12;
      TIP_IDX.forEach((idx) => {
        const p = px(lm, idx, w, h);
        ctx.beginPath();
        ctx.arc(p.x, p.y, r, 0, Math.PI * 2);
        ctx.fillStyle = fill;
        ctx.fill();
        ctx.strokeStyle = stroke;
        ctx.lineWidth = 1.5;
        ctx.stroke();
      });
      ctx.restore();
    }

    function paint(list) {
      if (canvas.width !== video.videoWidth || canvas.height !== video.videoHeight) {
        canvas.width = video.videoWidth || W;
        canvas.height = video.videoHeight || H;
      }
      ctx.clearRect(0, 0, canvas.width, canvas.height);
      list.forEach(lm => {
        if (tipsOnly) drawTips(lm, canvas.width, canvas.height);
        else drawQuestHand(lm, canvas.width, canvas.height);
      });
    }

    let hands, camera, stream;

    function onResults(res) {
      const det = res.multiHandLandmarks || [];
      const list = [];
      let pinching = false;
      let primary = null;
      for (let i = 0; i < 2; i++) {
        if (i < det.length) {
          const s = smoothHand(det[i], i);
          list.push(s);
          if (checkPinch(s)) pinching = true;
          if (!primary) primary = s;
        } else resetSmooth(i);
      }
      if (!running) return;
      paint(list);
      onPinchFrame(pinching);

      if (det.length > 0) {
        setStatus('Рук: ' + det.length + (pinching ? ' · щипок' : '') + ' · двойной щипок = меню');
      } else {
        setStatus('Покажи руку камере · видна только обводка руки');
      }

      if (primary && ui === 'menu') {
        const p = tipScreen(primary);
        cursor.style.left = p.x + 'px';
        cursor.style.top = p.y + 'px';
        cursor.classList.add('on');
        updateDwell(p.x, p.y);
      } else if (ui !== 'menu') {
        cursor.classList.remove('on');
      }
    }

    async function startCam() {
      startError.textContent = '';
      setStatus('Запрос камеры...');

      if (location.protocol === 'file:') {
        startError.textContent = 'Открой через localhost или https — file:// часто блокирует камеру.';
      }

      try {
        stream = await navigator.mediaDevices.getUserMedia({
          video: {
            facingMode: { ideal: 'user' },
            width: { ideal: W },
            height: { ideal: H },
            frameRate: { ideal: 30, max: 30 }
          },
          audio: false
        });
      } catch (e1) {
        try {
          stream = await navigator.mediaDevices.getUserMedia({ video: true, audio: false });
          startError.textContent = 'Включена камера по умолчанию.';
        } catch (e2) {
          startError.textContent = 'Камера недоступна: ' + (e2.message || e2.name);
          setStatus('Ошибка камеры');
          throw e2;
        }
      }

      video.srcObject = stream;
      await new Promise(r => { video.onloadeddata = r; video.play().catch(() => {}); });

      setStatus('Загрузка модели...');

      if (typeof Hands === 'undefined') {
        startError.textContent = 'MediaPipe не загрузился. Нужен интернет.';
        setStatus('Нет MediaPipe');
        throw new Error('Hands undefined');
      }

      hands = new Hands({
        locateFile: f => 'https://cdn.jsdelivr.net/npm/@mediapipe/hands/' + f
      });
      hands.setOptions({
        maxNumHands: 2,
        modelComplexity: 0,
        minDetectionConfidence: 0.5,
        minTrackingConfidence: 0.45
      });
      hands.onResults(onResults);

      camera = new Camera(video, {
        onFrame: async () => {
          try { await hands.send({ image: video }); }
          catch (e) { console.warn(e); }
        },
        width: W,
        height: H
      });
      await camera.start();
      running = true;
      setStatus('Готово · покажи руку · видна только обводка руки');

      try {
        if (screen.orientation && screen.orientation.lock) {
          await screen.orientation.lock('landscape');
        }
      } catch (e) {}
    }

    function doSearch() {
      let q = searchInput.value.trim();
      if (!q) return;
      if (!/^https?:\/\//i.test(q)) q = 'https://duckduckgo.com/?q=' + encodeURIComponent(q);
      browserFrame.src = q;
    }
    document.getElementById('btnSearch').onclick = doSearch;
    searchInput.addEventListener('keydown', e => { if (e.key === 'Enter') doSearch(); });
    document.getElementById('btnBrowserBack').onclick = () => {
      browserView.classList.remove('open');
      openMenu();
    };

    function boot(tips) {
      tipsOnly = tips;
      startMenu.classList.add('hidden');
      game.classList.add('active');
      startCam().catch(e => {
        console.error(e);
        startMenu.classList.remove('hidden');
        game.classList.remove('active');
        if (!startError.textContent) startError.textContent = 'Ошибка: ' + (e.message || e);
      });
    }
    document.getElementById('btnFull').onclick = () => boot(false);
    document.getElementById('btnTips').onclick = () => boot(true);
  </script>
</body>
</html>
