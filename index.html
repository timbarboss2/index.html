<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
  <title>Hand Tracking</title>
  <script src="https://cdn.jsdelivr.net/npm/@mediapipe/camera_utils/camera_utils.js" crossorigin="anonymous"></script>
  <script src="https://cdn.jsdelivr.net/npm/@mediapipe/drawing_utils/drawing_utils.js" crossorigin="anonymous"></script>
  <script src="https://cdn.jsdelivr.net/npm/@mediapipe/hands/hands.js" crossorigin="anonymous"></script>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    html, body {
      width: 100%;
      height: 100%;
      overflow: hidden;
      background: #000;
    }
    #container {
      position: fixed;
      inset: 0;
      width: 100vw;
      height: 100vh;
    }
    video, canvas {
      position: absolute;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      object-fit: cover;
      transform: scaleX(-1);
    }
    video { z-index: 1; }
    canvas {
      z-index: 2;
      pointer-events: none;
    }
  </style>
</head>
<body>
  <div id="container">
    <video id="video" playsinline autoplay muted></video>
    <canvas id="canvas"></canvas>
  </div>

  <script>
    const video = document.getElementById('video');
    const canvas = document.getElementById('canvas');
    const ctx = canvas.getContext('2d');

    const HAND_CONNECTIONS = [
      [0, 1], [1, 2], [2, 3], [3, 4],
      [0, 5], [5, 6], [6, 7], [7, 8],
      [0, 9], [9, 10], [10, 11], [11, 12],
      [0, 13], [13, 14], [14, 15], [15, 16],
      [0, 17], [17, 18], [18, 19], [19, 20],
      [5, 9], [9, 13], [13, 17]
    ];

    const FINGER_COLORS = {
      thumb:  '#FF6B6B',
      index:  '#4ECDC4',
      middle: '#FFE66D',
      ring:   '#95E1D3',
      pinky:  '#F38181',
      palm:   '#A8DADC'
    };

    function getConnectionColor(i, j) {
      if (i <= 4 || j <= 4) return FINGER_COLORS.thumb;
      if ((i >= 5 && i <= 8) || (j >= 5 && j <= 8)) return FINGER_COLORS.index;
      if ((i >= 9 && i <= 12) || (j >= 9 && j <= 12)) return FINGER_COLORS.middle;
      if ((i >= 13 && i <= 16) || (j >= 13 && j <= 16)) return FINGER_COLORS.ring;
      if ((i >= 17 && i <= 20) || (j >= 17 && j <= 20)) return FINGER_COLORS.pinky;
      return FINGER_COLORS.palm;
    }

    function drawSkeleton(landmarks) {
      const w = canvas.width;
      const h = canvas.height;

      // Glow under palm
      const px = landmarks[0].x * w;
      const py = landmarks[0].y * h;
      const glow = ctx.createRadialGradient(px, py, 4, px, py, 80);
      glow.addColorStop(0, 'rgba(0, 229, 255, 0.25)');
      glow.addColorStop(1, 'rgba(0, 229, 255, 0)');
      ctx.fillStyle = glow;
      ctx.beginPath();
      ctx.arc(px, py, 80, 0, Math.PI * 2);
      ctx.fill();

      // Bones
      HAND_CONNECTIONS.forEach(([i, j]) => {
        const x1 = landmarks[i].x * w;
        const y1 = landmarks[i].y * h;
        const x2 = landmarks[j].x * w;
        const y2 = landmarks[j].y * h;
        const color = getConnectionColor(i, j);

        ctx.beginPath();
        ctx.moveTo(x1, y1);
        ctx.lineTo(x2, y2);
        ctx.strokeStyle = 'rgba(0,0,0,0.5)';
        ctx.lineWidth = 8;
        ctx.lineCap = 'round';
        ctx.stroke();

        ctx.beginPath();
        ctx.moveTo(x1, y1);
        ctx.lineTo(x2, y2);
        ctx.strokeStyle = color;
        ctx.lineWidth = 4.5;
        ctx.lineCap = 'round';
        ctx.stroke();

        ctx.beginPath();
        ctx.moveTo(x1, y1);
        ctx.lineTo(x2, y2);
        ctx.strokeStyle = 'rgba(255,255,255,0.4)';
        ctx.lineWidth = 1.6;
        ctx.lineCap = 'round';
        ctx.stroke();
      });

      // Joints
      landmarks.forEach((lm, idx) => {
        const x = lm.x * w;
        const y = lm.y * h;
        let r = 5;
        let color = '#FFFFFF';

        if (idx === 0) { r = 9; color = '#00E5FF'; }
        else if ([4, 8, 12, 16, 20].includes(idx)) { r = 7; color = '#FFD700'; }
        else if ([5, 9, 13, 17].includes(idx)) { r = 6; color = '#80DEEA'; }

        ctx.beginPath();
        ctx.arc(x, y, r + 2.5, 0, Math.PI * 2);
        ctx.fillStyle = 'rgba(0,0,0,0.35)';
        ctx.fill();

        ctx.beginPath();
        ctx.arc(x, y, r, 0, Math.PI * 2);
        ctx.fillStyle = color;
        ctx.fill();

        ctx.beginPath();
        ctx.arc(x - r * 0.28, y - r * 0.28, r * 0.32, 0, Math.PI * 2);
        ctx.fillStyle = 'rgba(255,255,255,0.65)';
        ctx.fill();
      });
    }

    function onResults(results) {
      if (canvas.width !== video.videoWidth || canvas.height !== video.videoHeight) {
        canvas.width = video.videoWidth || window.innerWidth;
        canvas.height = video.videoHeight || window.innerHeight;
      }

      ctx.save();
      ctx.clearRect(0, 0, canvas.width, canvas.height);
      ctx.scale(-1, 1);
      ctx.translate(-canvas.width, 0);

      if (results.multiHandLandmarks) {
        for (const landmarks of results.multiHandLandmarks) {
          drawSkeleton(landmarks);
        }
      }
      ctx.restore();
    }

    async function start() {
      const hands = new Hands({
        locateFile: (file) => `https://cdn.jsdelivr.net/npm/@mediapipe/hands/${file}`
      });
      hands.setOptions({
        maxNumHands: 2,
        modelComplexity: 1,
        minDetectionConfidence: 0.7,
        minTrackingConfidence: 0.6
      });
      hands.onResults(onResults);

      const stream = await navigator.mediaDevices.getUserMedia({
        video: {
          facingMode: 'user',
          width: { ideal: 1920 },
          height: { ideal: 1080 }
        },
        audio: false
      });
      video.srcObject = stream;
      await video.play();

      const camera = new Camera(video, {
        onFrame: async () => {
          await hands.send({ image: video });
        },
        width: 1920,
        height: 1080
      });
      camera.start();
    }

    start().catch(console.error);
  </script>
</body>
</html>
