<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
  <title>Hand Tracking</title>
  <script src="https://cdn.jsdelivr.net/npm/@mediapipe/camera_utils/camera_utils.js" crossorigin="anonymous"></script>
  <script src="https://cdn.jsdelivr.net/npm/@mediapipe/hands/hands.js" crossorigin="anonymous"></script>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    html, body {
      width: 100%;
      height: 100%;
      overflow: hidden;
      background: #000;
    }
    #container {
      position: fixed;
      inset: 0;
      width: 100vw;
      height: 100vh;
    }
    video, canvas {
      position: absolute;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      object-fit: cover;
    }
    video { z-index: 1; }
    canvas {
      z-index: 2;
      pointer-events: none;
    }
  </style>
</head>
<body>
  <div id="container">
    <video id="video" playsinline autoplay muted></video>
    <canvas id="canvas"></canvas>
  </div>

  <script>
    const video = document.getElementById('video');
    const canvas = document.getElementById('canvas');
    const ctx = canvas.getContext('2d');

    // ===== Определение слабого устройства =====
    const isWeakDevice = (() => {
      const cores = navigator.hardwareConcurrency || 2;
      const memory = navigator.deviceMemory || 2;
      const isMobile = /Android|iPhone|iPad|iPod/i.test(navigator.userAgent);
      return isMobile && (cores <= 4 || memory <= 3);
    })();

    // ===== Уровни качества (адаптивные) =====
    const QUALITY_LEVELS = [
      { w: 480, h: 360, complexity: 0, fps: 20 }, // 0 — самый лёгкий
      { w: 640, h: 480, complexity: 0, fps: 24 }, // 1
      { w: 960, h: 720, complexity: 1, fps: 30 }  // 2 — максимальный
    ];

    let qualityIndex = isWeakDevice ? 1 : 2;
    let currentQuality = QUALITY_LEVELS[qualityIndex];

    // ===== FPS для адаптации =====
    let frameCount = 0;
    let lastFpsTime = performance.now();
    let currentFps = 30;
    let lowFpsStreak = 0;
    let highFpsStreak = 0;

    // ===== Сглаживание landmarks (EMA) =====
    // alpha ближе к 1 = меньше сглаживания (быстрее реакция)
    // alpha ближе к 0 = сильнее сглаживание (меньше дрожи)
    const SMOOTH_ALPHA = isWeakDevice ? 0.45 : 0.55;
    // Храним сглаженные точки для каждой руки (до 2 рук)
    let smoothedHands = [null, null];

    function smoothLandmarks(newLandmarks, handIdx) {
      if (!smoothedHands[handIdx]) {
        // Первый кадр — просто копируем
        smoothedHands[handIdx] = newLandmarks.map(p => ({ x: p.x, y: p.y, z: p.z }));
        return smoothedHands[handIdx];
      }

      const prev = smoothedHands[handIdx];
      for (let i = 0; i < newLandmarks.length; i++) {
        prev[i].x = SMOOTH_ALPHA * newLandmarks[i].x + (1 - SMOOTH_ALPHA) * prev[i].x;
        prev[i].y = SMOOTH_ALPHA * newLandmarks[i].y + (1 - SMOOTH_ALPHA) * prev[i].y;
        prev[i].z = SMOOTH_ALPHA * newLandmarks[i].z + (1 - SMOOTH_ALPHA) * prev[i].z;
      }
      return prev;
    }

    // Сброс сглаживания, если рука пропала
    function resetSmooth(handIdx) {
      smoothedHands[handIdx] = null;
    }

    // ===== Соединения и цвета =====
    const HAND_CONNECTIONS = [
      [0, 1], [1, 2], [2, 3], [3, 4],
      [0, 5], [5, 6], [6, 7], [7, 8],
      [0, 9], [9, 10], [10, 11], [11, 12],
      [0, 13], [13, 14], [14, 15], [15, 16],
      [0, 17], [17, 18], [18, 19], [19, 20],
      [5, 9], [9, 13], [13, 17]
    ];

    const FINGER_COLORS = {
      thumb:  '#FF6B6B',
      index:  '#4ECDC4',
      middle: '#FFE66D',
      ring:   '#95E1D3',
      pinky:  '#F38181',
      palm:   '#A8DADC'
    };

    function getConnectionColor(i, j) {
      if (i <= 4 || j <= 4) return FINGER_COLORS.thumb;
      if ((i >= 5 && i <= 8) || (j >= 5 && j <= 8)) return FINGER_COLORS.index;
      if ((i >= 9 && i <= 12) || (j >= 9 && j <= 12)) return FINGER_COLORS.middle;
      if ((i >= 13 && i <= 16) || (j >= 13 && j <= 16)) return FINGER_COLORS.ring;
      if ((i >= 17 && i <= 20) || (j >= 17 && j <= 20)) return FINGER_COLORS.pinky;
      return FINGER_COLORS.palm;
    }

    function drawSkeleton(landmarks) {
      const w = canvas.width;
      const h = canvas.height;

      // Свечение ладони
      const px = landmarks[0].x * w;
      const py = landmarks[0].y * h;
      ctx.beginPath();
      ctx.arc(px, py, qualityIndex === 0 ? 30 : 55, 0, Math.PI * 2);
      ctx.fillStyle = 'rgba(0, 229, 255, 0.16)';
      ctx.fill();

      // Кости
      const lineW = qualityIndex === 0 ? 3 : 4.2;
      HAND_CONNECTIONS.forEach(([i, j]) => {
        const x1 = landmarks[i].x * w;
        const y1 = landmarks[i].y * h;
        const x2 = landmarks[j].x * w;
        const y2 = landmarks[j].y * h;

        ctx.beginPath();
        ctx.moveTo(x1, y1);
        ctx.lineTo(x2, y2);
        ctx.strokeStyle = getConnectionColor(i, j);
        ctx.lineWidth = lineW;
        ctx.lineCap = 'round';
        ctx.stroke();
      });

      // Суставы
      landmarks.forEach((lm, idx) => {
        const x = lm.x * w;
        const y = lm.y * h;
        let r = qualityIndex === 0 ? 3.5 : 5;
        let color = '#FFFFFF';

        if (idx === 0) { r = qualityIndex === 0 ? 6 : 8; color = '#00E5FF'; }
        else if ([4, 8, 12, 16, 20].includes(idx)) { r = qualityIndex === 0 ? 5 : 6.5; color = '#FFD700'; }
        else if ([5, 9, 13, 17].includes(idx)) { r = qualityIndex === 0 ? 4.5 : 5.5; color = '#80DEEA'; }

        ctx.beginPath();
        ctx.arc(x, y, r, 0, Math.PI * 2);
        ctx.fillStyle = color;
        ctx.fill();
      });
    }

    // ===== Адаптивное качество =====
    function updateAdaptiveQuality() {
      frameCount++;
      const now = performance.now();
      if (now - lastFpsTime < 1000) return;

      currentFps = frameCount;
      frameCount = 0;
      lastFpsTime = now;

      // Если FPS низкий — понижаем качество
      if (currentFps < 15 && qualityIndex > 0) {
        lowFpsStreak++;
        highFpsStreak = 0;
        if (lowFpsStreak >= 2) { // 2 секунды подряд низкий FPS
          qualityIndex--;
          currentQuality = QUALITY_LEVELS[qualityIndex];
          lowFpsStreak = 0;
          applyQuality();
        }
      }
      // Если FPS высокий — можем повысить
      else if (currentFps > 26 && qualityIndex < QUALITY_LEVELS.length - 1 && !isWeakDevice) {
        highFpsStreak++;
        lowFpsStreak = 0;
        if (highFpsStreak >= 3) {
          qualityIndex++;
          currentQuality = QUALITY_LEVELS[qualityIndex];
          highFpsStreak = 0;
          applyQuality();
        }
      } else {
        lowFpsStreak = 0;
        highFpsStreak = 0;
      }
    }

    let hands = null;
    let camera = null;
    let stream = null;

    async function applyQuality() {
      // Меняем настройки модели
      if (hands) {
        hands.setOptions({
          maxNumHands: 2,
          modelComplexity: currentQuality.complexity,
          minDetectionConfidence: qualityIndex === 0 ? 0.55 : 0.65,
          minTrackingConfidence: qualityIndex === 0 ? 0.45 : 0.55
        });
      }

      // Перезапускаем камеру с новым разрешением (если поток уже есть)
      if (stream) {
        const track = stream.getVideoTracks()[0];
        if (track) {
          try {
            await track.applyConstraints({
              width:  { ideal: currentQuality.w, max: currentQuality.w },
              height: { ideal: currentQuality.h, max: currentQuality.h },
              frameRate: { ideal: currentQuality.fps, max: currentQuality.fps }
            });
          } catch (e) {
            // Некоторые браузеры не любят applyConstraints — игнорируем
          }
        }
      }
    }

    function onResults(results) {
      updateAdaptiveQuality();

      if (canvas.width !== video.videoWidth || canvas.height !== video.videoHeight) {
        canvas.width = video.videoWidth || currentQuality.w;
        canvas.height = video.videoHeight || currentQuality.h;
      }

      ctx.clearRect(0, 0, canvas.width, canvas.height);

      const detected = results.multiHandLandmarks || [];

      // Сглаживаем и рисуем
      for (let i = 0; i < 2; i++) {
        if (i < detected.length) {
          const smoothed = smoothLandmarks(detected[i], i);
          drawSkeleton(smoothed);
        } else {
          resetSmooth(i);
        }
      }
    }

    async function start() {
      hands = new Hands({
        locateFile: (file) => `https://cdn.jsdelivr.net/npm/@mediapipe/hands/${file}`
      });

      hands.setOptions({
        maxNumHands: 2,
        modelComplexity: currentQuality.complexity,
        minDetectionConfidence: 0.65,
        minTrackingConfidence: 0.55
      });
      hands.onResults(onResults);

      stream = await navigator.mediaDevices.getUserMedia({
        video: {
          facingMode: 'user',
          width:  { ideal: currentQuality.w, max: currentQuality.w },
          height: { ideal: currentQuality.h, max: currentQuality.h },
          frameRate: { ideal: currentQuality.fps, max: currentQuality.fps }
        },
        audio: false
      });

      video.srcObject = stream;
      await video.play();

      camera = new Camera(video, {
        onFrame: async () => {
          await hands.send({ image: video });
        },
        width: currentQuality.w,
        height: currentQuality.h
      });
      camera.start();
    }

    start().catch(err => console.error(err));
  </script>
</body>
</html>
