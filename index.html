<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
  <title>Hand Tracking</title>
  <script src="https://cdn.jsdelivr.net/npm/@mediapipe/camera_utils/camera_utils.js" crossorigin="anonymous"></script>
  <script src="https://cdn.jsdelivr.net/npm/@mediapipe/hands/hands.js" crossorigin="anonymous"></script>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    html, body {
      width: 100%;
      height: 100%;
      overflow: hidden;
      background: #000;
    }
    #container {
      position: fixed;
      inset: 0;
      width: 100vw;
      height: 100vh;
    }
    /*
      Браузер отдаёт фронталку уже зеркально (selfie).
      scaleX(-1) отменяет зеркало → твоя ПРАВАЯ рука будет СПРАВА на экране.
      Canvas тоже переворачивается, поэтому скелет совпадает с рукой.
    */
    video, canvas {
      position: absolute;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      object-fit: cover;
      transform: scaleX(-1);
    }
    video { z-index: 1; }
    canvas {
      z-index: 2;
      pointer-events: none;
    }
    #clock {
      position: fixed;
      top: 50%;
      left: 50%;
      transform: translate(-50%, -50%);
      z-index: 30;
      text-align: center;
      color: #fff;
      font-family: 'Segoe UI', system-ui, sans-serif;
      text-shadow: 0 0 24px rgba(0,229,255,0.9), 0 4px 16px rgba(0,0,0,0.8);
      opacity: 0;
      pointer-events: none;
      transition: opacity 0.3s ease;
    }
    #clock.show {
      opacity: 1;
    }
    #clock .time {
      font-size: clamp(3rem, 13vw, 6rem);
      font-weight: 700;
      letter-spacing: 3px;
    }
    #clock .date {
      font-size: clamp(1.15rem, 4.5vw, 1.9rem);
      margin-top: 10px;
      opacity: 0.95;
    }
  </style>
</head>
<body>
  <div id="container">
    <video id="video" playsinline autoplay muted></video>
    <canvas id="canvas"></canvas>
  </div>
  <div id="clock">
    <div class="time" id="clockTime">00:00:00</div>
    <div class="date" id="clockDate">—</div>
  </div>

  <script>
    const video = document.getElementById('video');
    const canvas = document.getElementById('canvas');
    const ctx = canvas.getContext('2d');
    const clockEl = document.getElementById('clock');
    const clockTime = document.getElementById('clockTime');
    const clockDate = document.getElementById('clockDate');

    const isWeakDevice = (() => {
      const cores = navigator.hardwareConcurrency || 2;
      const memory = navigator.deviceMemory || 2;
      const isMobile = /Android|iPhone|iPad|iPod/i.test(navigator.userAgent);
      return isMobile && (cores <= 4 || memory <= 3);
    })();

    const QUALITY_LEVELS = [
      { w: 480, h: 360, complexity: 0, fps: 20 },
      { w: 640, h: 480, complexity: 0, fps: 24 },
      { w: 960, h: 720, complexity: 1, fps: 30 }
    ];
    let qualityIndex = isWeakDevice ? 1 : 2;
    let currentQuality = QUALITY_LEVELS[qualityIndex];

    let frameCount = 0;
    let lastFpsTime = performance.now();
    let lowFpsStreak = 0;
    let highFpsStreak = 0;

    // Очень сильное сглаживание
    const SMOOTH_ALPHA = 0.15;
    let smoothedHands = [null, null];

    function smoothLandmarks(newLandmarks, handIdx) {
      if (!smoothedHands[handIdx]) {
        smoothedHands[handIdx] = newLandmarks.map(p => ({ x: p.x, y: p.y, z: p.z || 0 }));
        return smoothedHands[handIdx];
      }
      const prev = smoothedHands[handIdx];
      for (let i = 0; i < newLandmarks.length; i++) {
        prev[i].x = SMOOTH_ALPHA * newLandmarks[i].x + (1 - SMOOTH_ALPHA) * prev[i].x;
        prev[i].y = SMOOTH_ALPHA * newLandmarks[i].y + (1 - SMOOTH_ALPHA) * prev[i].y;
        prev[i].z = SMOOTH_ALPHA * (newLandmarks[i].z || 0) + (1 - SMOOTH_ALPHA) * prev[i].z;
      }
      return prev;
    }

    function resetSmooth(handIdx) {
      smoothedHands[handIdx] = null;
    }

    // Щипок — большой + указательный (мягкий порог)
    const PINCH_THRESHOLD = 0.075;
    let pinchFrames = 0;

    function isPinching(lm) {
      const dx = lm[4].x - lm[8].x;
      const dy = lm[4].y - lm[8].y;
      return Math.sqrt(dx * dx + dy * dy) < PINCH_THRESHOLD;
    }

    function updateClockText() {
      const now = new Date();
      const hh = String(now.getHours()).padStart(2, '0');
      const mm = String(now.getMinutes()).padStart(2, '0');
      const ss = String(now.getSeconds()).padStart(2, '0');
      clockTime.textContent = hh + ':' + mm + ':' + ss;

      const days = ['Воскресенье','Понедельник','Вторник','Среда','Четверг','Пятница','Суббота'];
      const months = ['января','февраля','марта','апреля','мая','июня','июля','августа','сентября','октября','ноября','декабря'];
      clockDate.textContent = days[now.getDay()] + ', ' + now.getDate() + ' ' + months[now.getMonth()] + ' ' + now.getFullYear();
    }

    setInterval(function () {
      if (clockEl.classList.contains('show')) updateClockText();
    }, 1000);

    const HAND_CONNECTIONS = [
      [0,1],[1,2],[2,3],[3,4],
      [0,5],[5,6],[6,7],[7,8],
      [0,9],[9,10],[10,11],[11,12],
      [0,13],[13,14],[14,15],[15,16],
      [0,17],[17,18],[18,19],[19,20],
      [5,9],[9,13],[13,17]
    ];

    const FINGER_COLORS = {
      thumb: '#FF6B6B', index: '#4ECDC4', middle: '#FFE66D',
      ring: '#95E1D3', pinky: '#F38181', palm: '#A8DADC'
    };

    function getColor(i, j) {
      if (i <= 4 || j <= 4) return FINGER_COLORS.thumb;
      if ((i >= 5 && i <= 8) || (j >= 5 && j <= 8)) return FINGER_COLORS.index;
      if ((i >= 9 && i <= 12) || (j >= 9 && j <= 12)) return FINGER_COLORS.middle;
      if ((i >= 13 && i <= 16) || (j >= 13 && j <= 16)) return FINGER_COLORS.ring;
      if ((i >= 17 && i <= 20) || (j >= 17 && j <= 20)) return FINGER_COLORS.pinky;
      return FINGER_COLORS.palm;
    }

    function drawSkeleton(lm) {
      const w = canvas.width;
      const h = canvas.height;

      ctx.beginPath();
      ctx.arc(lm[0].x * w, lm[0].y * h, qualityIndex === 0 ? 26 : 48, 0, Math.PI * 2);
      ctx.fillStyle = 'rgba(0,229,255,0.15)';
      ctx.fill();

      const lw = qualityIndex === 0 ? 3 : 4;
      HAND_CONNECTIONS.forEach(function (pair) {
        const a = pair[0], b = pair[1];
        ctx.beginPath();
        ctx.moveTo(lm[a].x * w, lm[a].y * h);
        ctx.lineTo(lm[b].x * w, lm[b].y * h);
        ctx.strokeStyle = getColor(a, b);
        ctx.lineWidth = lw;
        ctx.lineCap = 'round';
        ctx.stroke();
      });

      lm.forEach(function (p, idx) {
        let r = qualityIndex === 0 ? 3 : 4.5;
        let c = '#fff';
        if (idx === 0) { r = qualityIndex === 0 ? 5.5 : 7; c = '#00E5FF'; }
        else if ([4,8,12,16,20].indexOf(idx) !== -1) { r = qualityIndex === 0 ? 4.2 : 5.8; c = '#FFD700'; }
        else if ([5,9,13,17].indexOf(idx) !== -1) { r = qualityIndex === 0 ? 3.8 : 5; c = '#80DEEA'; }

        ctx.beginPath();
        ctx.arc(p.x * w, p.y * h, r, 0, Math.PI * 2);
        ctx.fillStyle = c;
        ctx.fill();
      });
    }

    function updateAdaptiveQuality() {
      frameCount++;
      const now = performance.now();
      if (now - lastFpsTime < 1000) return;
      const fps = frameCount;
      frameCount = 0;
      lastFpsTime = now;

      if (fps < 15 && qualityIndex > 0) {
        lowFpsStreak++;
        highFpsStreak = 0;
        if (lowFpsStreak >= 2) {
          qualityIndex--;
          currentQuality = QUALITY_LEVELS[qualityIndex];
          lowFpsStreak = 0;
          applyQuality();
        }
      } else if (fps > 26 && qualityIndex < 2 && !isWeakDevice) {
        highFpsStreak++;
        lowFpsStreak = 0;
        if (highFpsStreak >= 3) {
          qualityIndex++;
          currentQuality = QUALITY_LEVELS[qualityIndex];
          highFpsStreak = 0;
          applyQuality();
        }
      } else {
        lowFpsStreak = 0;
        highFpsStreak = 0;
      }
    }

    let hands = null;
    let camera = null;
    let stream = null;

    async function applyQuality() {
      if (hands) {
        hands.setOptions({
          maxNumHands: 2,
          modelComplexity: currentQuality.complexity,
          minDetectionConfidence: qualityIndex === 0 ? 0.5 : 0.6,
          minTrackingConfidence: qualityIndex === 0 ? 0.4 : 0.5
        });
      }
      if (stream) {
        const track = stream.getVideoTracks()[0];
        if (track) {
          try {
            await track.applyConstraints({
              width: { ideal: currentQuality.w, max: currentQuality.w },
              height: { ideal: currentQuality.h, max: currentQuality.h },
              frameRate: { ideal: currentQuality.fps, max: currentQuality.fps }
            });
          } catch (e) {}
        }
      }
    }

    function onResults(results) {
      updateAdaptiveQuality();

      if (canvas.width !== video.videoWidth || canvas.height !== video.videoHeight) {
        canvas.width = video.videoWidth || currentQuality.w;
        canvas.height = video.videoHeight || currentQuality.h;
      }

      // Рисуем в координатах MediaPipe.
      // CSS scaleX(-1) одинаково переворачивает video и canvas → скелет совпадает с рукой.
      // Правая рука в жизни = правая сторона экрана.
      ctx.clearRect(0, 0, canvas.width, canvas.height);

      const detected = results.multiHandLandmarks || [];
      let anyPinch = false;

      for (let i = 0; i < 2; i++) {
        if (i < detected.length) {
          const smoothed = smoothLandmarks(detected[i], i);
          drawSkeleton(smoothed);
          if (isPinching(smoothed)) anyPinch = true;
        } else {
          resetSmooth(i);
        }
      }

      // Жест щипок → часы и дата
      if (anyPinch) {
        pinchFrames++;
        if (pinchFrames >= 2) {
          updateClockText();
          clockEl.classList.add('show');
        }
      } else {
        pinchFrames = 0;
        clockEl.classList.remove('show');
      }
    }

    async function start() {
      hands = new Hands({
        locateFile: function (file) {
          return 'https://cdn.jsdelivr.net/npm/@mediapipe/hands/' + file;
        }
      });

      hands.setOptions({
        maxNumHands: 2,
        modelComplexity: currentQuality.complexity,
        minDetectionConfidence: 0.6,
        minTrackingConfidence: 0.5
      });
      hands.onResults(onResults);

      stream = await navigator.mediaDevices.getUserMedia({
        video: {
          facingMode: 'user',
          width: { ideal: currentQuality.w, max: currentQuality.w },
          height: { ideal: currentQuality.h, max: currentQuality.h },
          frameRate: { ideal: currentQuality.fps, max: currentQuality.fps }
        },
        audio: false
      });

      video.srcObject = stream;
      await video.play();

      camera = new Camera(video, {
        onFrame: async function () {
          await hands.send({ image: video });
        },
        width: currentQuality.w,
        height: currentQuality.h
      });
      camera.start();
    }

    start().catch(function (err) {
      console.error(err);
    });
  </script>
</body>
</html>
