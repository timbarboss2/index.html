<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no, maximum-scale=1.0">
  <title>Quest Hands</title>
  <script src="https://cdn.jsdelivr.net/npm/@mediapipe/camera_utils/camera_utils.js" crossorigin="anonymous"></script>
  <script src="https://cdn.jsdelivr.net/npm/@mediapipe/hands/hands.js" crossorigin="anonymous"></script>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    html, body {
      width: 100%; height: 100%; overflow: hidden;
      background: #000; font-family: system-ui, sans-serif; color: #e8eef8;
    }
    #boot {
      position: fixed; inset: 0; z-index: 200;
      display: flex; flex-direction: column; align-items: center; justify-content: center;
      gap: 14px; padding: 24px; text-align: center;
      background: radial-gradient(ellipse at center, #152238, #070b12 70%);
    }
    #boot.hidden { display: none; }
    #boot h1 { font-size: 1.5rem; font-weight: 600; }
    #boot p { opacity: 0.7; font-size: 0.9rem; max-width: 340px; line-height: 1.45; }
    #boot button {
      padding: 14px 28px; border: 0; border-radius: 14px; cursor: pointer;
      background: linear-gradient(135deg, #5b9fff, #3a6fd8); color: #fff; font-size: 1rem;
    }
    #boot .err { color: #ff8a80; font-size: 0.85rem; min-height: 1.2em; }

    #stage { position: fixed; inset: 0; display: none; }
    #stage.on { display: block; }

    /* БЕЗ зеркала */
    #video, #canvas {
      position: absolute; inset: 0;
      width: 100%; height: 100%;
      object-fit: cover;
      transform: none !important;
    }
    #video { z-index: 1; }
    #canvas { z-index: 5; pointer-events: none; }

    #hud {
      position: fixed; top: 12px; left: 50%; transform: translateX(-50%);
      z-index: 40; padding: 6px 14px; border-radius: 16px;
      background: rgba(0,0,0,0.55); font-size: 0.78rem;
      border: 1px solid rgba(120,180,255,0.25);
      pointer-events: none; max-width: 92vw;
      white-space: nowrap; overflow: hidden; text-overflow: ellipsis;
    }

    /* Меню — двигается трекингом */
    #menu {
      position: fixed; z-index: 30;
      left: 50%; top: 50%;
      width: min(340px, 86vw);
      padding: 20px 18px 16px;
      border-radius: 22px;
      background: linear-gradient(160deg, rgba(40,55,90,0.9), rgba(16,24,42,0.94));
      border: 1px solid rgba(140,180,255,0.4);
      box-shadow: 0 20px 60px rgba(0,0,0,0.5), 0 0 30px rgba(60,120,255,0.12);
      backdrop-filter: blur(16px);
      display: none;
      transform: translate(-50%, -50%) scale(0.92);
      opacity: 0;
      transition: opacity 0.28s ease, transform 0.28s ease;
    }
    #menu.open {
      display: block;
      opacity: 1;
      transform: translate(-50%, -50%) scale(1);
    }
    #menu.grabbed {
      border-color: rgba(150,210,255,0.95);
      box-shadow: 0 0 32px rgba(80,160,255,0.45);
      transition: none;
    }
    #menu .title {
      font-size: 0.72rem; letter-spacing: 2px; text-transform: uppercase;
      opacity: 0.65; text-align: center; margin-bottom: 14px;
    }
    #menu .grid {
      display: grid; grid-template-columns: 1fr 1fr; gap: 10px;
    }
    #menu .item {
      padding: 16px 10px; border-radius: 16px; text-align: center;
      border: 1px solid rgba(120,180,255,0.3);
      background: rgba(30,50,80,0.55);
      font-size: 0.85rem;
    }
    #menu .item .ic { font-size: 1.4rem; display: block; margin-bottom: 6px; }
    #menu .hint {
      margin-top: 12px; font-size: 0.72rem; opacity: 0.55; text-align: center; line-height: 1.4;
    }

    #panel {
      position: fixed; z-index: 25;
      left: 50%; top: 42%;
      width: min(300px, 84vw);
      padding: 18px 16px;
      border-radius: 18px;
      background: rgba(12,18,32,0.92);
      border: 1px solid rgba(120,180,255,0.35);
      display: none;
      transform: translate(-50%, -50%);
    }
    #panel.open { display: block; }
    #panel .ptime { font-size: 2.2rem; font-weight: 300; letter-spacing: 2px; text-align: center; }
    #panel .pdate { text-align: center; opacity: 0.75; margin-top: 6px; }
    #panel input {
      width: 100%; margin-top: 10px; padding: 10px 12px; border-radius: 12px;
      border: 1px solid rgba(120,180,255,0.3); background: rgba(10,18,32,0.8);
      color: #fff; font-size: 0.9rem; outline: none;
    }
    #panel .phint { margin-top: 10px; font-size: 0.72rem; opacity: 0.5; text-align: center; }
  </style>
</head>
<body>
  <div id="boot">
    <h1>Quest Hands</h1>
    <p>
      Без зеркала · обводка рук как в Quest<br>
      Двойной щипок — меню · щипок на меню — перенос рукой
    </p>
    <button id="btnStart" type="button">Включить камеру</button>
    <div class="err" id="err"></div>
  </div>

  <div id="stage">
    <video id="video" playsinline autoplay muted></video>
    <canvas id="canvas"></canvas>
  </div>
  <div id="hud">—</div>

  <div id="menu">
    <div class="title">Меню</div>
    <div class="grid">
      <div class="item" data-act="clock"><span class="ic">🕐</span>Часы</div>
      <div class="item" data-act="browser"><span class="ic">🌐</span>Браузер</div>
      <div class="item" data-act="notes"><span class="ic">📝</span>Заметки</div>
      <div class="item" data-act="close"><span class="ic">✕</span>Закрыть</div>
    </div>
    <div class="hint">
      Щипок на меню — двигать<br>
      Укажи на пункт и щипок — выбрать<br>
      Двойной щипок — закрыть меню
    </div>
  </div>

  <div id="panel">
    <div id="panelBody"></div>
    <div class="phint">Двойной щипок — назад в меню</div>
  </div>

  <script>
    const boot = document.getElementById('boot');
    const errEl = document.getElementById('err');
    const stage = document.getElementById('stage');
    const video = document.getElementById('video');
    const canvas = document.getElementById('canvas');
    const ctx = canvas.getContext('2d');
    const hud = document.getElementById('hud');
    const menu = document.getElementById('menu');
    const panel = document.getElementById('panel');
    const panelBody = document.getElementById('panelBody');

    const isWeak = (() => {
      const c = navigator.hardwareConcurrency || 2;
      const m = navigator.deviceMemory || 2;
      return /Android|iPhone|iPad/i.test(navigator.userAgent) && (c <= 4 || m <= 3);
    })();
    const W = isWeak ? 480 : 640;
    const H = isWeak ? 360 : 480;

    // ---- быстрый фильтр без лага ----
    const filt = [null, null];
    function filterLm(lm, idx) {
      const now = performance.now() / 1000;
      if (!filt[idx]) {
        filt[idx] = lm.map(p => ({ x: p.x, y: p.y, z: p.z || 0, dx: 0, dy: 0, ts: now }));
        return filt[idx].map(s => ({ x: s.x, y: s.y, z: s.z }));
      }
      const st = filt[idx];
      const out = [];
      for (let i = 0; i < lm.length; i++) {
        const s = st[i];
        let dt = now - s.ts;
        if (dt <= 0 || dt > 0.1) dt = 1 / 60;
        s.ts = now;
        const nx = lm[i].x, ny = lm[i].y, nz = lm[i].z || 0;
        const ad = 1 / (1 + (1 / (2 * Math.PI * 1.8)) / dt);
        s.dx = ad * ((nx - s.x) / dt) + (1 - ad) * s.dx;
        s.dy = ad * ((ny - s.y) / dt) + (1 - ad) * s.dy;
        const speed = Math.hypot(s.dx, s.dy);
        const cutoff = 1.5 + 5.5 * speed;
        const a = 1 / (1 + (1 / (2 * Math.PI * cutoff)) / dt);
        s.x = a * nx + (1 - a) * s.x;
        s.y = a * ny + (1 - a) * s.y;
        s.z = a * nz + (1 - a) * s.z;
        // лёгкое предсказание при быстром движении
        const look = speed > 0.9 ? 0.028 : 0;
        out.push({ x: s.x + s.dx * look, y: s.y + s.dy * look, z: s.z });
      }
      return out;
    }
    function resetFilt(i) { filt[i] = null; }

    function dist(a, b) { return Math.hypot(a.x - b.x, a.y - b.y); }
    function palmSize(lm) { return Math.max(dist(lm[0], lm[9]), 0.04); }
    function pinchRatio(lm) { return dist(lm[4], lm[8]) / palmSize(lm); }
    const PINCH_ON = 0.4;

    // ---- детальная обводка руки (Quest-style), БЕЗ кружков/точек ----
    const FINGERS = [
      [0, 1, 2, 3, 4],
      [0, 5, 6, 7, 8],
      [0, 9, 10, 11, 12],
      [0, 13, 14, 15, 16],
      [0, 17, 18, 19, 20]
    ];
    // контур силуэта
    const HULL = [0, 1, 2, 3, 4, 8, 12, 16, 20, 19, 18, 17];
    const PALM = [0, 1, 5, 9, 13, 17];
    const WEB = [[1, 5], [5, 9], [9, 13], [13, 17], [17, 0]];

    function P(lm, i, w, h) {
      return { x: lm[i].x * w, y: lm[i].y * h };
    }

    function drawHandOutline(lm, w, h, alpha, isRight) {
      const scale = Math.max(dist(P(lm, 0, w, h), P(lm, 9, w, h)), 12);
      const col = isRight
        ? `rgba(180, 220, 255, ${0.92 * alpha})`
        : `rgba(255, 195, 175, ${0.92 * alpha})`;
      const fill = isRight
        ? `rgba(130, 185, 255, ${0.14 * alpha})`
        : `rgba(255, 150, 120, ${0.14 * alpha})`;

      ctx.save();
      ctx.lineJoin = 'round';
      ctx.lineCap = 'round';
      ctx.shadowColor = isRight
        ? `rgba(100, 170, 255, ${0.35 * alpha})`
        : `rgba(255, 140, 100, ${0.3 * alpha})`;
      ctx.shadowBlur = 14;

      // мягкая заливка ладони
      ctx.beginPath();
      PALM.forEach((idx, i) => {
        const p = P(lm, idx, w, h);
        if (i === 0) ctx.moveTo(p.x, p.y);
        else ctx.lineTo(p.x, p.y);
      });
      ctx.closePath();
      ctx.fillStyle = fill;
      ctx.fill();

      // перепонки ладони
      ctx.strokeStyle = col;
      ctx.lineWidth = Math.max(3.5, scale * 0.16);
      WEB.forEach(([a, b]) => {
        const pa = P(lm, a, w, h), pb = P(lm, b, w, h);
        ctx.beginPath();
        ctx.moveTo(pa.x, pa.y);
        ctx.lineTo(pb.x, pb.y);
        ctx.stroke();
      });

      // пальцы — сплошные линии обводки (без точек на суставах)
      FINGERS.forEach((chain, fi) => {
        const baseW = scale * (fi === 0 ? 0.26 : 0.22);
        ctx.beginPath();
        chain.forEach((idx, i) => {
          // для большого начинаем с 1, не дублируем запястье толстой линией
          if (fi === 0 && idx === 0) return;
          const p = P(lm, idx, w, h);
          if ((fi === 0 && idx === 1) || (fi > 0 && idx === chain[0])) ctx.moveTo(p.x, p.y);
          else ctx.lineTo(p.x, p.y);
        });
        // толщина чуть меньше к кончику — два прохода
        ctx.strokeStyle = col;
        ctx.lineWidth = Math.max(4, baseW);
        ctx.stroke();
      });

      // внешний силуэт одной линией
      ctx.beginPath();
      HULL.forEach((idx, i) => {
        const p = P(lm, idx, w, h);
        if (i === 0) ctx.moveTo(p.x, p.y);
        else ctx.lineTo(p.x, p.y);
      });
      ctx.closePath();
      ctx.strokeStyle = `rgba(255, 255, 255, ${0.4 * alpha})`;
      ctx.lineWidth = 2;
      ctx.stroke();

      ctx.restore();
    }

    // ---- меню: позиция и захват ----
    let menuOpen = false;
    let menuX = window.innerWidth / 2;
    let menuY = window.innerHeight / 2;
    let menuGrabbed = false;
    let grabOff = { x: 0, y: 0 };
    let panelMode = null; // clock | browser | notes | null

    function placeMenu() {
      menu.style.left = menuX + 'px';
      menu.style.top = menuY + 'px';
    }
    placeMenu();

    function openMenu() {
      menuOpen = true;
      panel.classList.remove('open');
      panelMode = null;
      menu.classList.add('open');
      placeMenu();
    }
    function closeMenu() {
      menuOpen = false;
      menuGrabbed = false;
      menu.classList.remove('open', 'grabbed');
    }

    function openPanel(act) {
      panelMode = act;
      closeMenu();
      if (act === 'close') return;
      if (act === 'clock') {
        panelBody.innerHTML = '<div class="ptime" id="ck">—</div><div class="pdate" id="cd">—</div>';
        tickClock();
      } else if (act === 'browser') {
        panelBody.innerHTML =
          '<input id="bIn" placeholder="Поиск…">' +
          '<div class="phint" style="margin-top:8px">Напиши запрос · откроется поиск</div>';
        setTimeout(() => {
          const inp = document.getElementById('bIn');
          inp?.addEventListener('keydown', e => {
            if (e.key === 'Enter') {
              const q = inp.value.trim();
              if (!q) return;
              const url = /^https?:\/\//i.test(q) ? q : 'https://duckduckgo.com/?q=' + encodeURIComponent(q);
              window.open(url, '_blank');
            }
          });
        }, 50);
      } else if (act === 'notes') {
        panelBody.innerHTML = '<input id="nIn" placeholder="Заметка…">';
        setTimeout(() => {
          const inp = document.getElementById('nIn');
          if (inp) inp.value = localStorage.getItem('qh_note') || '';
          inp?.addEventListener('change', () => localStorage.setItem('qh_note', inp.value));
        }, 50);
      }
      panel.classList.add('open');
    }

    function tickClock() {
      const n = new Date();
      const p = v => String(v).padStart(2, '0');
      const ck = document.getElementById('ck');
      const cd = document.getElementById('cd');
      if (ck) ck.textContent = p(n.getHours()) + ':' + p(n.getMinutes()) + ':' + p(n.getSeconds());
      if (cd) cd.textContent = n.toLocaleDateString('ru-RU', { weekday: 'long', day: 'numeric', month: 'long' });
    }
    setInterval(() => { if (panelMode === 'clock') tickClock(); }, 1000);

    // hit-test меню
    function pointInMenu(sx, sy) {
      if (!menuOpen) return false;
      const r = menu.getBoundingClientRect();
      return sx >= r.left && sx <= r.right && sy >= r.top && sy <= r.bottom;
    }
    function itemAt(sx, sy) {
      if (!menuOpen) return null;
      const el = document.elementFromPoint(sx, sy);
      return el?.closest?.('[data-act]') || null;
    }

    // ---- щипок ----
    let wasPinch = false;
    let lastPinchUp = 0;
    let pinchClicks = 0;
    let pinchConsumed = false; // захват меню / клик по пункту

    function tipScreen(lm) {
      // БЕЗ зеркала
      return { x: lm[8].x * window.innerWidth, y: lm[8].y * window.innerHeight };
    }

    function onPinchLogic(lm, pinching) {
      const tip = tipScreen(lm);

      if (pinching && !wasPinch) {
        pinchConsumed = false;
        // начало щипка
        if (menuOpen && pointInMenu(tip.x, tip.y)) {
          const item = itemAt(tip.x, tip.y);
          if (item && item.dataset.act) {
            // выбор пункта меню
            openPanel(item.dataset.act);
            pinchConsumed = true;
            if (navigator.vibrate) navigator.vibrate(20);
          } else {
            // захват меню для переноса
            menuGrabbed = true;
            menu.classList.add('grabbed');
            const r = menu.getBoundingClientRect();
            grabOff = { x: tip.x - (r.left + r.width / 2), y: tip.y - (r.top + r.height / 2) };
            pinchConsumed = true;
          }
        }
      }

      if (pinching && menuGrabbed) {
        menuX = tip.x - grabOff.x;
        menuY = tip.y - grabOff.y;
        // clamp
        menuX = Math.max(40, Math.min(window.innerWidth - 40, menuX));
        menuY = Math.max(40, Math.min(window.innerHeight - 40, menuY));
        placeMenu();
      }

      if (!pinching && wasPinch) {
        if (menuGrabbed) {
          menuGrabbed = false;
          menu.classList.remove('grabbed');
        }
        if (!pinchConsumed) {
          // обычный щипок для double-pinch
          const t = performance.now();
          if (t - lastPinchUp < 750) pinchClicks++;
          else pinchClicks = 1;
          lastPinchUp = t;
          if (pinchClicks >= 2) {
            pinchClicks = 0;
            if (panel.classList.contains('open')) {
              panel.classList.remove('open');
              panelMode = null;
              openMenu();
            } else if (menuOpen) closeMenu();
            else openMenu();
            if (navigator.vibrate) navigator.vibrate([15, 40, 15]);
          }
        }
      }

      wasPinch = pinching;
    }

    // ---- render ----
    function paint(hands) {
      if (canvas.width !== video.videoWidth || canvas.height !== video.videoHeight) {
        canvas.width = video.videoWidth || W;
        canvas.height = video.videoHeight || H;
      }
      const w = canvas.width, h = canvas.height;
      ctx.clearRect(0, 0, w, h);

      let anyPinch = false;
      let primary = null;

      hands.forEach((hand, i) => {
        const lm = filterLm(hand.lm, i);
        const isRight = (hand.label || 'Right') === 'Right';
        const alpha = Math.max(0.35, hand.score || 0.9);
        drawHandOutline(lm, w, h, alpha, isRight);

        const pinching = pinchRatio(lm) < PINCH_ON;
        if (pinching) anyPinch = true;
        if (!primary) primary = lm;

        // линия щипка (тонкая, не «кружок»)
        if (pinching) {
          const a = P(lm, 4, w, h), b = P(lm, 8, w, h);
          ctx.beginPath();
          ctx.moveTo(a.x, a.y);
          ctx.lineTo(b.x, b.y);
          ctx.strokeStyle = 'rgba(120, 255, 180, 0.85)';
          ctx.lineWidth = 2.5;
          ctx.lineCap = 'round';
          ctx.stroke();
        }
      });

      for (let i = hands.length; i < 2; i++) resetFilt(i);

      if (primary) onPinchLogic(primary, anyPinch);
      else {
        // нет рук — сброс захвата
        if (menuGrabbed) {
          menuGrabbed = false;
          menu.classList.remove('grabbed');
        }
        wasPinch = false;
      }

      const n = hands.length;
      hud.textContent = n
        ? (n + ' рук · двойной щипок = меню · щипок на меню = двигать')
        : 'Покажи руки · без зеркала';
    }

    // ---- camera ----
    let handsApi, camera, stream, running = false;

    function onResults(res) {
      if (!running) return;
      const lms = res.multiHandLandmarks || [];
      const hd = res.multiHandedness || [];
      const data = [];
      for (let i = 0; i < lms.length && i < 2; i++) {
        data.push({
          lm: lms[i],
          score: (hd[i] && hd[i].score) || 0.9,
          label: (hd[i] && hd[i].label) || 'Right'
        });
      }
      paint(data);
    }

    async function start() {
      errEl.textContent = '';
      try {
        stream = await navigator.mediaDevices.getUserMedia({
          video: {
            facingMode: { ideal: 'user' },
            width: { ideal: W },
            height: { ideal: H },
            frameRate: { ideal: 30, max: 30 }
          },
          audio: false
        });
      } catch (e) {
        try {
          stream = await navigator.mediaDevices.getUserMedia({ video: true, audio: false });
        } catch (e2) {
          errEl.textContent = 'Нет камеры: ' + (e2.message || e2.name);
          throw e2;
        }
      }

      video.srcObject = stream;
      // явно без зеркала
      video.style.transform = 'none';
      canvas.style.transform = 'none';

      await new Promise(r => {
        video.onloadeddata = r;
        video.play().catch(() => {});
      });

      if (typeof Hands === 'undefined') {
        errEl.textContent = 'MediaPipe не загрузился (нужен интернет)';
        throw new Error('mp');
      }

      handsApi = new Hands({
        locateFile: f => 'https://cdn.jsdelivr.net/npm/@mediapipe/hands/' + f
      });
      handsApi.setOptions({
        maxNumHands: 2,
        modelComplexity: 0,
        minDetectionConfidence: 0.5,
        minTrackingConfidence: 0.4
      });
      handsApi.onResults(onResults);

      let busy = false;
      camera = new Camera(video, {
        onFrame: async () => {
          if (busy) return;
          busy = true;
          try { await handsApi.send({ image: video }); } catch (e) {}
          busy = false;
        },
        width: W,
        height: H
      });
      await camera.start();
      running = true;
      boot.classList.add('hidden');
      stage.classList.add('on');

      try {
        if (screen.orientation && screen.orientation.lock) {
          await screen.orientation.lock('landscape');
        }
      } catch (e) {}
    }

    document.getElementById('btnStart').onclick = () => {
      start().catch(e => {
        console.error(e);
        if (!errEl.textContent) errEl.textContent = String(e.message || e);
      });
    };
  </script>
</body>
</html>
