<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
    <title>VR Room Designer - Hand Tracking</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body { 
            overflow: hidden; 
            font-family: Arial, sans-serif; 
            background: #1a1a2e;
            position: relative;
        }
        
        #gameCanvas { 
            display: block; 
            width: 100vw; 
            height: 100vh; 
        }
        
        #videoInput {
            position: fixed;
            top: 10px;
            right: 10px;
            width: 240px;
            height: 180px;
            border: 3px solid #00d4ff;
            border-radius: 10px;
            z-index: 1000;
            transform: scaleX(-1);
            object-fit: cover;
        }
        
        #handTrackingOverlay {
            position: fixed;
            top: 10px;
            right: 10px;
            width: 240px;
            height: 180px;
            border: 3px solid #00d4ff;
            border-radius: 10px;
            z-index: 999;
            pointer-events: none;
        }
        
        #loading {
            position: fixed; top: 0; left: 0; width: 100%; height: 100%;
            background: linear-gradient(135deg, #1a1a2e 0%, #16213e 100%);
            display: flex; flex-direction: column; justify-content: center; align-items: center;
            z-index: 10000; color: white;
        }
        
        #loading h1 {
            margin-bottom: 20px; font-size: 32px;
            background: linear-gradient(45deg, #00d4ff, #7b2cbf);
            -webkit-background-clip: text; -webkit-text-fill-color: transparent;
        }
        
        .loader {
            width: 50px; height: 50px;
            border: 5px solid rgba(255, 255, 255, 0.1);
            border-top-color: #00d4ff; border-radius: 50%;
            animation: spin 1s linear infinite;
        }
        
        @keyframes spin { to { transform: rotate(360deg); } }
        
        #gestureIndicator {
            position: fixed; top: 50%; left: 50%;
            transform: translate(-50%, -50%);
            width: 100px; height: 100px;
            border: 5px solid rgba(0, 212, 255, 0.8);
            border-radius: 50%; pointer-events: none;
            opacity: 0; transition: opacity 0.3s; z-index: 1000;
            box-shadow: 0 0 30px rgba(0, 212, 255, 0.6);
        }
        
        #gestureIndicator.active {
            opacity: 1;
            animation: pulse 1s ease-in-out infinite;
        }
        
        @keyframes pulse {
            0%, 100% { transform: translate(-50%, -50%) scale(1); }
            50% { transform: translate(-50%, -50%) scale(1.3); }
        }
        
        #pinchCounter {
            position: fixed;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -150%);
            background: rgba(0, 212, 255, 0.9);
            color: white;
            padding: 10px 20px;
            border-radius: 20px;
            font-size: 18px;
            font-weight: bold;
            opacity: 0;
            transition: opacity 0.3s;
            z-index: 1001;
        }
        
        #pinchCounter.visible {
            opacity: 1;
        }
        
        #instructions {
            position: fixed; bottom: 20px; left: 50%;
            transform: translateX(-50%);
            background: rgba(0, 0, 0, 0.9); color: white;
            padding: 15px 25px; border-radius: 10px;
            font-size: 14px; text-align: center; z-index: 100;
            max-width: 90%;
        }
        
        #status {
            position: fixed;
            top: 10px;
            left: 10px;
            background: rgba(0, 0, 0, 0.8);
            color: #00ff00;
            padding: 10px 15px;
            border-radius: 5px;
            font-size: 12px;
            z-index: 1000;
            font-family: monospace;
            max-width: 300px;
        }
        
        #error {
            position: fixed;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            background: rgba(255, 0, 0, 0.9);
            color: white;
            padding: 30px;
            border-radius: 10px;
            font-size: 16px;
            text-align: center;
            z-index: 10001;
            display: none;
            max-width: 80%;
        }
        
        #error button {
            margin-top: 20px;
            padding: 10px 30px;
            background: white;
            color: red;
            border: none;
            border-radius: 5px;
            font-size: 16px;
            cursor: pointer;
        }
    </style>
</head>
<body>
    <div id="loading">
        <h1>🖐 VR Room Designer</h1>
        <div class="loader"></div>
        <p style="margin-top: 20px;">Загрузка трекинга рук...</p>
        <p style="margin-top: 10px; font-size: 12px; color: #aaa;">Разрешите доступ к камере</p>
    </div>
    
    <div id="error">
        <h2>❌ Ошибка камеры</h2>
        <p id="errorMessage">Не удалось получить доступ к камере</p>
        <button onclick="location.reload()">Попробовать снова</button>
    </div>
    
    <video id="videoInput" autoplay playsinline></video>
    <canvas id="handTrackingOverlay"></canvas>
    
    <div id="gestureIndicator"></div>
    <div id="pinchCounter">1/2</div>
    <div id="status">Инициализация...</div>
    <div id="instructions">
        🖐 Покажи руку камере | Сделай ДВА щипка подряд для открытия меню | Соедини большой и указательный палец
    </div>
    
    <canvas id="gameCanvas"></canvas>
    
    <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/controls/OrbitControls.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/cannon@0.6.2/build/cannon.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/@mediapipe/hands@0.4.1646424915/hands.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/@mediapipe/camera_utils@0.3.1640029074/camera_utils.min.js"></script>
    
    <script>
        // ==================== ГЛОБАЛЬНЫЕ ПЕРЕМЕННЫЕ ====================
        let scene, camera, renderer, controls;
        let world;
        let objects = [];
        let isPinching = false;
        let selectedObject = null;
        let radialMenu = null;
        let isMenuOpen = false;
        
        // Система двойного щипка
        let pinchCount = 0;
        let lastPinchTime = 0;
        const DOUBLE_PINCH_TIMEOUT = 1000; // 1 секунда между щипками
        const PINCH_COOLDOWN = 500; // 0.5 секунда между щипками
        
        // Трекинг рук
        let hands;
        let videoElement;
        let canvasElement;
        let canvasCtx;
        let handSkeletons = { left: null, right: null };
        let handData = { left: null, right: null };
        
        const HAND_CONNECTIONS = [
            [0, 1], [1, 2], [2, 3], [3, 4],
            [0, 5], [5, 6], [6, 7], [7, 8],
            [0, 9], [9, 10], [10, 11], [11, 12],
            [0, 13], [13, 14], [14, 15], [15, 16],
            [0, 17], [17, 18], [18, 19], [19, 20]
        ];
        
        const categories = {
            furniture: [
                { name: '📺 Телевизор', type: 'tv', color: 0x2c3e50, width: 1.2, height: 0.8, depth: 0.2 },
                { name: '🛋️ Диван', type: 'sofa', color: 0xe74c3c, width: 2, height: 0.8, depth: 0.9 },
                { name: '🪑 Стул', type: 'chair', color: 0x3498db, width: 0.6, height: 0.9, depth: 0.6 },
                { name: '📚 Стол', type: 'table', color: 0x8b4513, width: 1.5, height: 0.75, depth: 0.8 }
            ],
            toys: [
                { name: '🧸 Мишка', type: 'bear', color: 0xd2691e, width: 0.4, height: 0.5, depth: 0.3 },
                { name: '🧊 Кубик', type: 'cube', color: 0xe74c3c, width: 0.3, height: 0.3, depth: 0.3 },
                { name: '⚽ Мяч', type: 'ball', color: 0x2ecc71, width: 0.3, height: 0.3, depth: 0.3, sphere: true }
            ]
        };
        
        // ==================== ИНИЦИАЛИЗАЦИЯ ====================
        async function init() {
            try {
                scene = new THREE.Scene();
                scene.background = new THREE.Color(0x87ceeb);
                
                camera = new THREE.PerspectiveCamera(75, window.innerWidth / window.innerHeight, 0.1, 1000);
                camera.position.set(0, 2, 5);
                camera.lookAt(0, 1, 0);
                
                renderer = new THREE.WebGLRenderer({ canvas: document.getElementById('gameCanvas'), antialias: true });
                renderer.setSize(window.innerWidth, window.innerHeight);
                renderer.shadowMap.enabled = true;
                
                controls = new THREE.OrbitControls(camera, renderer.domElement);
                controls.enableDamping = true;
                controls.dampingFactor = 0.05;
                controls.maxPolarAngle = Math.PI / 2 - 0.1;
                
                world = new CANNON.World();
                world.gravity.set(0, -9.82, 0);
                
                createRoom();
                setupLighting();
                
                await initHandTracking();
                
                document.getElementById('loading').style.display = 'none';
                updateStatus('✅ Готово! Сделай ДВА щипка для меню');
                
                animate();
            } catch (error) {
                console.error('Ошибка:', error);
                showError(error.message);
            }
        }
        
        function showError(message) {
            document.getElementById('loading').style.display = 'none';
            document.getElementById('errorMessage').textContent = message;
            document.getElementById('error').style.display = 'block';
        }
        
        // ==================== ТРЕКИНГ РУК ====================
        async function initHandTracking() {
            videoElement = document.getElementById('videoInput');
            canvasElement = document.getElementById('handTrackingOverlay');
            canvasCtx = canvasElement.getContext('2d');
            
            canvasElement.width = 240;
            canvasElement.height = 180;
            
            hands = new Hands({
                locateFile: (file) => {
                    return `https://cdn.jsdelivr.net/npm/@mediapipe/hands@0.4.1646424915/${file}`;
                }
            });
            
            hands.setOptions({
                maxNumHands: 2,
                modelComplexity: 1,
                minDetectionConfidence: 0.7,
                minTrackingConfidence: 0.7
            });
            
            hands.onResults(onHandResults);
            
            // Пробуем разные конфигурации камеры
            let stream = null;
            const constraints = [
                { video: { width: 640, height: 480, facingMode: 'user' } },
                { video: { width: 640, height: 480 } },
                { video: { facingMode: 'user' } },
                { video: true }
            ];
            
            for (const constraint of constraints) {
                try {
                    stream = await navigator.mediaDevices.getUserMedia(constraint);
                    break;
                } catch (e) {
                    console.warn('Конфигурация не сработала:', constraint, e);
                    continue;
                }
            }
            
            if (!stream) {
                throw new Error('Не удалось получить доступ к камере. Проверьте разрешения или попробуйте другой браузер.');
            }
            
            videoElement.srcObject = stream;
            
            await new Promise((resolve, reject) => {
                videoElement.onloadedmetadata = () => {
                    videoElement.play()
                        .then(resolve)
                        .catch(reject);
                };
                videoElement.onerror = () => reject(new Error('Ошибка загрузки видео'));
            });
            
            const camera = new Camera(videoElement, {
                onFrame: async () => {
                    await hands.send({ image: videoElement });
                },
                width: 640,
                height: 480
            });
            camera.start();
            
            updateStatus('📷 Камера активна');
        }
        
        function onHandResults(results) {
            canvasCtx.save();
            canvasCtx.clearRect(0, 0, canvasElement.width, canvasElement.height);
            canvasCtx.scale(-1, 1);
            canvasCtx.translate(-canvasElement.width, 0);
            canvasCtx.drawImage(results.image, 0, 0, canvasElement.width, canvasElement.height);
            
            if (results.multiHandLandmarks && results.multiHandLandmarks.length > 0) {
                results.multiHandLandmarks.forEach((landmarks, index) => {
                    const handedness = results.multiHandedness[index].label;
                    handData[handedness.toLowerCase()] = landmarks;
                    drawHandSkeleton(landmarks, handedness);
                    updateHandSkeleton3D(landmarks, handedness);
                    checkPinchGesture(landmarks, handedness);
                });
            } else {
                handData.left = null;
                handData.right = null;
            }
            
            canvasCtx.restore();
        }
        
        function drawHandSkeleton(landmarks, handedness) {
            const color = handedness === 'Left' ? '#00ff00' : '#ff00ff';
            
            canvasCtx.strokeStyle = color;
            canvasCtx.lineWidth = 3;
            
            HAND_CONNECTIONS.forEach(([start, end]) => {
                const startPoint = landmarks[start];
                const endPoint = landmarks[end];
                
                canvasCtx.beginPath();
                canvasCtx.moveTo(startPoint.x * canvasElement.width, startPoint.y * canvasElement.height);
                canvasCtx.lineTo(endPoint.x * canvasElement.width, endPoint.y * canvasElement.height);
                canvasCtx.stroke();
            });
            
            landmarks.forEach((landmark, index) => {
                const x = landmark.x * canvasElement.width;
                const y = landmark.y * canvasElement.height;
                
                canvasCtx.fillStyle = index === 4 || index === 8 ? '#ffff00' : color;
                canvasCtx.beginPath();
                canvasCtx.arc(x, y, 5, 0, 2 * Math.PI);
                canvasCtx.fill();
                
                canvasCtx.strokeStyle = '#ffffff';
                canvasCtx.lineWidth = 2;
                canvasCtx.stroke();
            });
        }
        
        function updateHandSkeleton3D(landmarks, handedness) {
            const handKey = handedness.toLowerCase();
            
            if (!handSkeletons[handKey]) {
                handSkeletons[handKey] = createHandSkeleton3D(handKey);
            }
            
            const skeleton = handSkeletons[handKey];
            
            landmarks.forEach((landmark, index) => {
                const x = (landmark.x - 0.5) * 3;
                const y = -(landmark.y - 0.5) * 3;
                const z = -landmark.z * 2;
                
                if (skeleton.joints[index]) {
                    skeleton.joints[index].position.set(x, y + 2, z);
                }
            });
            
            HAND_CONNECTIONS.forEach(([startIdx, endIdx], connIdx) => {
                if (skeleton.bones[connIdx]) {
                    const startJoint = skeleton.joints[startIdx];
                    const endJoint = skeleton.joints[endIdx];
                    
                    const start = startJoint.position;
                    const end = endJoint.position;
                    
                    const direction = new THREE.Vector3().subVectors(end, start);
                    const length = direction.length();
                    const midpoint = new THREE.Vector3().addVectors(start, end).multiplyScalar(0.5);
                    
                    skeleton.bones[connIdx].position.copy(midpoint);
                    skeleton.bones[connIdx].scale.y = length;
                    
                    const axis = new THREE.Vector3(0, 1, 0);
                    const quaternion = new THREE.Quaternion().setFromUnitVectors(axis, direction.normalize());
                    skeleton.bones[connIdx].quaternion.copy(quaternion);
                }
            });
        }
        
        function createHandSkeleton3D(handKey) {
            const skeleton = { joints: [], bones: [] };
            const color = handKey === 'left' ? 0x00ff00 : 0xff00ff;
            
            for (let i = 0; i < 21; i++) {
                const size = (i === 4 || i === 8 || i === 12 || i === 16 || i === 20) ? 0.04 : 0.03;
                const geometry = new THREE.SphereGeometry(size, 16, 16);
                const material = new THREE.MeshStandardMaterial({ 
                    color: color,
                    emissive: color,
                    emissiveIntensity: 0.5,
                    metalness: 0.3,
                    roughness: 0.7
                });
                const joint = new THREE.Mesh(geometry, material);
                joint.castShadow = true;
                scene.add(joint);
                skeleton.joints.push(joint);
            }
            
            HAND_CONNECTIONS.forEach(() => {
                const geometry = new THREE.CylinderGeometry(0.015, 0.015, 1, 8);
                const material = new THREE.MeshStandardMaterial({ 
                    color: color,
                    emissive: color,
                    emissiveIntensity: 0.3,
                    metalness: 0.2,
                    roughness: 0.8
                });
                const bone = new THREE.Mesh(geometry, material);
                bone.castShadow = true;
                scene.add(bone);
                skeleton.bones.push(bone);
            });
            
            return skeleton;
        }
        
        function checkPinchGesture(landmarks, handedness) {
            const thumbTip = landmarks[4];
            const indexTip = landmarks[8];
            
            const distance = Math.sqrt(
                Math.pow(thumbTip.x - indexTip.x, 2) +
                Math.pow(thumbTip.y - indexTip.y, 2) +
                Math.pow(thumbTip.z - indexTip.z, 2)
            );
            
            const threshold = 0.05;
            const now = Date.now();
            
            if (distance < threshold && !isPinching) {
                // Проверяем кулдаун
                if (now - lastPinchTime < PINCH_COOLDOWN) {
                    return;
                }
                
                isPinching = true;
                lastPinchTime = now;
                
                // Считаем щипки
                pinchCount++;
                
                // Показываем счетчик
                const counter = document.getElementById('pinchCounter');
                counter.textContent = `${pinchCount}/2`;
                counter.classList.add('visible');
                
                document.getElementById('gestureIndicator').classList.add('active');
                updateStatus(`🤏 Щипок #${pinchCount}! (${handedness})`);
                
                // Если это второй щипок в течение времени
                if (pinchCount === 2) {
                    updateStatus('✅ ДВОЙНОЙ ЩИПОК! Открываю меню...');
                    setTimeout(() => {
                        const x = (thumbTip.x - 0.5) * 3;
                        const y = -(thumbTip.y - 0.5) * 3;
                        const z = -thumbTip.z * 2;
                        createRadialMenu(new THREE.Vector3(x, y + 2, z));
                        pinchCount = 0;
                        counter.classList.remove('visible');
                    }, 300);
                }
                
                // Сбрасываем счетчик если прошло слишком много времени
                setTimeout(() => {
                    if (pinchCount === 1) {
                        pinchCount = 0;
                        document.getElementById('pinchCounter').classList.remove('visible');
                        updateStatus('✋ Сброс счетчика');
                    }
                }, DOUBLE_PINCH_TIMEOUT);
                
            } else if (distance >= threshold && isPinching) {
                isPinching = false;
                document.getElementById('gestureIndicator').classList.remove('active');
            }
        }
        
        // ==================== КОМНАТА И ОСВЕЩЕНИЕ ====================
        function createRoom() {
            const floorGeometry = new THREE.PlaneGeometry(10, 10);
            const floorMaterial = new THREE.MeshStandardMaterial({ color: 0x8b7355 });
            const floor = new THREE.Mesh(floorGeometry, floorMaterial);
            floor.rotation.x = -Math.PI / 2;
            floor.receiveShadow = true;
            scene.add(floor);
            
            const floorShape = new CANNON.Plane();
            const floorBody = new CANNON.Body({ mass: 0 });
            floorBody.addShape(floorShape);
            floorBody.quaternion.setFromAxisAngle(new CANNON.Vec3(1, 0, 0), -Math.PI / 2);
            world.addBody(floorBody);
            
            createWall(0, 2.5, -5, 10, 5, 0.2, 0x95a5a6);
            createWall(-5, 2.5, 0, 0.2, 5, 10, 0x95a5a6);
            createWall(5, 2.5, 0, 0.2, 5, 10, 0x95a5a6);
        }
        
        function createWall(x, y, z, w, h, d, color) {
            const geometry = new THREE.BoxGeometry(w, h, d);
            const material = new THREE.MeshStandardMaterial({ color: color });
            const wall = new THREE.Mesh(geometry, material);
            wall.position.set(x, y, z);
            wall.receiveShadow = true;
            scene.add(wall);
            
            const shape = new CANNON.Box(new CANNON.Vec3(w/2, h/2, d/2));
            const body = new CANNON.Body({ mass: 0 });
            body.addShape(shape);
            body.position.set(x, y, z);
            world.addBody(body);
        }
        
        function setupLighting() {
            const ambientLight = new THREE.AmbientLight(0xffffff, 0.6);
            scene.add(ambientLight);
            
            const dirLight = new THREE.DirectionalLight(0xffffff, 0.8);
            dirLight.position.set(5, 10, 5);
            dirLight.castShadow = true;
            scene.add(dirLight);
        }
        
        // ==================== ПРЕДМЕТЫ ====================
        function createItem(itemData, position) {
            let geometry;
            if (itemData.sphere) {
                geometry = new THREE.SphereGeometry(itemData.width / 2, 32, 32);
            } else {
                geometry = new THREE.BoxGeometry(itemData.width, itemData.height, itemData.depth);
            }
            
            const material = new THREE.MeshStandardMaterial({ color: itemData.color });
            const mesh = new THREE.Mesh(geometry, material);
            mesh.position.copy(position);
            mesh.castShadow = true;
            mesh.userData = { itemData: itemData, isDraggable: true };
            scene.add(mesh);
            
            let shape;
            if (itemData.sphere) {
                shape = new CANNON.Sphere(itemData.width / 2);
            } else {
                shape = new CANNON.Box(new CANNON.Vec3(itemData.width/2, itemData.height/2, itemData.depth/2));
            }
            
            const body = new CANNON.Body({ mass: 1 });
            body.addShape(shape);
            body.position.set(position.x, position.y, position.z);
            world.addBody(body);
            
            objects.push({ mesh: mesh, body: body });
            return mesh;
        }
        
        // ==================== МЕНЮ ====================
        function createRadialMenu(position) {
            if (radialMenu) scene.remove(radialMenu);
            
            radialMenu = new THREE.Group();
            radialMenu.position.copy(position);
            radialMenu.position.y = 1.5;
            
            const categoriesList = Object.keys(categories);
            const radius = 1.2;
            const angleStep = (Math.PI * 2) / categoriesList.length;
            
            categoriesList.forEach((category, index) => {
                const angle = index * angleStep - Math.PI / 2;
                const x = Math.cos(angle) * radius;
                const z = Math.sin(angle) * radius;
                
                const buttonGeometry = new THREE.CircleGeometry(0.3, 32);
                const buttonMaterial = new THREE.MeshBasicMaterial({ color: 0x3498db, transparent: true, opacity: 0.9 });
                const button = new THREE.Mesh(buttonGeometry, buttonMaterial);
                button.position.set(x, 0, z);
                button.rotation.x = -Math.PI / 2;
                button.userData = { category: category, isMenuButton: true };
                radialMenu.add(button);
            });
            
            scene.add(radialMenu);
            isMenuOpen = true;
            updateStatus('📋 Меню открыто! Сделай щипок на предмете');
        }
        
        function updateStatus(text) {
            document.getElementById('status').textContent = text;
        }
        
        // ==================== АНИМАЦИЯ ====================
        function animate() {
            requestAnimationFrame(animate);
            world.step(0.016);
            
            objects.forEach(obj => {
                obj.mesh.position.copy(obj.body.position);
                obj.mesh.quaternion.copy(obj.body.quaternion);
            });
            
            controls.update();
            renderer.render(scene, camera);
        }
        
        // Запуск
        if (document.readyState === 'loading') {
            document.addEventListener('DOMContentLoaded', init);
        } else {
            init();
        }
    </script>
</body>
</html>
