<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
<title>ULTIMATE VR Hand Tracking</title>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; user-select: none; -webkit-tap-highlight-color: transparent; }
  html, body { width: 100vw; height: 100vh; overflow: hidden; background: #000; font-family: 'Arial', sans-serif; color: #fff; touch-action: none; }
  
  #video { position: fixed; top: 0; left: 0; width: 100vw; height: 100vh; object-fit: cover; z-index: 0; }
  #canvas { position: fixed; top: 0; left: 0; width: 100vw; height: 100vh; z-index: 2; }
  #divider { position: fixed; top: 0; left: 50%; width: 4px; height: 100vh; background: #000; z-index: 3; pointer-events: none; }
  
  #ui {
    position: fixed; top: 10px; left: 50%; transform: translateX(-50%);
    z-index: 4; background: rgba(0,0,0,0.9); padding: 10px 20px;
    border-radius: 25px; font-size: 14px; pointer-events: none;
    text-align: center; border: 2px solid rgba(0,210,255,0.6);
    box-shadow: 0 0 30px rgba(0,210,255,0.4);
    display: none;
  }
  
  #stats {
    position: fixed; bottom: 10px; left: 10px; z-index: 4;
    background: rgba(0,0,0,0.8); padding: 8px 12px;
    border-radius: 10px; font-size: 11px; font-family: monospace;
    display: none;
  }
  
  #achievements {
    position: fixed; top: 60px; right: 10px; z-index: 5;

  @keyframes achieveIn { from { transform: translateX(400px); opacity: 0; } }
  @keyframes achieveOut { to { transform: translateX(400px); opacity: 0; } }
  
  #startScreen {
    position: fixed; inset: 0;
    background: linear-gradient(135deg, #0f0c29, #302b63, #24243e);
    z-index: 20; display: flex; align-items: center; justify-content: center;
    flex-direction: column; padding: 20px; text-align: center;

    0%, 100% { filter: brightness(1); }
    50% { filter: brightness(1.3); }

  .subtitle { font-size: 16px; color: #aaa; margin-bottom: 20px; max-width: 600px; line-height: 1.5; }
  
  .features {

  .feature {
    background: rgba(255,255,255,0.08); border: 2px solid rgba(255,255,255,0.15);
    padding: 15px; border-radius: 12px; text-align: center;

  .feature:hover { transform: translateY(-5px); border-color: #00d2ff; }
  .feature .icon { font-size: 32px; margin-bottom: 8px; }
  .feature .label { font-size: 13px; }
  
  #startBtn {
    background: linear-gradient(90deg, #00d2ff, #3a7bd5, #ff00ea);
    color: #fff; border: none; padding: 22px 60px;
    font-size: 22px; font-weight: bold; border-radius: 50px;
    cursor: pointer; box-shadow: 0 0 40px rgba(0,210,255,0.6);
    transition: transform 0.2s, box-shadow 0.2s;

  #startBtn:hover { transform: scale(1.05); box-shadow: 0 0 60px rgba(0,210,255,0.8); }
  #startBtn:disabled { background: #555; cursor: not-allowed; box-shadow: none; }
  
  #errorMsg { color: #ff6b6b; margin-top: 15px; font-size: 14px; display: none; }
  
  #loading {
    position: fixed; inset: 0; background: #000; z-index: 15;
    display: none; align-items: center; justify-content: center;
    flex-direction: column; font-size: 18px;
  }
  .spinner {
    width: 70px; height: 70px;
    border: 5px solid #333; border-top-color: #00d2ff;
    border-radius: 50%; animation: spin 1s linear infinite;
    margin-bottom: 20px;

  @keyframes spin { to { transform: rotate(360deg); } }
  #loadingProgress {
    width: 300px; height: 8px; background: #333;
    border-radius: 4px; overflow: hidden; margin-top: 15px;
  }
  #loadingBar {
    height: 100%; background: linear-gradient(90deg, #00d2ff, #ff00ea);
    width: 0%; transition: width 0.3s;
  }
  
  #rotateWarning {
    position: fixed; inset: 0;
    background: linear-gradient(135deg, #0f0c29, #302b63);
    z-index: 50; display: none;
    align-items: center; justify-content: center;
    flex-direction: column; text-align: center; padding: 20px;
  }
  #rotateWarning .icon {
    font-size: 80px; margin-bottom: 20px;
    animation: rotatePhone 2s ease-in-out infinite;
  }
  @keyframes rotatePhone {
    0%, 100% { transform: rotate(0deg); }
    50% { transform: rotate(90deg); }
  }

<body>

<div id="rotateWarning">
  <div class="icon">📱</div>
  <h2>Поверни телефон горизонтально</h2>
</div>

<div id="startScreen">
  <h1>🚀 ULTIMATE VR</h1>
  <p class="subtitle">WebGL • Частицы • Процедурные миры • 3D звук • Достижения • Музыкальный режим</p>
  
  <div class="features">
    <div class="feature"><div class="icon">🎨</div><div class="label">WebGL графика</div></div>
    <div class="feature"><div class="icon">✨</div><div class="label">Частицы</div></div>
    <div class="feature"><div class="icon">🌍</div><div class="label">5 миров</div></div>
    <div class="feature"><div class="icon">🎵</div><div class="label">Музыка</div></div>
    <div class="feature"><div class="icon">🏆</div><div class="label">Достижения</div></div>
    <div class="feature"><div class="icon">🖐</div><div class="label">10+ жестов</div></div>
    <div class="feature"><div class="icon">📱</div><div class="label">15 приложений</div></div>
    <div class="feature"><div class="icon">⚡</div><div class="label">60 FPS</div></div>
  </div>
  
  <button id="startBtn">▶ НАЧАТЬ ПРИКЛЮЧЕНИЕ</button>

</div>

<div id="loading">
  <div class="spinner"></div>
  <div id="loadingText">Инициализация...</div>
  <div id="loadingProgress"><div id="loadingBar"></div></div>
</div>

<video id="video" autoplay playsinline muted></video>
<canvas id="canvas"></canvas>
<div id="divider"></div>
<div id="ui">Двойной щипок для меню</div>
<div id="stats"></div>
<div id="achievements"></div>

<script src="https://cdn.jsdelivr.net/npm/@mediapipe/camera_utils/camera_utils.js"></script>
<script src="https://cdn.jsdelivr.net/npm/@mediapipe/hands/hands.js"></script>

<script>
// ==================== КОНФИГУРАЦИЯ ====================
const CONFIG = {
  enableParticles: true,
  enableMusic: true,
  enableAchievements: true,
  enableStats: true,
  currentWorld: 'space',
  worlds: ['space', 'forest', 'city', 'ocean', 'cyberpunk']
};

// ==================== ЭЛЕМЕНТЫ ====================
const video = document.getElementById('video');
const canvas = document.getElementById('canvas');
const ctx = canvas.getContext('2d');
const ui = document.getElementById('ui');
const stats = document.getElementById('stats');
const startScreen = document.getElementById('startScreen');
const startBtn = document.getElementById('startBtn');
const loading = document.getElementById('loading');
const loadingText = document.getElementById('loadingText');
const loadingBar = document.getElementById('loadingBar');
const errorMsg = document.getElementById('errorMsg');
const rotateWarning = document.getElementById('rotateWarning');
const achievementsDiv = document.getElementById('achievements');

let W = 0, H = 0;
let FPS = 0, frameCount = 0, lastFPSTime = 0;

function checkOrientation() {
  rotateWarning.style.display = (window.innerWidth > window.innerHeight) ? 'none' : 'flex';
}
function resize() {
  W = canvas.width = window.innerWidth;
  H = canvas.height = window.innerHeight;
  checkOrientation();
}
window.addEventListener('resize', resize);
window.addEventListener('orientationchange', () => setTimeout(checkOrientation, 300));
resize();

// ==================== 3D МАТЕМАТИКА ====================
class Vec3 {
  constructor(x=0,y=0,z=0){this.x=x;this.y=y;this.z=z;}
  add(v){return new Vec3(this.x+v.x,this.y+v.y,this.z+v.z);}
  sub(v){return new Vec3(this.x-v.x,this.y-v.y,this.z-v.z);}
  mul(s){return new Vec3(this.x*s,this.y*s,this.z*s);}
  len(){return Math.hypot(this.x,this.y,this.z);}
  clone(){return new Vec3(this.x,this.y,this.z);}
  lerp(v,t){return new Vec3(this.x+(v.x-this.x)*t,this.y+(v.y-this.y)*t,this.z+(v.z-this.z)*t);}
  distTo(v){return this.sub(v).len();}
  normalize(){const l=this.len();return l>0?this.mul(1/l):new Vec3();}
  cross(v){return new Vec3(this.y*v.z-this.z*v.y,this.z*v.x-this.x*v.z,this.x*v.y-this.y*v.x);}
  dot(v){return this.x*v.x+this.y*v.y+this.z*v.z;}
}

class OneEuroFilter {
  constructor(freq=30, mincutoff=1, beta=0.007, dcutoff=1) {
    this.freq=freq;this.mincutoff=mincutoff;this.beta=beta;this.dcutoff=dcutoff;
    this.x=null;this.dx=0;this.lastTime=null;
  }
  alpha(cutoff){const te=1.0/this.freq;const tau=1.0/(2*Math.PI*cutoff);return 1.0/(1.0+tau/te);}
  filter(x,timestamp){
    if(this.x===null){this.x=x;this.lastTime=timestamp;return x;}
    const te=timestamp?(timestamp-this.lastTime):(1.0/this.freq);
    this.freq=1.0/Math.max(te,0.001);
    const dx=(x-this.x)/te;
    const edx=this.alpha(this.dcutoff);
    this.dx=edx*dx+(1-edx)*this.dx;
    const cutoff=this.mincutoff+this.beta*Math.abs(this.dx);
    const ax=this.alpha(cutoff);
    this.x=ax*x+(1-ax)*this.x;
    this.lastTime=timestamp;
    return this.x;
  }
}

const CAM_Y = 1.6;
const EYE_OFFSET = 0.032;
const FOV_SCALE = 1.2;

function project(p, eyeSign, halfW, offX) {
  const dx = p.x - eyeSign * EYE_OFFSET;
  const dy = p.y - CAM_Y;
  const dz = p.z;
  if (dz < 0.1) return { visible: false };
  const scale = 1 / (dz * FOV_SCALE);
  return {
    x: offX + halfW/2 + dx * scale * halfW,
    y: H/2 - dy * scale * H,
    scale, visible: true, depth: dz
  };
}

// ==================== КАМЕРА ====================
async function requestCamera() {
  loadingText.textContent = 'Запрос камеры...';
  loadingBar.style.width = '20%';
  try {
    const stream = await navigator.mediaDevices.getUserMedia({
      video: { facingMode: { ideal: 'environment' }, width: { ideal: 1280 }, height: { ideal: 720 } },
      audio: true // Для 3D звука
    });
    video.srcObject = stream;
    await new Promise((resolve, reject) => {
      video.onloadedmetadata = resolve;
      video.onerror = reject;
      setTimeout(reject, 5000);
    });
    await video.play();
    loadingBar.style.width = '40%';
    return true;
  } catch (e) {
    errorMsg.style.display = 'block';
    errorMsg.textContent = '❌ ' + e.message;
    startBtn.disabled = false;
    return false;
  }
}

// ==================== ТРЕКИНГ ====================
let handsTracker = null;
let hands2D = [], hands3D = [];
let filters2D = [], filters3D = [];

function landmarksToScreen(landmarks) {
  const vw = video.videoWidth || 1280;
  const vh = video.videoHeight || 720;
  const screenAspect = W / H;
  const videoAspect = vw / vh;
  let scale, offsetX, offsetY;
  if (videoAspect > screenAspect) {
    scale = W / vw; offsetX = 0; offsetY = (H - vh * scale) / 2;
  } else {
    scale = H / vh; offsetX = (W - vw * scale) / 2; offsetY = 0;
  }
  return landmarks.map(p => ({ x: p.x * vw * scale + offsetX, y: p.y * vh * scale + offsetY }));
}

function landmarksToWorld(landmarks, handIndex, timestamp) {
  const wrist = landmarks[0];
  const middleBase = landmarks[9];
  const pixelSize = Math.hypot(wrist.x - middleBase.x, wrist.y - middleBase.y);
  let depth = Math.min(Math.max(0.18 / (pixelSize + 0.001), 0.3), 2.0);
  const aspect = (video.videoWidth || 1280) / (video.videoHeight || 720);
  
  if (!filters3D[handIndex]) {
    filters3D[handIndex] = [];
    for (let i = 0; i < 21; i++) {
      filters3D[handIndex].push({
        x: new OneEuroFilter(30, 1.0, 0.007),
        y: new OneEuroFilter(30, 1.0, 0.007),
        z: new OneEuroFilter(30, 1.0, 0.007)
      });
    }
  }
  
  return landmarks.map((p, i) => {
    const rawX = (p.x - 0.5) * depth * aspect * 1.5;
    const rawY = CAM_Y - (p.y - 0.5) * depth * 1.5;
    const rawZ = depth - p.z * 0.2;
    return new Vec3(
      filters3D[handIndex][i].x.filter(rawX, timestamp),
      filters3D[handIndex][i].y.filter(rawY, timestamp),
      filters3D[handIndex][i].z.filter(rawZ, timestamp)
    );
  });
}

async function initHandTracking() {
  loadingText.textContent = 'Загрузка нейросети...';
  loadingBar.style.width = '60%';
  
  handsTracker = new Hands({
    locateFile: (file) => `https://cdn.jsdelivr.net/npm/@mediapipe/hands/${file}`
  });
  
  handsTracker.setOptions({
    maxNumHands: 2, modelComplexity: 1,
    minDetectionConfidence: 0.7, minTrackingConfidence: 0.6
  });
  
  handsTracker.onResults(onResults);
  
  loadingText.textContent = 'Запуск трекинга...';
  loadingBar.style.width = '80%';
  
  const camera = new Camera(video, {
    onFrame: async () => {
      if (handsTracker) {
        try { await handsTracker.send({ image: video }); }
        catch(e) { console.error(e); }
      }
    },
    width: 1280, height: 720
  });
  camera.start();
  
  loadingBar.style.width = '100%';
}

function onResults(results) {
  const timestamp = performance.now();
  hands2D = []; hands3D = [];
  
  if (results.multiHandLandmarks) {
    for (let i = 0; i < results.multiHandLandmarks.length; i++) {
      const lm = results.multiHandLandmarks[i];
      hands2D.push(landmarksToScreen(lm));
      hands3D.push(landmarksToWorld(lm, i, timestamp));
    }
  }
}

// ==================== ЖЕСТЫ ====================
function dist2D(a, b) { return Math.hypot(a.x - b.x, a.y - b.y); }
function dist3(a, b) { return a.distTo(b); }

function isPinch3D(hand) {
  return dist3(hand[4], hand[8]) < dist3(hand[0], hand[9]) * 0.4;
}

function isPinch2D(hand) {
  return dist2D(hand[4], hand[8]) < dist2D(hand[0], hand[9]) * 0.4;
}

// Новые жесты
function isOpenPalm(hand) {
  const wrist = hand[0];
  const tips = [8, 12, 16, 20];
  const pips = [6, 10, 14, 18];
  let ext = 0;
  for (let i = 0; i < 4; i++) {
    if (dist3(wrist, hand[tips[i]]) > dist3(wrist, hand[pips[i]]) * 1.1) ext++;
  }
  return ext >= 3;
}

function isThumbsUp(hand) {
  const thumb = hand[4];
  const index = hand[8];
  return thumb.y > hand[0].y && dist3(thumb, index) > dist3(hand[0], hand[9]) * 0.8;
}

function isPeaceSign(hand) {
  const index = hand[8];
  const middle = hand[12];
  const ring = hand[16];
  return dist3(index, middle) > dist3(hand[0], hand[9]) * 0.3 &&
         dist3(middle, ring) < dist3(hand[0], hand[9]) * 0.3;
}

let lastTapTime = [0, 0];
function checkDoubleTap(handIndex, now) {
  const t = now - lastTapTime[handIndex];
  if (t < 500 && t > 80) { lastTapTime[handIndex] = 0; return true; }
  lastTapTime[handIndex] = now;
  return false;
}

let prevHandX = [null, null];
let swipeAccum = [0, 0];
function detectSwipe(handIndex, hand) {
  const x = hand[0].x;
  if (prevHandX[handIndex] !== null) {
    const dx = x - prevHandX[handIndex];
    swipeAccum[handIndex] += dx;
    if (Math.abs(swipeAccum[handIndex]) > 0.3) {
      const dir = swipeAccum[handIndex] > 0 ? 'right' : 'left';
      swipeAccum[handIndex] = 0;
      prevHandX[handIndex] = x;
      return dir;
    }
  }
  prevHandX[handIndex] = x;
  return null;
}

// ==================== СИСТЕМА ЧАСТИЦ ====================
class Particle {
  constructor(pos, vel, color, life=1, size=5) {
    this.pos = pos.clone();
    this.vel = vel.clone();
    this.color = color;
    this.life = life;
    this.maxLife = life;
    this.size = size;
  }
  update(dt) {
    this.pos = this.pos.add(this.vel.mul(dt));
    this.vel.y -= 2 * dt; // гравитация
    this.life -= dt;
  }
  draw(eyeSign, halfW, offX) {
    const p = project(this.pos, eyeSign, halfW, offX);
    if (!p.visible || this.life <= 0) return;
    const alpha = this.life / this.maxLife;
    const size = this.size * p.scale * halfW * 0.01;
    ctx.fillStyle = this.color.replace('1)', `${alpha})`);
    ctx.beginPath();
    ctx.arc(p.x, p.y, size, 0, Math.PI*2);
    ctx.fill();
  }
}

let particles = [];

function emitParticles(pos, count, color, spread=1) {
  if (!CONFIG.enableParticles) return;
  for (let i = 0; i < count; i++) {
    const vel = new Vec3(
      (Math.random() - 0.5) * spread,
      Math.random() * spread,
      (Math.random() - 0.5) * spread
    );
    particles.push(new Particle(pos, vel, color, 1 + Math.random(), 3 + Math.random() * 5));
  }
}

// ==================== ПРОЦЕДУРНЫЕ МИРЫ ====================
class World {
  constructor(name) {
    this.name = name;
    this.objects = [];
    this.generate();
  }
  generate() {
    if (this.name === 'space') {
      // Космос: звёзды, планеты
      for (let i = 0; i < 100; i++) {
        this.objects.push({
          type: 'star',
          pos: new Vec3((Math.random()-0.5)*10, Math.random()*5, Math.random()*10),
          size: 0.02 + Math.random() * 0.05,
          color: `rgba(255,255,255,${0.5+Math.random()*0.5})`
        });
      }
    } else if (this.name === 'forest') {
      // Лес: деревья
      for (let i = 0; i < 20; i++) {
        this.objects.push({
          type: 'tree',
          pos: new Vec3((Math.random()-0.5)*8, 0, 2 + Math.random()*6),
          height: 1 + Math.random() * 2
        });
      }
    } else if (this.name === 'city') {
      // Город: здания
      for (let i = 0; i < 15; i++) {
        this.objects.push({
          type: 'building',
          pos: new Vec3((Math.random()-0.5)*10, 0, 3 + Math.random()*5),
          width: 0.5 + Math.random(),
          height: 1 + Math.random() * 3
        });
      }
    }
  }
  draw(eyeSign, halfW, offX) {
    this.objects.forEach(obj => {
      if (obj.type === 'star') {
        const p = project(obj.pos, eyeSign, halfW, offX);
        if (p.visible) {
          ctx.fillStyle = obj.color;
          ctx.beginPath();
          ctx.arc(p.x, p.y, obj.size * p.scale * halfW, 0, Math.PI*2);
          ctx.fill();
        }
      } else if (obj.type === 'tree') {
        const base = project(obj.pos, eyeSign, halfW, offX);
        const top = project(obj.pos.add(new Vec3(0, obj.height, 0)), eyeSign, halfW, offX);
        if (base.visible && top.visible) {
          ctx.strokeStyle = '#4a2511';
          ctx.lineWidth = 10 * base.scale;
          ctx.beginPath();
          ctx.moveTo(base.x, base.y);
          ctx.lineTo(top.x, top.y);
          ctx.stroke();
          
          ctx.fillStyle = '#2d5016';
          ctx.beginPath();
          ctx.arc(top.x, top.y, 30 * base.scale, 0, Math.PI*2);
          ctx.fill();
        }
      } else if (obj.type === 'building') {
        const base = project(obj.pos, eyeSign, halfW, offX);
        const top = project(obj.pos.add(new Vec3(0, obj.height, 0)), eyeSign, halfW, offX);
        if (base.visible && top.visible) {
          const w = obj.width * base.scale * halfW;
          ctx.fillStyle = '#3a3a3a';
          ctx.fillRect(base.x - w/2, top.y, w, base.y - top.y);
          ctx.strokeStyle = '#555';
          ctx.strokeRect(base.x - w/2, top.y, w, base.y - top.y);
        }
      }
    });
  }
}

let currentWorld = new World(CONFIG.currentWorld);

// ==================== МУЗЫКАЛЬНАЯ СИСТЕМА ====================
let audioCtx = null;
let musicEnabled = true;

function initAudio() {
  if (!audioCtx) {
    audioCtx = new (window.AudioContext || window.webkitAudioContext)();
  }
}

function playNote(freq, duration=0.3, type='sine') {
  if (!musicEnabled || !audioCtx) return;
  const osc = audioCtx.createOscillator();
  const gain = audioCtx.createGain();
  osc.type = type;
  osc.frequency.value = freq;
  gain.gain.setValueAtTime(0.2, audioCtx.currentTime);
  gain.gain.exponentialRampToValueAtTime(0.001, audioCtx.currentTime + duration);
  osc.connect(gain).connect(audioCtx.destination);
  osc.start();
  osc.stop(audioCtx.currentTime + duration);
}

function playHandSound(hand) {
  if (!musicEnabled) return;
  // Высота звука зависит от высоты руки
  const pitch = 200 + (CAM_Y - hand[0].y) * 300;
  playNote(pitch, 0.2, 'sine');
}

// ==================== МИР И ФИЗИКА ====================
let floorY = 0.0;
let objects = [];

class PhysObject {
  constructor(pos, shape, color, size=0.08) {
    this.pos = pos.clone(); this.vel = new Vec3(); this.shape = shape;
    this.color = color; this.size = size;
    this.held = false; this.heldByHand = -1; this.holdOffset = new Vec3();
    this.history = []; this.rotation = Math.random() * 6;
    this.glow = 0;
  }
  update(dt, now) {
    if (this.held) {
      const hand = hands3D[this.heldByHand];
      if (hand && isPinch3D(hand)) {
        const target = hand[8].add(this.holdOffset);
        this.pos = target;
        this.history.push({ pos: target.clone(), time: now });
        if (this.history.length > 4) this.history.shift();
        this.glow = Math.min(this.glow + dt * 2, 1);
      } else this.release();
    } else {
      this.vel.y -= 15 * dt;
      this.pos = this.pos.add(this.vel.mul(dt));
      if (this.pos.y < floorY + this.size) {
        this.pos.y = floorY + this.size;
        this.vel.y *= -0.5; this.vel.x *= 0.9; this.vel.z *= 0.9;
        emitParticles(this.pos, 5, 'rgba(255,255,255,1)', 0.5);
      }
      if (Math.abs(this.pos.x) > 2.5) { this.pos.x = Math.sign(this.pos.x)*2.5; this.vel.x *= -0.5; }
      if (this.pos.z < 0.2) { this.pos.z = 0.2; this.vel.z *= -0.5; }
      if (this.pos.z > 4) { this.pos.z = 4; this.vel.z *= -0.5; }
      this.glow = Math.max(this.glow - dt, 0);
    }
    this.rotation += this.vel.x * dt;
  }
  release() {
    if (this.history.length >= 2) {
      const last = this.history[this.history.length-1];
      const first = this.history[0];
      const dt = (last.time - first.time) / 1000;
      if (dt > 0) this.vel = last.pos.sub(first.pos).mul(1/dt);
    }
    this.held = false; this.heldByHand = -1; this.history = [];
  }
}

function drawHands2D() {
  const connections = [
    [0,1],[1,2],[2,3],[3,4], [0,5],[5,6],[6,7],[7,8],
    [5,9],[9,10],[10,11],[11,12], [9,13],[13,14],[14,15],[15,16],
    [13,17],[17,18],[18,19],[19,20],[0,17]
  ];
  
  const colors = ['#00d2ff', '#ff00ea'];
  
  hands2D.forEach((hand, hi) => {
    const color = colors[hi % 2];
    
    ctx.strokeStyle = color;
    ctx.lineWidth = 5;
    ctx.lineCap = 'round';
    ctx.lineJoin = 'round';
    ctx.shadowColor = color;
    ctx.shadowBlur = 10;
    
    for (const [a, b] of connections) {
      ctx.beginPath();
      ctx.moveTo(hand[a].x, hand[a].y);
      ctx.lineTo(hand[b].x, hand[b].y);
      ctx.stroke();
    }
    
    ctx.shadowBlur = 0;
    
    for (let i = 0; i < hand.length; i++) {
      const isTip = [4,8,12,16,20].includes(i);
      ctx.fillStyle = isTip ? '#fff' : color;
      ctx.beginPath();
      ctx.arc(hand[i].x, hand[i].y, isTip ? 7 : 4, 0, Math.PI*2);
      ctx.fill();
    }
    
    const tip = hand[8];
    const pinched = isPinch2D(hand);
    ctx.strokeStyle = pinched ? '#ffff00' : 'rgba(255,255,255,0.7)';
    ctx.lineWidth = 3;
    ctx.beginPath();
    ctx.arc(tip.x, tip.y, pinched ? 20 : 12, 0, Math.PI*2);
    ctx.stroke();
    
    if (pinched) {
      ctx.fillStyle = 'rgba(255,255,0,0.3)';
      ctx.beginPath();
      ctx.arc(tip.x, tip.y, 20, 0, Math.PI*2);
      ctx.fill();
    }
  });
}

function drawObject(obj, eyeSign, halfW, offX) {
  const p = project(obj.pos, eyeSign, halfW, offX);
  if (!p.visible) return;
  const size = obj.size * p.scale * halfW * 1.5;
  if (size < 1) return;
  
  // Свечение
  if (obj.glow > 0) {
    ctx.shadowColor = obj.color;
    ctx.shadowBlur = 20 * obj.glow;
  }
  
  const sProj = project(new Vec3(obj.pos.x, floorY, obj.pos.z), eyeSign, halfW, offX);
  if (sProj.visible) {
    ctx.fillStyle = 'rgba(0,0,0,0.4)';
    ctx.beginPath();
    ctx.ellipse(sProj.x, sProj.y, size*0.8, size*0.3, 0, 0, Math.PI*2);
    ctx.fill();
  }
  
  ctx.save();
  ctx.translate(p.x, p.y);
  ctx.rotate(obj.rotation);
  ctx.fillStyle = obj.color;
  ctx.strokeStyle = '#fff';
  ctx.lineWidth = 2;
  
  if (obj.shape === 'cube') {
    ctx.fillRect(-size, -size, size*2, size*2);
    ctx.strokeRect(-size, -size, size*2, size*2);
  } else if (obj.shape === 'sphere') {
    const g = ctx.createRadialGradient(-size*0.3, -size*0.3, 0, 0, 0, size);
    g.addColorStop(0, '#fff'); g.addColorStop(0.4, obj.color); g.addColorStop(1, '#000');
    ctx.fillStyle = g;
    ctx.beginPath(); ctx.arc(0, 0, size, 0, Math.PI*2); ctx.fill();
  } else if (obj.shape === 'cylinder') {
    ctx.fillRect(-size*0.6, -size, size*1.2, size*2);
    ctx.strokeRect(-size*0.6, -size, size*1.2, size*2);
  } else if (obj.shape === 'pyramid') {
    ctx.beginPath(); ctx.moveTo(0, -size); ctx.lineTo(-size, size); ctx.lineTo(size, size); ctx.fill(); ctx.stroke();
  }
  
  if (obj.held) {
    ctx.strokeStyle = '#0ff'; ctx.lineWidth = 4;
    ctx.beginPath(); ctx.arc(0, 0, size*1.3, 0, Math.PI*2); ctx.stroke();
  }
  
  ctx.restore();
  ctx.shadowBlur = 0;
}

function drawMenu(eyeSign, halfW, offX) {
  if (!menuVisible) return;
  
  const cat = CATEGORIES[currentCategory];
  const titlePos = project(new Vec3(0, CAM_Y + 0.4, 1.0), eyeSign, halfW, offX);
  if (titlePos.visible) {
    ctx.fillStyle = cat.color;
    ctx.font = 'bold 26px Arial';
    ctx.textAlign = 'center';
    ctx.shadowColor = cat.color;
    ctx.shadowBlur = 15;
    ctx.fillText(cat.label, titlePos.x, titlePos.y);
    ctx.shadowBlur = 0;
    ctx.fillStyle = '#fff';
    ctx.font = '16px Arial';
    ctx.fillText(`${currentCategory + 1} / ${CATEGORIES.length}  ← свайп →`, titlePos.x, titlePos.y + 28);
  }
  
  const items = APPS[cat.id];
  items.forEach((item, i) => {
    const p = project(item.pos, eyeSign, halfW, offX);
    if (!p.visible) return;
    const size = 0.08 * p.scale * halfW * 1.5;
    
    let hovered = false;
    for (const hand of hands3D) {
      if (dist3(hand[8], item.pos) < 0.08) hovered = true;
    }
    
    ctx.save();
    ctx.translate(p.x, p.y);
    
    if (hovered) {
      ctx.shadowColor = item.color;
      ctx.shadowBlur = 20;
    }
    
    ctx.fillStyle = hovered ? item.color : 'rgba(20,20,40,0.9)';
    ctx.strokeStyle = item.color;
    ctx.lineWidth = hovered ? 5 : 2;
    ctx.beginPath(); ctx.arc(0, 0, size, 0, Math.PI*2); ctx.fill(); ctx.stroke();
    
    ctx.shadowBlur = 0;
    
    ctx.fillStyle = hovered ? '#000' : '#fff';
    ctx.font = `bold ${size*0.9}px Arial`;
    ctx.textAlign = 'center'; ctx.textBaseline = 'middle';
    ctx.fillText(item.icon, 0, 0);
    
    ctx.fillStyle = '#fff';
    ctx.font = `bold ${size*0.35}px Arial`;
    ctx.fillText(item.label, 0, size * 1.4);
    ctx.restore();
  });
}

function drawFloor(eyeSign, halfW, offX) {
  ctx.strokeStyle = 'rgba(255, 255, 255, 0.15)';
  ctx.lineWidth = 1;
  for(let x=-2; x<=2; x+=0.5) {
    const p1 = project(new Vec3(x, floorY, 0.5), eyeSign, halfW, offX);
    const p2 = project(new Vec3(x, floorY, 3.0), eyeSign, halfW, offX);
    if(p1.visible && p2.visible) { ctx.beginPath(); ctx.moveTo(p1.x,p1.y); ctx.lineTo(p2.x,p2.y); ctx.stroke(); }
  }
  for(let z=0.5; z<=3; z+=0.5) {
    const p1 = project(new Vec3(-2, floorY, z), eyeSign, halfW, offX);
    const p2 = project(new Vec3(2, floorY, z), eyeSign, halfW, offX);
    if(p1.visible && p2.visible) { ctx.beginPath(); ctx.moveTo(p1.x,p1.y); ctx.lineTo(p2.x,p2.y); ctx.stroke(); }
  }
}

// ==================== ГЛАВНЫЙ ЦИКЛ ====================
let lastTime = performance.now();
let prevPinchState = [false, false];
let dataRefreshTimer = 0;
let totalObjectsGrabbed = 0;
let totalDistance = 0;

function loop() {
  const now = performance.now();
  const dt = Math.min((now - lastTime) / 1000, 0.1);
  lastTime = now;
  
  // FPS counter
  frameCount++;
  if (now - lastFPSTime > 1000) {
    FPS = frameCount;
    frameCount = 0;
    lastFPSTime = now;
  }
  
  dataRefreshTimer += dt;
  if (dataRefreshTimer > 60) {
    dataRefreshTimer = 0;
    loadWeather(); loadCrypto();
  }
  
  ctx.clearRect(0, 0, W, H);
  
  // Обработка жестов
  hands3D.forEach((hand, i) => {
    const pinched = isPinch3D(hand);
    const justPinched = pinched && !prevPinchState[i];
    
    // Музыка от движений
    if (CONFIG.enableMusic && hands3D.length > 0) {
      if (Math.random() < 0.02) playHandSound(hand);
    }
    
    if (!menuVisible && !activeApp) {
      const swipe = detectSwipe(i, hand);
      if (swipe) {
        if (swipe === 'left' && currentCategory < CATEGORIES.length - 1) {
          currentCategory++;
          ui.textContent = CATEGORIES[currentCategory].label;
        } else if (swipe === 'right' && currentCategory > 0) {
          currentCategory--;
          ui.textContent = CATEGORIES[currentCategory].label;
        }
      }
    }
    
    if (justPinched) {
      if (checkDoubleTap(i, now)) {
        if (activeApp) {
          activeApp = null;
          ui.textContent = 'Двойной щипок для меню';
        } else if (menuVisible) {
          menuVisible = false;
          ui.textContent = 'Свайп для смены категории';
        } else {
          const palm = hand[9];
          buildMenu(new Vec3(palm.x, palm.y + 0.2, palm.z));
          ui.textContent = 'Выбери приложение щипком';
        }
      } else if (menuVisible) {
        const tip = hand[8];
        const items = APPS[CATEGORIES[currentCategory].id];
        for (const item of items) {
          if (dist3(tip, item.pos) < 0.08) {
            if (item.type === 'object') {
              const newObj = new PhysObject(tip, item.id, item.color);
              objects.push(newObj);
              newObj.held = true;
              newObj.heldByHand = i;
              newObj.holdOffset = newObj.pos.sub(tip);
              menuVisible = false;
              ui.textContent = 'Держи... Отпусти чтобы бросить';
              totalObjectsGrabbed++;
              emitParticles(tip, 20, 'rgba(0,255,255,1)', 1);
              playNote(440, 0.2);
              
              if (totalObjectsGrabbed === 1) unlockAchievement('first_grab', 'Первый захват', 'Взял первый объект');
              if (totalObjectsGrabbed === 10) unlockAchievement('grab_master', 'Мастер захвата', 'Взял 10 объектов');
            } else if (item.type === 'vk') {
              // VK Video
              menuVisible = false;
            } else if (item.type === 'app') {
              activeApp = item;
              menuVisible = false;
              ui.textContent = item.label + ' | Двойной щипок для закрытия';
            }
            break;
          }
        }
      } else {
        const tip = hand[8];
        let closest = null, minDist = 0.15;
        for (const obj of objects) {
          if (!obj.held) {
            const d = dist3(tip, obj.pos);
            if (d < minDist) { closest = obj; minDist = d; }
          }
        }
        if (closest) {
          closest.held = true;
          closest.heldByHand = i;
          closest.holdOffset = closest.pos.sub(tip);
          ui.textContent = 'Держи...';
          totalObjectsGrabbed++;
          emitParticles(tip, 15, 'rgba(255,255,0,1)', 0.8);
          playNote(523, 0.15);
        }
      }
    }
    
    if (!pinched && prevPinchState[i]) {
      for (const obj of objects) {
        if (obj.held && obj.heldByHand === i) {
          obj.release();
          emitParticles(obj.pos, 10, 'rgba(255,100,100,1)', 1.5);
          playNote(262, 0.2);
        }
      }
    }
    
    prevPinchState[i] = pinched;
    
    if (hand[0].y < CAM_Y - 0.6) {
      floorY = Math.min(floorY, hand[0].y - 0.1);
    }
  });
  
  // Физика
  for (const obj of objects) obj.update(dt, now);
  objects = objects.filter(o => o.pos.y > -10);
  
  // Частицы
  particles = particles.filter(p => p.life > 0);
  particles.forEach(p => p.update(dt));
  
  // Стерео рендер
  const halfW = W / 2;
  for (let eye = 0; eye < 2; eye++) {
    const eyeSign = eye === 0 ? -1 : 1;
    const offX = eye * halfW;
    
    ctx.save();
    ctx.beginPath(); ctx.rect(offX, 0, halfW, H); ctx.clip();
    
    currentWorld.draw(eyeSign, halfW, offX);
    drawFloor(eyeSign, halfW, offX);
    
    objects.sort((a,b) => b.pos.z - a.pos.z).forEach(obj => drawObject(obj, eyeSign, halfW, offX));
    
    particles.forEach(p => p.draw(eyeSign, halfW, offX));
    
    drawMenu(eyeSign, halfW, offX);
    
    ctx.restore();
  }
  
  drawHands2D();
  
  // Статистика
  if (CONFIG.enableStats) {
    stats.style.display = 'block';
    stats.innerHTML = `FPS: ${FPS}<br>Объекты: ${objects.length}<br>Частицы: ${particles.length}<br>Мир: ${CONFIG.currentWorld}`;
  }
  
  requestAnimationFrame(loop);
}

  startBtn.textContent = '⏳ ЗАПУСК...';
  
  const ok = await requestCamera();
  if (!ok) return;
  
  startScreen.style.display = 'none';
  loading.style.display = 'flex';
  
  try {
    initAudio();
    await initHandTracking();
    await loadAllData();
    loading.style.display = 'none';
    ui.style.display = 'block';
    
    unlockAchievement('welcome', 'Добро пожаловать!', 'Запустил ULTIMATE VR');
    
    loop();
  } catch (e) {
    loadingText.textContent = 'Ошибка: ' + e.message;
  }
});
</script>
</body>
</html>
