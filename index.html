<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
    <title>VR Room Designer PRO - No Mirror</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body { 
            overflow: hidden; 
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background: #000;
            width: 100vw;
            height: 100vh;
        }
        
        /* УБРАНО transform: scaleX(-1) - теперь видео не зеркалится */
        #videoInput {
            position: fixed;
            top: 0;
            left: 0;
            width: 100vw;
            height: 100vh;
            object-fit: cover;
            z-index: 0;
        }
        
        #gameCanvas { 
            position: fixed;
            top: 0;
            left: 0;
            width: 100vw; 
            height: 100vh; 
            z-index: 1;
        }
        
        /* УБРАНО transform: scaleX(-1) - скелет рисуется там же, где рука */
        #handOverlay {
            position: fixed;
            top: 0;
            left: 0;
            width: 100vw;
            height: 100vh;
            z-index: 2;
            pointer-events: none;
        }
        
        #loading {
            position: fixed; 
            top: 0; left: 0; 
            width: 100%; height: 100%;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            display: flex; 
            flex-direction: column; 
            justify-content: center; 
            align-items: center;
            z-index: 10000; 
            color: white;
        }
        
        #loading h1 {
            margin-bottom: 30px; 
            font-size: 48px;
            font-weight: bold;
            text-shadow: 0 4px 20px rgba(0,0,0,0.3);
        }
        
        .loader {
            width: 80px; height: 80px;
            border: 6px solid rgba(255, 255, 255, 0.2);
            border-top-color: #fff;
            border-radius: 50%;
            animation: spin 0.8s linear infinite;
        }
        
        @keyframes spin { to { transform: rotate(360deg); } }
        
        #startButton {
            position: fixed;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
            border: none;
            padding: 25px 60px;
            border-radius: 50px;
            font-size: 28px;
            font-weight: bold;
            cursor: pointer;
            z-index: 10001;
            box-shadow: 0 15px 50px rgba(102, 126, 234, 0.6);
            transition: all 0.3s ease;
        }
        
        #startButton:hover {
            transform: translate(-50%, -50%) scale(1.05);
        }
        
        #status {
            position: fixed;
            top: 20px;
            left: 20px;
            background: rgba(0, 0, 0, 0.7);
            backdrop-filter: blur(20px);
            color: #00ff88;
            padding: 15px 25px;
            border-radius: 15px;
            font-size: 14px;
            z-index: 1000;
            font-weight: 600;
            border: 2px solid rgba(0, 255, 136, 0.3);
        }
        
        #instructions {
            position: fixed;
            bottom: 30px;
            left: 50%;
            transform: translateX(-50%);
            background: rgba(0, 0, 0, 0.8);
            backdrop-filter: blur(20px);
            color: white;
            padding: 20px 40px;
            border-radius: 20px;
            font-size: 16px;
            text-align: center;
            z-index: 100;
            border: 2px solid rgba(255, 255, 255, 0.2);
            max-width: 90%;
        }
        
        /* УБРАНО transform: scaleX(-1) у индикатора */
        #gestureIndicator {
            position: fixed; 
            width: 120px; height: 120px;
            border: 6px solid rgba(0, 255, 136, 0.9);
            border-radius: 50%; 
            pointer-events: none;
            opacity: 0; 
            transition: opacity 0.2s, transform 0.2s;
            z-index: 100;
            box-shadow: 0 0 50px rgba(0, 255, 136, 0.8);
        }
        
        #gestureIndicator.active {
            opacity: 1;
            transform: scale(1.2);
            animation: pulse 0.5s ease-in-out infinite;
        }
        
        @keyframes pulse {
            0%, 100% { box-shadow: 0 0 50px rgba(0, 255, 136, 0.8); }
            50% { box-shadow: 0 0 80px rgba(0, 255, 136, 1); }
        }
        
        #objectCounter {
            position: fixed;
            top: 20px;
            right: 20px;
            background: rgba(0, 0, 0, 0.7);
            backdrop-filter: blur(20px);
            color: #ffaa00;
            padding: 15px 25px;
            border-radius: 15px;
            font-size: 16px;
            font-weight: bold;
            z-index: 1000;
            border: 2px solid rgba(255, 170, 0, 0.3);
        }
    </style>
</head>
<body>
    <div id="loading">
        <h1>🎮 VR Room Designer PRO</h1>
        <div class="loader"></div>
        <p style="margin-top: 30px; font-size: 20px; font-weight: 600;">Загрузка...</p>
    </div>
    
    <button id="startButton">🚀 НАЧАТЬ ИГРУ</button>
    
    <video id="videoInput" autoplay playsinline muted></video>
    <canvas id="gameCanvas"></canvas>
    <canvas id="handOverlay"></canvas>
    
    <div id="gestureIndicator"></div>
    <div id="objectCounter">Объекты: 0</div>
    <div id="status">Готово к запуску</div>
    <div id="instructions">
        ✋ Покажи руку | 🤏 Щипок = взять/бросить | 🎯 Двойной щипок = меню
    </div>
    
    <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/cannon@0.6.2/build/cannon.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/@mediapipe/hands@0.4.1646424915/hands.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/@mediapipe/camera_utils@0.3.1640029074/camera_utils.min.js"></script>
    
    <script>
        let scene, camera, renderer, world;
        let physicsObjects = [];
        let handSkeleton = null;
        let hands, videoElement, overlayCanvas, overlayCtx;
        let isPinching = false;
        let grabbedObject = null;
        let pinchCount = 0;
        let lastPinchTime = 0;
        let radialMenu = null;
        let isMenuOpen = false;
        let gameStarted = false;
        let lastLandmarks = null;
        
        let handPositionHistory = [];
        const HISTORY_SIZE = 5;
        
        const HAND_CONNECTIONS = [
            [0, 1], [1, 2], [2, 3], [3, 4],
            [0, 5], [5, 6], [6, 7], [7, 8],
            [0, 9], [9, 10], [10, 11], [11, 12],
            [0, 13], [13, 14], [14, 15], [15, 16],
            [0, 17], [17, 18], [18, 19], [19, 20]
        ];
        
        const spawnItems = [
            { name: '🧊 Красный куб', type: 'cube', color: 0xff4444, size: 0.3, mass: 1 },
            { name: '🧊 Синий куб', type: 'cube', color: 0x4488ff, size: 0.3, mass: 1 },
            { name: '🧊 Зелёный куб', type: 'cube', color: 0x44ff88, size: 0.3, mass: 1 },
            { name: '🧊 Жёлтый куб', type: 'cube', color: 0xffff44, size: 0.3, mass: 1 },
            { name: '⚽ Футбол', type: 'ball', color: 0x222222, size: 0.25, mass: 0.5 },
            { name: '🎾 Теннис', type: 'ball', color: 0xccff00, size: 0.15, mass: 0.3 },
            { name: '🏀 Баскет', type: 'ball', color: 0xff6600, size: 0.3, mass: 0.6 },
            { name: '🎱 Бильярд', type: 'ball', color: 0x111111, size: 0.12, mass: 0.4 }
        ];
        
        const materials = {};
        function getMaterial(color) {
            if (!materials[color]) {
                materials[color] = new THREE.MeshLambertMaterial({ 
                    color: color,
                    emissive: color,
                    emissiveIntensity: 0.1
                });
            }
            return materials[color];
        }
        
        document.getElementById('startButton').addEventListener('click', async () => {
            document.getElementById('startButton').style.display = 'none';
            await startGame();
        });
        
        async function startGame() {
            try {
                initThreeJS();
                initPhysics();
                await initCamera();
                document.getElementById('loading').style.display = 'none';
                gameStarted = true;
                updateStatus('✅ Камера активна!');
                animate();
            } catch (error) {
                console.error('Ошибка:', error);
                alert('Ошибка: ' + error.message);
            }
        }
        
        function initThreeJS() {
            scene = new THREE.Scene();
            camera = new THREE.PerspectiveCamera(75, window.innerWidth / window.innerHeight, 0.1, 1000);
            camera.position.set(0, 2, 5);
            camera.lookAt(0, 1, 0);
            
            renderer = new THREE.WebGLRenderer({ 
                canvas: document.getElementById('gameCanvas'), 
                antialias: false,
                alpha: true,
                powerPreference: "high-performance"
            });
            renderer.setSize(window.innerWidth, window.innerHeight);
            renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));
            renderer.setClearColor(0x000000, 0);
            
            const ambientLight = new THREE.AmbientLight(0xffffff, 0.9);
            scene.add(ambientLight);
            
            const dirLight = new THREE.DirectionalLight(0xffffff, 0.7);
            dirLight.position.set(5, 10, 5);
            scene.add(dirLight);
            
            createRoom();
            window.addEventListener('resize', onWindowResize);
        }
        
        function createRoom() {
            const floorGeometry = new THREE.PlaneGeometry(12, 12);
            const floorMaterial = new THREE.MeshLambertMaterial({ 
                color: 0x886644,
                transparent: true,
                opacity: 0.4
            });
            const floor = new THREE.Mesh(floorGeometry, floorMaterial);
            floor.rotation.x = -Math.PI / 2;
            scene.add(floor);
            
            createWall(0, 3, -6, 12, 6, 0.2, 0x888888);
            createWall(-6, 3, 0, 0.2, 6, 12, 0x888888);
            createWall(6, 3, 0, 0.2, 6, 12, 0x888888);
        }
        
        function createWall(x, y, z, w, h, d, color) {
            const geometry = new THREE.BoxGeometry(w, h, d);
            const material = new THREE.MeshLambertMaterial({ 
                color: color,
                transparent: true,
                opacity: 0.25
            });
            const wall = new THREE.Mesh(geometry, material);
            wall.position.set(x, y, z);
            scene.add(wall);
        }
        
        function initPhysics() {
            world = new CANNON.World();
            world.gravity.set(0, -9.82, 0);
            world.broadphase = new CANNON.NaiveBroadphase();
            world.solver.iterations = 5;
            
            const floorShape = new CANNON.Plane();
            const floorBody = new CANNON.Body({ mass: 0 });
            floorBody.addShape(floorShape);
            floorBody.quaternion.setFromAxisAngle(new CANNON.Vec3(1, 0, 0), -Math.PI / 2);
            world.addBody(floorBody);
            
            createPhysicsWall(0, 3, -6, 12, 6, 0.2);
            createPhysicsWall(-6, 3, 0, 0.2, 6, 12);
            createPhysicsWall(6, 3, 0, 0.2, 6, 12);
        }
        
        function createPhysicsWall(x, y, z, w, h, d) {
            const shape = new CANNON.Box(new CANNON.Vec3(w/2, h/2, d/2));
            const body = new CANNON.Body({ mass: 0 });
            body.addShape(shape);
            body.position.set(x, y, z);
            world.addBody(body);
        }
        
        async function initCamera() {
            videoElement = document.getElementById('videoInput');
            overlayCanvas = document.getElementById('handOverlay');
            overlayCtx = overlayCanvas.getContext('2d');
            
            overlayCanvas.width = window.innerWidth;
            overlayCanvas.height = window.innerHeight;
            
            hands = new Hands({
                locateFile: (file) => {
                    return `https://cdn.jsdelivr.net/npm/@mediapipe/hands@0.4.1646424915/${file}`;
                }
            });
            
            hands.setOptions({
                maxNumHands: 1,
                modelComplexity: 1,
                minDetectionConfidence: 0.6,
                minTrackingConfidence: 0.6,
                selfieMode: false // НЕ зеркальный режим для MediaPipe
            });
            
            hands.onResults(onHandResults);
            
            const stream = await navigator.mediaDevices.getUserMedia({ 
                video: { 
                    width: { ideal: 1280 },
                    height: { ideal: 720 },
                    facingMode: 'user'
                } 
            });
            
            videoElement.srcObject = stream;
            
            await new Promise((resolve, reject) => {
                videoElement.onloadedmetadata = () => {
                    videoElement.play().then(resolve).catch(reject);
                };
            });
            
            const cam = new Camera(videoElement, {
                onFrame: async () => {
                    await hands.send({ image: videoElement });
                },
                width: 1280,
                height: 720
            });
            cam.start();
        }
        
        function onHandResults(results) {
            overlayCtx.clearRect(0, 0, overlayCanvas.width, overlayCanvas.height);
            
            if (results.multiHandLandmarks && results.multiHandLandmarks.length > 0) {
                const landmarks = results.multiHandLandmarks[0];
                lastLandmarks = landmarks;
                
                drawHandSkeleton(landmarks);
                updateHandSkeleton3D(landmarks);
                updateHandVelocity(landmarks);
                checkGestures(landmarks);
                interactWithObjects(landmarks);
                
                if (isMenuOpen && radialMenu) {
                    checkMenuInteraction(landmarks);
                }
                
            } else {
                lastLandmarks = null;
                
                if (handSkeleton) {
                    handSkeleton.joints.forEach(j => j.visible = false);
                    handSkeleton.bones.forEach(b => b.visible = false);
                }
                
                if (grabbedObject) releaseObject();
            }
        }
        
        function drawHandSkeleton(landmarks) {
            overlayCtx.strokeStyle = '#00ff88';
            overlayCtx.lineWidth = 4;
            overlayCtx.lineCap = 'round';
            overlayCtx.shadowBlur = 10;
            overlayCtx.shadowColor = '#00ff88';
            
            HAND_CONNECTIONS.forEach(([start, end]) => {
                // Координаты как есть, без инверсии X
                const x1 = landmarks[start].x * overlayCanvas.width;
                const y1 = landmarks[start].y * overlayCanvas.height;
                const x2 = landmarks[end].x * overlayCanvas.width;
                const y2 = landmarks[end].y * overlayCanvas.height;
                
                overlayCtx.beginPath();
                overlayCtx.moveTo(x1, y1);
                overlayCtx.lineTo(x2, y2);
                overlayCtx.stroke();
            });
            
            landmarks.forEach((landmark, index) => {
                const x = landmark.x * overlayCanvas.width;
                const y = landmark.y * overlayCanvas.height;
                const isFingertip = [4, 8, 12, 16, 20].includes(index);
                
                overlayCtx.fillStyle = isFingertip ? '#ffff00' : '#00ff88';
                overlayCtx.shadowBlur = isFingertip ? 15 : 8;
                overlayCtx.shadowColor = isFingertip ? '#ffff00' : '#00ff88';
                overlayCtx.beginPath();
                overlayCtx.arc(x, y, isFingertip ? 10 : 6, 0, 2 * Math.PI);
                overlayCtx.fill();
            });
            
            overlayCtx.shadowBlur = 0;
        }
        
        function updateHandSkeleton3D(landmarks) {
            if (!handSkeleton) {
                handSkeleton = createHandSkeleton3D();
            }
            
            handSkeleton.joints.forEach(j => j.visible = true);
            handSkeleton.bones.forEach(b => b.visible = true);
            
            landmarks.forEach((landmark, index) => {
                // Для фронтальной камеры без selfieMode:
                // X инвертируем (0.5 - x) чтобы скелет был там же, где рука на экране
                const x = (0.5 - landmark.x) * 5;
                const y = (0.5 - landmark.y) * 5;
                const z = -landmark.z * 4;
                
                if (handSkeleton.joints[index]) {
                    handSkeleton.joints[index].position.set(x, y + 2, z);
                }
            });
            
            HAND_CONNECTIONS.forEach(([startIdx, endIdx], connIdx) => {
                if (handSkeleton.bones[connIdx]) {
                    const start = handSkeleton.joints[startIdx].position;
                    const end = handSkeleton.joints[endIdx].position;
                    const direction = new THREE.Vector3().subVectors(end, start);
                    const length = direction.length();
                    const midpoint = new THREE.Vector3().addVectors(start, end).multiplyScalar(0.5);
                    
                    handSkeleton.bones[connIdx].position.copy(midpoint);
                    handSkeleton.bones[connIdx].scale.y = length;
                    
                    const axis = new THREE.Vector3(0, 1, 0);
                    const quaternion = new THREE.Quaternion().setFromUnitVectors(axis, direction.normalize());
                    handSkeleton.bones[connIdx].quaternion.copy(quaternion);
                }
            });
        }
        
        function createHandSkeleton3D() {
            const skeleton = { joints: [], bones: [] };
            const color = 0x00ff88;
            
            for (let i = 0; i < 21; i++) {
                const isFingertip = [4, 8, 12, 16, 20].includes(i);
                const size = isFingertip ? 0.05 : 0.035;
                
                const geometry = new THREE.SphereGeometry(size, 8, 8);
                const material = new THREE.MeshBasicMaterial({ 
                    color: color,
                    transparent: true,
                    opacity: 0.9
                });
                const joint = new THREE.Mesh(geometry, material);
                joint.visible = false;
                scene.add(joint);
                skeleton.joints.push(joint);
            }
            
            HAND_CONNECTIONS.forEach(() => {
                const geometry = new THREE.CylinderGeometry(0.018, 0.018, 1, 6);
                const material = new THREE.MeshBasicMaterial({ 
                    color: color,
                    transparent: true,
                    opacity: 0.8
                });
                const bone = new THREE.Mesh(geometry, material);
                bone.visible = false;
                scene.add(bone);
                skeleton.bones.push(bone);
            });
            
            return skeleton;
        }
        
        function updateHandVelocity(landmarks) {
            const indexTip = landmarks[8];
            const pos = getHandPosition3D(indexTip);
            
            handPositionHistory.push({ pos: pos.clone(), time: performance.now() });
            
            if (handPositionHistory.length > HISTORY_SIZE) {
                handPositionHistory.shift();
            }
        }
        
        function getHandVelocity() {
            if (handPositionHistory.length < 2) return new THREE.Vector3(0, 0, 0);
            
            const current = handPositionHistory[handPositionHistory.length - 1];
            const old = handPositionHistory[0];
            const timeDiff = (current.time - old.time) / 1000;
            
            if (timeDiff < 0.001) return new THREE.Vector3(0, 0, 0);
            
            const velocity = new THREE.Vector3().subVectors(current.pos, old.pos);
            velocity.divideScalar(timeDiff);
            
            return velocity;
        }
        
        function checkGestures(landmarks) {
            const thumbTip = landmarks[4];
            const indexTip = landmarks[8];
            
            const distance = Math.sqrt(
                Math.pow(thumbTip.x - indexTip.x, 2) +
                Math.pow(thumbTip.y - indexTip.y, 2) +
                Math.pow(thumbTip.z - indexTip.z, 2)
            );
            
            const threshold = 0.06;
            const now = Date.now();
            
            if (distance < threshold && !isPinching) {
                isPinching = true;
                
                const indicator = document.getElementById('gestureIndicator');
                // Координаты без инверсии X
                const x = thumbTip.x * overlayCanvas.width;
                const y = thumbTip.y * overlayCanvas.height;
                indicator.style.left = (x - 60) + 'px';
                indicator.style.top = (y - 60) + 'px';
                indicator.classList.add('active');
                
                if (now - lastPinchTime > 400) {
                    pinchCount++;
                    lastPinchTime = now;
                    
                    if (pinchCount === 2) {
                        const menuPos = getHandPosition3D(thumbTip);
                        createMenu(menuPos);
                        pinchCount = 0;
                        updateStatus('✅ Меню открыто');
                    }
                    
                    setTimeout(() => { if (pinchCount === 1) pinchCount = 0; }, 800);
                }
                
                if (!isMenuOpen && !grabbedObject) {
                    tryGrabObject(indexTip);
                }
                
            } else if (distance >= threshold && isPinching) {
                isPinching = false;
                document.getElementById('gestureIndicator').classList.remove('active');
                
                if (grabbedObject) releaseObject();
            }
        }
        
        function getHandPosition3D(landmark) {
            // X инвертируем для правильного положения в 3D
            const x = (0.5 - landmark.x) * 5;
            const y = (0.5 - landmark.y) * 5;
            const z = -landmark.z * 4;
            return new THREE.Vector3(x, y + 2, z);
        }
        
        function tryGrabObject(indexTip) {
            const handPos = getHandPosition3D(indexTip);
            
            let closest = null;
            let closestDist = Infinity;
            
            physicsObjects.forEach(obj => {
                const objPos = new THREE.Vector3(
                    obj.body.position.x,
                    obj.body.position.y,
                    obj.body.position.z
                );
                const dist = handPos.distanceTo(objPos);
                
                if (dist < obj.userData.size * 1.8 && dist < closestDist) {
                    closestDist = dist;
                    closest = obj;
                }
            });
            
            if (closest) {
                grabbedObject = closest;
                grabbedObject.userData.grabbed = true;
                grabbedObject.body.type = CANNON.Body.KINEMATIC;
                grabbedObject.body.velocity.set(0, 0, 0);
                grabbedObject.body.angularVelocity.set(0, 0, 0);
                
                grabbedObject.mesh.material.emissive.setHex(0x444444);
                grabbedObject.mesh.material.emissiveIntensity = 0.5;
                
                updateStatus(`🎯 Захвачен: ${closest.userData.name}`);
            }
        }
        
        function releaseObject() {
            if (!grabbedObject) return;
            
            const velocity = getHandVelocity();
            const throwMultiplier = 2.0;
            
            grabbedObject.body.type = CANNON.Body.DYNAMIC;
            grabbedObject.body.velocity.set(
                velocity.x * throwMultiplier,
                velocity.y * throwMultiplier,
                velocity.z * throwMultiplier
            );
            grabbedObject.body.angularVelocity.set(
                (Math.random() - 0.5) * 5,
                (Math.random() - 0.5) * 5,
                (Math.random() - 0.5) * 5
            );
            
            grabbedObject.mesh.material.emissive.setHex(0x000000);
            grabbedObject.mesh.material.emissiveIntensity = 0.1;
            grabbedObject.userData.grabbed = false;
            grabbedObject = null;
            
            updateStatus('💨 Бросок!');
        }
        
        function interactWithObjects(landmarks) {
            if (grabbedObject) {
                const indexTip = landmarks[8];
                const handPos = getHandPosition3D(indexTip);
                
                grabbedObject.body.position.set(handPos.x, handPos.y, handPos.z);
                grabbedObject.body.velocity.set(0, 0, 0);
                grabbedObject.body.angularVelocity.set(0, 0, 0);
                return;
            }
            
            if (!isPinching) {
                const indexTip = landmarks[8];
                const handPos = getHandPosition3D(indexTip);
                
                physicsObjects.forEach(obj => {
                    if (obj.userData.grabbed) return;
                    
                    const objPos = new THREE.Vector3(
                        obj.body.position.x,
                        obj.body.position.y,
                        obj.body.position.z
                    );
                    const dist = handPos.distanceTo(objPos);
                    
                    if (dist < obj.userData.size + 0.2) {
                        const direction = new THREE.Vector3()
                            .subVectors(objPos, handPos)
                            .normalize();
                        
                        obj.body.applyImpulse(
                            new CANNON.Vec3(
                                direction.x * 6,
                                direction.y * 6 + 2,
                                direction.z * 6
                            ),
                            obj.body.position
                        );
                    }
                });
            }
        }
        
        function createMenu(position) {
            if (radialMenu) scene.remove(radialMenu);
            
            radialMenu = new THREE.Group();
            radialMenu.position.copy(position);
            radialMenu.position.z -= 1.5;
            
            const panelGeometry = new THREE.PlaneGeometry(3.5, 2.5);
            const panelMaterial = new THREE.MeshBasicMaterial({ 
                color: 0x1a1a2e,
                transparent: true,
                opacity: 0.95,
                side: THREE.DoubleSide
            });
            const panel = new THREE.Mesh(panelGeometry, panelMaterial);
            radialMenu.add(panel);
            
            const frameGeometry = new THREE.EdgesGeometry(panelGeometry);
            const frameMaterial = new THREE.LineBasicMaterial({ 
                color: 0x00ff88,
                linewidth: 3
            });
            const frame = new THREE.LineSegments(frameGeometry, frameMaterial);
            radialMenu.add(frame);
            
            const cols = 4;
            const spacing = 0.75;
            const startX = -((Math.min(spawnItems.length, cols) - 1) * spacing) / 2;
            
            spawnItems.forEach((item, index) => {
                const row = Math.floor(index / cols);
                const col = index % cols;
                const x = startX + col * spacing;
                const y = 0.4 - row * spacing;
                
                let buttonMesh;
                if (item.type === 'ball') {
                    const geometry = new THREE.SphereGeometry(0.25, 16, 16);
                    const material = getMaterial(item.color);
                    buttonMesh = new THREE.Mesh(geometry, material);
                } else {
                    const geometry = new THREE.BoxGeometry(0.4, 0.4, 0.4);
                    const material = getMaterial(item.color);
                    buttonMesh = new THREE.Mesh(geometry, material);
                }
                
                buttonMesh.position.set(x, y, 0.15);
                buttonMesh.userData = { item: item, originalColor: item.color, isSpawnButton: true };
                radialMenu.add(buttonMesh);
            });
            
            const closeGeometry = new THREE.SphereGeometry(0.2, 16, 16);
            const closeMaterial = new THREE.MeshBasicMaterial({ color: 0xff4444 });
            const closeButton = new THREE.Mesh(closeGeometry, closeMaterial);
            closeButton.position.set(1.5, 1.0, 0.15);
            closeButton.userData = { isCloseButton: true, originalColor: 0xff4444 };
            radialMenu.add(closeButton);
            
            scene.add(radialMenu);
            isMenuOpen = true;
        }
        
        function checkMenuInteraction(landmarks) {
            if (!radialMenu) return;
            
            const indexTip = landmarks[8];
            const handPos = getHandPosition3D(indexTip);
            
            radialMenu.children.forEach(button => {
                if (!button.userData) return;
                
                const buttonWorldPos = button.position.clone().add(radialMenu.position);
                const distance = handPos.distanceTo(buttonWorldPos);
                
                const hoverRadius = button.userData.isCloseButton ? 0.3 : 0.35;
                
                if (distance < hoverRadius) {
                    button.material.color.setHex(0xffff00);
                    button.scale.set(1.3, 1.3, 1.3);
                    
                    if (isPinching) {
                        handleMenuClick(button);
                    }
                } else {
                    button.material.color.setHex(button.userData.originalColor);
                    button.scale.set(1, 1, 1);
                }
            });
        }
        
        function handleMenuClick(button) {
            if (button.userData.isCloseButton) {
                scene.remove(radialMenu);
                radialMenu = null;
                isMenuOpen = false;
                updateStatus('❌ Меню закрыто');
            } else if (button.userData.isSpawnButton) {
                spawnItem(button.userData.item);
                scene.remove(radialMenu);
                radialMenu = null;
                isMenuOpen = false;
                updateStatus(`✅ Создан: ${button.userData.item.name}`);
                document.getElementById('objectCounter').textContent = `Объекты: ${physicsObjects.length}`;
            }
        }
        
        function spawnItem(itemData) {
            let geometry, shape;
            
            if (itemData.type === 'ball') {
                geometry = new THREE.SphereGeometry(itemData.size, 16, 16);
                shape = new CANNON.Sphere(itemData.size);
            } else {
                geometry = new THREE.BoxGeometry(itemData.size, itemData.size, itemData.size);
                shape = new CANNON.Box(new CANNON.Vec3(
                    itemData.size/2, itemData.size/2, itemData.size/2
                ));
            }
            
            const material = getMaterial(itemData.color);
            const mesh = new THREE.Mesh(geometry, material);
            
            const spawnPos = new THREE.Vector3(
                (Math.random() - 0.5) * 3,
                2.5 + Math.random(),
                2.5 + Math.random()
            );
            mesh.position.copy(spawnPos);
            scene.add(mesh);
            
            const body = new CANNON.Body({
                mass: itemData.mass,
                position: new CANNON.Vec3(spawnPos.x, spawnPos.y, spawnPos.z)
            });
            body.addShape(shape);
            body.linearDamping = 0.15;
            body.angularDamping = 0.25;
            world.addBody(body);
            
            physicsObjects.push({
                mesh: mesh,
                body: body,
                userData: {
                    name: itemData.name,
                    size: itemData.size,
                    type: itemData.type,
                    grabbed: false
                }
            });
            
            if (physicsObjects.length > 40) {
                const old = physicsObjects.shift();
                scene.remove(old.mesh);
                world.remove(old.body);
            }
        }
        
        function updateStatus(text) {
            document.getElementById('status').textContent = text;
        }
        
        function onWindowResize() {
            camera.aspect = window.innerWidth / window.innerHeight;
            camera.updateProjectionMatrix();
            renderer.setSize(window.innerWidth, window.innerHeight);
            overlayCanvas.width = window.innerWidth;
            overlayCanvas.height = window.innerHeight;
        }
        
        function animate() {
            if (!gameStarted) return;
            
            requestAnimationFrame(animate);
            
            world.step(1/60);
            
            physicsObjects.forEach(obj => {
                if (!obj.userData.grabbed) {
                    obj.mesh.position.copy(obj.body.position);
                    obj.mesh.quaternion.copy(obj.body.quaternion);
                }
            });
            
            renderer.render(scene, camera);
        }
    </script>
</body>
</html>
