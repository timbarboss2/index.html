<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
    <title>VR Room Designer - Full Hand Tracking</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        
        body { 
            overflow: hidden; 
            font-family: Arial, sans-serif; 
            background: #000;
            width: 100vw;
            height: 100vh;
        }
        
        /* Видео с камеры на весь экран */
        #videoInput {
            position: fixed;
            top: 0;
            left: 0;
            width: 100vw;
            height: 100vh;
            object-fit: cover;
            z-index: 0;
            transform: scaleX(-1);
        }
        
        /* 3D сцена поверх видео */
        #gameCanvas { 
            position: fixed;
            top: 0;
            left: 0;
            width: 100vw; 
            height: 100vh; 
            z-index: 1;
        }
        
        /* Overlay для скелета рук */
        #handOverlay {
            position: fixed;
            top: 0;
            left: 0;
            width: 100vw;
            height: 100vh;
            z-index: 2;
            pointer-events: none;
        }
        
        #loading {
            position: fixed; 
            top: 0; left: 0; 
            width: 100%; height: 100%;
            background: linear-gradient(135deg, #1a1a2e 0%, #16213e 100%);
            display: flex; 
            flex-direction: column; 
            justify-content: center; 
            align-items: center;
            z-index: 10000; 
            color: white;
        }
        
        #loading h1 {
            margin-bottom: 20px; 
            font-size: 32px;
            background: linear-gradient(45deg, #00d4ff, #7b2cbf);
            -webkit-background-clip: text; 
            -webkit-text-fill-color: transparent;
        }
        
        .loader {
            width: 50px; height: 50px;
            border: 5px solid rgba(255, 255, 255, 0.1);
            border-top-color: #00d4ff; 
            border-radius: 50%;
            animation: spin 1s linear infinite;
        }
        
        @keyframes spin { to { transform: rotate(360deg); } }
        
        #gestureIndicator {
            position: fixed; 
            width: 120px; height: 120px;
            border: 6px solid rgba(0, 255, 0, 0.9);
            border-radius: 50%; 
            pointer-events: none;
            opacity: 0; 
            transition: opacity 0.2s, transform 0.2s;
            z-index: 100;
            box-shadow: 0 0 40px rgba(0, 255, 0, 0.8);
        }
        
        #gestureIndicator.active {
            opacity: 1;
            transform: scale(1.1);
        }
        
        #status {
            position: fixed;
            top: 20px;
            left: 20px;
            background: rgba(0, 0, 0, 0.8);
            color: #00ff00;
            padding: 15px 20px;
            border-radius: 10px;
            font-size: 14px;
            z-index: 1000;
            font-family: monospace;
            max-width: 400px;
            border: 2px solid #00ff00;
        }
        
        #instructions {
            position: fixed;
            bottom: 20px;
            left: 50%;
            transform: translateX(-50%);
            background: rgba(0, 0, 0, 0.9);
            color: white;
            padding: 20px 30px;
            border-radius: 15px;
            font-size: 16px;
            text-align: center;
            z-index: 100;
            max-width: 90%;
            border: 2px solid #00d4ff;
        }
        
        #startButton {
            position: fixed;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            background: linear-gradient(45deg, #00d4ff, #7b2cbf);
            color: white;
            border: none;
            padding: 20px 50px;
            border-radius: 30px;
            font-size: 24px;
            font-weight: bold;
            cursor: pointer;
            z-index: 10001;
            box-shadow: 0 10px 40px rgba(0, 212, 255, 0.6);
            transition: transform 0.2s;
        }
        
        #startButton:hover {
            transform: translate(-50%, -50%) scale(1.05);
        }
        
        #error {
            position: fixed;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            background: rgba(255, 0, 0, 0.95);
            color: white;
            padding: 40px;
            border-radius: 15px;
            font-size: 18px;
            text-align: center;
            z-index: 10002;
            display: none;
            max-width: 80%;
        }
        
        #error button {
            margin-top: 20px;
            padding: 15px 40px;
            background: white;
            color: red;
            border: none;
            border-radius: 8px;
            font-size: 18px;
            cursor: pointer;
            font-weight: bold;
        }
    </style>
</head>
<body>
    <div id="loading">
        <h1>🖐 VR Room Designer</h1>
        <div class="loader"></div>
        <p style="margin-top: 20px; font-size: 18px;">Загрузка трекинга рук...</p>
    </div>
    
    <button id="startButton">🎮 НАЧАТЬ ИГРУ</button>
    
    <div id="error">
        <h2>❌ Ошибка камеры</h2>
        <p id="errorMessage">Не удалось получить доступ к камере</p>
        <button onclick="location.reload()">Попробовать снова</button>
    </div>
    
    <video id="videoInput" autoplay playsinline muted></video>
    <canvas id="gameCanvas"></canvas>
    <canvas id="handOverlay"></canvas>
    
    <div id="gestureIndicator"></div>
    <div id="status">Ожидание запуска...</div>
    <div id="instructions">
        ✋ Покажи руку камере | 🤏 Соедини большой и указательный палец для щипка | 📋 Двойной щипок = меню
    </div>
    
    <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/controls/OrbitControls.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/cannon@0.6.2/build/cannon.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/@mediapipe/hands@0.4.1646424915/hands.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/@mediapipe/camera_utils@0.3.1640029074/camera_utils.min.js"></script>
    
    <script>
        // ==================== ГЛОБАЛЬНЫЕ ПЕРЕМЕННЫЕ ====================
        let scene, camera, renderer, controls;
        let world;
        let objects = [];
        let handSkeletons = { left: null, right: null };
        let hands, videoElement, overlayCanvas, overlayCtx;
        let isPinching = { left: false, right: false };
        let pinchCount = 0;
        let lastPinchTime = 0;
        let radialMenu = null;
        let isMenuOpen = false;
        let gameStarted = false;
        
        const HAND_CONNECTIONS = [
            [0, 1], [1, 2], [2, 3], [3, 4],
            [0, 5], [5, 6], [6, 7], [7, 8],
            [0, 9], [9, 10], [10, 11], [11, 12],
            [0, 13], [13, 14], [14, 15], [15, 16],
            [0, 17], [17, 18], [18, 19], [19, 20]
        ];
        
        const categories = {
            furniture: [
                { name: '📺 Телевизор', type: 'tv', color: 0x2c3e50, width: 1.2, height: 0.8, depth: 0.2 },
                { name: '🛋️ Диван', type: 'sofa', color: 0xe74c3c, width: 2, height: 0.8, depth: 0.9 },
                { name: '🪑 Стул', type: 'chair', color: 0x3498db, width: 0.6, height: 0.9, depth: 0.6 },
                { name: '📚 Стол', type: 'table', color: 0x8b4513, width: 1.5, height: 0.75, depth: 0.8 }
            ],
            toys: [
                { name: '🧸 Мишка', type: 'bear', color: 0xd2691e, width: 0.4, height: 0.5, depth: 0.3 },
                { name: '🧊 Кубик', type: 'cube', color: 0xe74c3c, width: 0.3, height: 0.3, depth: 0.3 },
                { name: '⚽ Мяч', type: 'ball', color: 0x2ecc71, width: 0.3, height: 0.3, depth: 0.3, sphere: true }
            ]
        };
        
        // ==================== ЗАПУСК ИГРЫ ====================
        document.getElementById('startButton').addEventListener('click', async () => {
            document.getElementById('startButton').style.display = 'none';
            await startGame();
        });
        
        async function startGame() {
            try {
                // Инициализация Three.js
                initThreeJS();
                
                // Инициализация камеры
                await initCamera();
                
                // Скрываем загрузку
                document.getElementById('loading').style.display = 'none';
                gameStarted = true;
                
                updateStatus('✅ Камера активна! Покажи руку');
                
                // Запуск анимации
                animate();
                
            } catch (error) {
                console.error('Ошибка:', error);
                document.getElementById('loading').style.display = 'none';
                document.getElementById('errorMessage').textContent = error.message;
                document.getElementById('error').style.display = 'block';
            }
        }
        
        // ==================== THREE.JS ====================
        function initThreeJS() {
            scene = new THREE.Scene();
            
            camera = new THREE.PerspectiveCamera(75, window.innerWidth / window.innerHeight, 0.1, 1000);
            camera.position.set(0, 2, 5);
            camera.lookAt(0, 1, 0);
            
            renderer = new THREE.WebGLRenderer({ 
                canvas: document.getElementById('gameCanvas'), 
                antialias: true,
                alpha: true // Прозрачный фон!
            });
            renderer.setSize(window.innerWidth, window.innerHeight);
            renderer.setClearColor(0x000000, 0); // Полностью прозрачный
            renderer.shadowMap.enabled = true;
            
            // Физика
            world = new CANNON.World();
            world.gravity.set(0, -9.82, 0);
            
            // Освещение
            const ambientLight = new THREE.AmbientLight(0xffffff, 0.8);
            scene.add(ambientLight);
            
            const dirLight = new THREE.DirectionalLight(0xffffff, 0.6);
            dirLight.position.set(5, 10, 5);
            dirLight.castShadow = true;
            scene.add(dirLight);
            
            // Создаем комнату (полупрозрачную, чтобы видеть камеру)
            createRoom();
            
            window.addEventListener('resize', onWindowResize);
        }
        
        function createRoom() {
            // Пол (полупрозрачный)
            const floorGeometry = new THREE.PlaneGeometry(10, 10);
            const floorMaterial = new THREE.MeshStandardMaterial({ 
                color: 0x8b7355,
                transparent: true,
                opacity: 0.5
            });
            const floor = new THREE.Mesh(floorGeometry, floorMaterial);
            floor.rotation.x = -Math.PI / 2;
            floor.receiveShadow = true;
            scene.add(floor);
            
            const floorShape = new CANNON.Plane();
            const floorBody = new CANNON.Body({ mass: 0 });
            floorBody.addShape(floorShape);
            floorBody.quaternion.setFromAxisAngle(new CANNON.Vec3(1, 0, 0), -Math.PI / 2);
            world.addBody(floorBody);
            
            // Стены (полупрозрачные)
            createWall(0, 2.5, -5, 10, 5, 0.2, 0x95a5a6);
            createWall(-5, 2.5, 0, 0.2, 5, 10, 0x95a5a6);
            createWall(5, 2.5, 0, 0.2, 5, 10, 0x95a5a6);
        }
        
        function createWall(x, y, z, w, h, d, color) {
            const geometry = new THREE.BoxGeometry(w, h, d);
            const material = new THREE.MeshStandardMaterial({ 
                color: color,
                transparent: true,
                opacity: 0.3
            });
            const wall = new THREE.Mesh(geometry, material);
            wall.position.set(x, y, z);
            wall.receiveShadow = true;
            scene.add(wall);
            
            const shape = new CANNON.Box(new CANNON.Vec3(w/2, h/2, d/2));
            const body = new CANNON.Body({ mass: 0 });
            body.addShape(shape);
            body.position.set(x, y, z);
            world.addBody(body);
        }
        
        // ==================== КАМЕРА ====================
        async function initCamera() {
            videoElement = document.getElementById('videoInput');
            overlayCanvas = document.getElementById('handOverlay');
            overlayCtx = overlayCanvas.getContext('2d');
            
            overlayCanvas.width = window.innerWidth;
            overlayCanvas.height = window.innerHeight;
            
            // Инициализация MediaPipe Hands
            hands = new Hands({
                locateFile: (file) => {
                    return `https://cdn.jsdelivr.net/npm/@mediapipe/hands@0.4.1646424915/${file}`;
                }
            });
            
            hands.setOptions({
                maxNumHands: 2,
                modelComplexity: 1,
                minDetectionConfidence: 0.7,
                minTrackingConfidence: 0.7
            });
            
            hands.onResults(onHandResults);
            
            // Получение камеры
            const stream = await navigator.mediaDevices.getUserMedia({ 
                video: { 
                    width: { ideal: 1280 },
                    height: { ideal: 720 },
                    facingMode: 'user'
                } 
            });
            
            videoElement.srcObject = stream;
            
            await new Promise((resolve, reject) => {
                videoElement.onloadedmetadata = () => {
                    videoElement.play().then(resolve).catch(reject);
                };
                videoElement.onerror = () => reject(new Error('Ошибка видео'));
            });
            
            // Запуск обработки кадров
            const cam = new Camera(videoElement, {
                onFrame: async () => {
                    await hands.send({ image: videoElement });
                },
                width: 1280,
                height: 720
            });
            cam.start();
        }
        
        // ==================== ТРЕКИНГ РУК ====================
        function onHandResults(results) {
            // Очистка overlay
            overlayCtx.clearRect(0, 0, overlayCanvas.width, overlayCanvas.height);
            
            if (results.multiHandLandmarks && results.multiHandLandmarks.length > 0) {
                results.multiHandLandmarks.forEach((landmarks, index) => {
                    const handedness = results.multiHandedness[index].label;
                    
                    // Рисуем скелет на overlay
                    drawHandSkeleton(landmarks, handedness);
                    
                    // Обновляем 3D скелет
                    updateHandSkeleton3D(landmarks, handedness);
                    
                    // Проверяем жесты
                    checkGestures(landmarks, handedness);
                });
            } else {
                // Скрываем скелеты если руки не обнаружены
                if (handSkeletons.left) {
                    handSkeletons.left.joints.forEach(j => j.visible = false);
                    handSkeletons.left.bones.forEach(b => b.visible = false);
                }
                if (handSkeletons.right) {
                    handSkeletons.right.joints.forEach(j => j.visible = false);
                    handSkeletons.right.bones.forEach(b => b.visible = false);
                }
            }
        }
        
        function drawHandSkeleton(landmarks, handedness) {
            const color = handedness === 'Left' ? '#00ff00' : '#ff00ff';
            
            // Рисуем кости
            overlayCtx.strokeStyle = color;
            overlayCtx.lineWidth = 4;
            overlayCtx.lineCap = 'round';
            
            HAND_CONNECTIONS.forEach(([start, end]) => {
                const startPoint = landmarks[start];
                const endPoint = landmarks[end];
                
                // Зеркалим координаты
                const x1 = (1 - startPoint.x) * overlayCanvas.width;
                const y1 = startPoint.y * overlayCanvas.height;
                const x2 = (1 - endPoint.x) * overlayCanvas.width;
                const y2 = endPoint.y * overlayCanvas.height;
                
                overlayCtx.beginPath();
                overlayCtx.moveTo(x1, y1);
                overlayCtx.lineTo(x2, y2);
                overlayCtx.stroke();
            });
            
            // Рисуем суставы
            landmarks.forEach((landmark, index) => {
                const x = (1 - landmark.x) * overlayCanvas.width;
                const y = landmark.y * overlayCanvas.height;
                
                // Кончики пальцев больше и ярче
                const isFingertip = [4, 8, 12, 16, 20].includes(index);
                const radius = isFingertip ? 10 : 6;
                
                overlayCtx.fillStyle = isFingertip ? '#ffff00' : color;
                overlayCtx.beginPath();
                overlayCtx.arc(x, y, radius, 0, 2 * Math.PI);
                overlayCtx.fill();
                
                overlayCtx.strokeStyle = '#ffffff';
                overlayCtx.lineWidth = 2;
                overlayCtx.stroke();
            });
        }
        
        function updateHandSkeleton3D(landmarks, handedness) {
            const handKey = handedness.toLowerCase();
            
            if (!handSkeletons[handKey]) {
                handSkeletons[handKey] = createHandSkeleton3D(handKey);
            }
            
            const skeleton = handSkeletons[handKey];
            
            // Показываем скелет
            skeleton.joints.forEach(j => j.visible = true);
            skeleton.bones.forEach(b => b.visible = true);
            
            // Обновляем позиции суставов
            landmarks.forEach((landmark, index) => {
                // Преобразуем в 3D пространство
                const x = (0.5 - landmark.x) * 4; // Зеркалим и масштабируем
                const y = (0.5 - landmark.y) * 4;
                const z = -landmark.z * 3;
                
                if (skeleton.joints[index]) {
                    skeleton.joints[index].position.set(x, y + 2, z);
                }
            });
            
            // Обновляем кости
            HAND_CONNECTIONS.forEach(([startIdx, endIdx], connIdx) => {
                if (skeleton.bones[connIdx]) {
                    const start = skeleton.joints[startIdx].position;
                    const end = skeleton.joints[endIdx].position;
                    
                    const direction = new THREE.Vector3().subVectors(end, start);
                    const length = direction.length();
                    const midpoint = new THREE.Vector3().addVectors(start, end).multiplyScalar(0.5);
                    
                    skeleton.bones[connIdx].position.copy(midpoint);
                    skeleton.bones[connIdx].scale.y = length;
                    
                    const axis = new THREE.Vector3(0, 1, 0);
                    const quaternion = new THREE.Quaternion().setFromUnitVectors(axis, direction.normalize());
                    skeleton.bones[connIdx].quaternion.copy(quaternion);
                }
            });
        }
        
        function createHandSkeleton3D(handKey) {
            const skeleton = { joints: [], bones: [] };
            const color = handKey === 'left' ? 0x00ff00 : 0xff00ff;
            
            // Суставы
            for (let i = 0; i < 21; i++) {
                const isFingertip = [4, 8, 12, 16, 20].includes(i);
                const size = isFingertip ? 0.05 : 0.035;
                
                const geometry = new THREE.SphereGeometry(size, 16, 16);
                const material = new THREE.MeshStandardMaterial({ 
                    color: color,
                    emissive: color,
                    emissiveIntensity: 0.8,
                    metalness: 0.5,
                    roughness: 0.3
                });
                const joint = new THREE.Mesh(geometry, material);
                joint.castShadow = true;
                joint.visible = false;
                scene.add(joint);
                skeleton.joints.push(joint);
            }
            
            // Кости
            HAND_CONNECTIONS.forEach(() => {
                const geometry = new THREE.CylinderGeometry(0.02, 0.02, 1, 8);
                const material = new THREE.MeshStandardMaterial({ 
                    color: color,
                    emissive: color,
                    emissiveIntensity: 0.5,
                    metalness: 0.3,
                    roughness: 0.5
                });
                const bone = new THREE.Mesh(geometry, material);
                bone.castShadow = true;
                bone.visible = false;
                scene.add(bone);
                skeleton.bones.push(bone);
            });
            
            return skeleton;
        }
        
        // ==================== ЖЕСТЫ ====================
        function checkGestures(landmarks, handedness) {
            const handKey = handedness.toLowerCase();
            const thumbTip = landmarks[4];
            const indexTip = landmarks[8];
            
            const distance = Math.sqrt(
                Math.pow(thumbTip.x - indexTip.x, 2) +
                Math.pow(thumbTip.y - indexTip.y, 2) +
                Math.pow(thumbTip.z - indexTip.z, 2)
            );
            
            const threshold = 0.05;
            const now = Date.now();
            
            if (distance < threshold && !isPinching[handKey]) {
                // Щипок начался
                isPinching[handKey] = true;
                
                // Показываем индикатор
                const indicator = document.getElementById('gestureIndicator');
                const x = (1 - thumbTip.x) * overlayCanvas.width;
                const y = thumbTip.y * overlayCanvas.height;
                indicator.style.left = (x - 60) + 'px';
                indicator.style.top = (y - 60) + 'px';
                indicator.classList.add('active');
                
                // Считаем для двойного щипка
                if (now - lastPinchTime > 500) {
                    pinchCount++;
                    lastPinchTime = now;
                    
                    updateStatus(`🤏 Щипок #${pinchCount} (${handedness})`);
                    
                    if (pinchCount === 2) {
                        // Двойной щипок - открываем меню
                        const menuPos = getHandPosition3D(thumbTip);
                        createRadialMenu(menuPos);
                        pinchCount = 0;
                        updateStatus('✅ Двойной щипок! Меню открыто');
                    }
                    
                    // Сброс через 1 секунду
                    setTimeout(() => {
                        if (pinchCount === 1) {
                            pinchCount = 0;
                        }
                    }, 1000);
                }
                
                // Проверяем взаимодействие с меню
                if (isMenuOpen && radialMenu) {
                    checkMenuInteraction(thumbTip);
                }
                
            } else if (distance >= threshold && isPinching[handKey]) {
                // Щипок закончился
                isPinching[handKey] = false;
                document.getElementById('gestureIndicator').classList.remove('active');
            }
        }
        
        function getHandPosition3D(landmark) {
            const x = (0.5 - landmark.x) * 4;
            const y = (0.5 - landmark.y) * 4;
            const z = -landmark.z * 3;
            return new THREE.Vector3(x, y + 2, z);
        }
        
        function checkMenuInteraction(thumbTip) {
            const handPos = getHandPosition3D(thumbTip);
            
            // Проверяем расстояние до кнопок меню
            radialMenu.children.forEach(button => {
                const distance = handPos.distanceTo(button.position);
                
                if (distance < 0.4) {
                    // Подсвечиваем кнопку
                    button.material.color.setHex(0xffff00);
                    button.scale.set(1.2, 1.2, 1.2);
                    
                    // Если щипок - выбираем
                    if (isPinching.left || isPinching.right) {
                        handleMenuClick(button);
                    }
                } else {
                    button.material.color.setHex(0x3498db);
                    button.scale.set(1, 1, 1);
                }
            });
        }
        
        // ==================== МЕНЮ ====================
        function createRadialMenu(position) {
            if (radialMenu) scene.remove(radialMenu);
            
            radialMenu = new THREE.Group();
            radialMenu.position.copy(position);
            
            const categoriesList = Object.keys(categories);
            const radius = 1.5;
            const angleStep = (Math.PI * 2) / categoriesList.length;
            
            categoriesList.forEach((category, index) => {
                const angle = index * angleStep - Math.PI / 2;
                const x = Math.cos(angle) * radius;
                const z = Math.sin(angle) * radius;
                
                const buttonGeometry = new THREE.SphereGeometry(0.3, 32, 32);
                const buttonMaterial = new THREE.MeshStandardMaterial({ 
                    color: 0x3498db,
                    emissive: 0x3498db,
                    emissiveIntensity: 0.5,
                    transparent: true,
                    opacity: 0.9
                });
                const button = new THREE.Mesh(buttonGeometry, buttonMaterial);
                button.position.set(x, 0, z);
                button.userData = { category: category };
                radialMenu.add(button);
            });
            
            scene.add(radialMenu);
            isMenuOpen = true;
        }
        
        function showCategoryItems(category) {
            if (!radialMenu) return;
            
            while(radialMenu.children.length > 0) {
                radialMenu.remove(radialMenu.children[0]);
            }
            
            const items = categories[category];
            const cols = 3;
            const spacing = 0.8;
            const startX = -((Math.min(items.length, cols) - 1) * spacing) / 2;
            
            items.forEach((item, index) => {
                const row = Math.floor(index / cols);
                const col = index % cols;
                const x = startX + col * spacing;
                const z = row * spacing;
                
                const geometry = new THREE.BoxGeometry(0.4, 0.4, 0.4);
                const material = new THREE.MeshStandardMaterial({ 
                    color: item.color,
                    emissive: item.color,
                    emissiveIntensity: 0.3
                });
                const icon = new THREE.Mesh(geometry, material);
                icon.position.set(x, 0, z);
                icon.userData = { item: item };
                radialMenu.add(icon);
            });
            
            // Кнопка назад
            const backGeometry = new THREE.SphereGeometry(0.25, 32, 32);
            const backMaterial = new THREE.MeshStandardMaterial({ 
                color: 0x95a5a6,
                emissive: 0x95a5a6,
                emissiveIntensity: 0.3
            });
            const backButton = new THREE.Mesh(backGeometry, backMaterial);
            backButton.position.set(0, 0, 2.5);
            backButton.userData = { isBackButton: true };
            radialMenu.add(backButton);
        }
        
        function handleMenuClick(button) {
            if (button.userData.category) {
                showCategoryItems(button.userData.category);
                updateStatus(`📂 ${button.userData.category}`);
            } else if (button.userData.isBackButton) {
                if (radialMenu) scene.remove(radialMenu);
                createRadialMenu(new THREE.Vector3(0, 2, -2));
                updateStatus('🔙 Назад');
            } else if (button.userData.item) {
                createItem(button.userData.item, new THREE.Vector3(0, 3, 0));
                if (radialMenu) scene.remove(radialMenu);
                radialMenu = null;
                isMenuOpen = false;
                updateStatus('✅ Предмет создан!');
            }
        }
        
        // ==================== ПРЕДМЕТЫ ====================
        function createItem(itemData, position) {
            let geometry;
            if (itemData.sphere) {
                geometry = new THREE.SphereGeometry(itemData.width / 2, 32, 32);
            } else {
                geometry = new THREE.BoxGeometry(itemData.width, itemData.height, itemData.depth);
            }
            
            const material = new THREE.MeshStandardMaterial({ 
                color: itemData.color,
                metalness: 0.2,
                roughness: 0.7
            });
            const mesh = new THREE.Mesh(geometry, material);
            mesh.position.copy(position);
            mesh.castShadow = true;
            scene.add(mesh);
            
            let shape;
            if (itemData.sphere) {
                shape = new CANNON.Sphere(itemData.width / 2);
            } else {
                shape = new CANNON.Box(new CANNON.Vec3(itemData.width/2, itemData.height/2, itemData.depth/2));
            }
            
            const body = new CANNON.Body({ mass: 1 });
            body.addShape(shape);
            body.position.set(position.x, position.y, position.z);
            world.addBody(body);
            
            objects.push({ mesh: mesh, body: body });
        }
        
        // ==================== УТИЛИТЫ ====================
        function updateStatus(text) {
            document.getElementById('status').textContent = text;
        }
        
        function onWindowResize() {
            camera.aspect = window.innerWidth / window.innerHeight;
            camera.updateProjectionMatrix();
            renderer.setSize(window.innerWidth, window.innerHeight);
            overlayCanvas.width = window.innerWidth;
            overlayCanvas.height = window.innerHeight;
        }
        
        // ==================== АНИМАЦИЯ ====================
        function animate() {
            if (!gameStarted) return;
            
            requestAnimationFrame(animate);
            
            world.step(0.016);
            
            objects.forEach(obj => {
                obj.mesh.position.copy(obj.body.position);
                obj.mesh.quaternion.copy(obj.body.quaternion);
            });
            
            renderer.render(scene, camera);
        }
    </script>
</body>
</html>
