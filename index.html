<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
    <title>VR Room Designer - Optimized</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        
        body { 
            overflow: hidden; 
            font-family: Arial, sans-serif; 
            background: #000;
            width: 100vw;
            height: 100vh;
        }
        
        #videoInput {
            position: fixed;
            top: 0;
            left: 0;
            width: 100vw;
            height: 100vh;
            object-fit: cover;
            z-index: 0;
            /* Задняя камера НЕ зеркалится */
        }
        
        #gameCanvas { 
            position: fixed;
            top: 0;
            left: 0;
            width: 100vw; 
            height: 100vh; 
            z-index: 1;
        }
        
        #handOverlay {
            position: fixed;
            top: 0;
            left: 0;
            width: 100vw;
            height: 100vh;
            z-index: 2;
            pointer-events: none;
        }
        
        #loading {
            position: fixed; 
            top: 0; left: 0; 
            width: 100%; height: 100%;
            background: linear-gradient(135deg, #1a1a2e 0%, #16213e 100%);
            display: flex; 
            flex-direction: column; 
            justify-content: center; 
            align-items: center;
            z-index: 10000; 
            color: white;
        }
        
        #loading h1 {
            margin-bottom: 20px; 
            font-size: 32px;
            background: linear-gradient(45deg, #00d4ff, #7b2cbf);
            -webkit-background-clip: text; 
            -webkit-text-fill-color: transparent;
        }
        
        .loader {
            width: 50px; height: 50px;
            border: 5px solid rgba(255, 255, 255, 0.1);
            border-top-color: #00d4ff; 
            border-radius: 50%;
            animation: spin 1s linear infinite;
        }
        
        @keyframes spin { to { transform: rotate(360deg); } }
        
        #gestureIndicator {
            position: fixed; 
            width: 100px; height: 100px;
            border: 5px solid rgba(0, 255, 0, 0.9);
            border-radius: 50%; 
            pointer-events: none;
            opacity: 0; 
            transition: opacity 0.15s, transform 0.15s;
            z-index: 100;
            box-shadow: 0 0 30px rgba(0, 255, 0, 0.8);
        }
        
        #gestureIndicator.active {
            opacity: 1;
            transform: scale(1.1);
        }
        
        #status {
            position: fixed;
            top: 20px;
            left: 20px;
            background: rgba(0, 0, 0, 0.9);
            color: #00ff00;
            padding: 12px 18px;
            border-radius: 10px;
            font-size: 13px;
            z-index: 1000;
            font-family: monospace;
            max-width: 350px;
            border: 2px solid #00ff00;
        }
        
        #fpsCounter {
            position: fixed;
            top: 20px;
            right: 20px;
            background: rgba(0, 0, 0, 0.9);
            color: #ffff00;
            padding: 10px 15px;
            border-radius: 8px;
            font-size: 14px;
            font-weight: bold;
            z-index: 1000;
            font-family: monospace;
            border: 2px solid #ffff00;
        }
        
        #instructions {
            position: fixed;
            bottom: 20px;
            left: 50%;
            transform: translateX(-50%);
            background: rgba(0, 0, 0, 0.9);
            color: white;
            padding: 15px 25px;
            border-radius: 12px;
            font-size: 14px;
            text-align: center;
            z-index: 100;
            max-width: 90%;
            border: 2px solid #00d4ff;
        }
        
        #startButton {
            position: fixed;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            background: linear-gradient(45deg, #00d4ff, #7b2cbf);
            color: white;
            border: none;
            padding: 20px 50px;
            border-radius: 30px;
            font-size: 24px;
            font-weight: bold;
            cursor: pointer;
            z-index: 10001;
            box-shadow: 0 10px 40px rgba(0, 212, 255, 0.6);
            transition: transform 0.2s;
        }
        
        #startButton:hover {
            transform: translate(-50%, -50%) scale(1.05);
        }
        
        #error {
            position: fixed;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            background: rgba(255, 0, 0, 0.95);
            color: white;
            padding: 40px;
            border-radius: 15px;
            font-size: 18px;
            text-align: center;
            z-index: 10002;
            display: none;
            max-width: 80%;
        }
        
        #error button {
            margin-top: 20px;
            padding: 15px 40px;
            background: white;
            color: red;
            border: none;
            border-radius: 8px;
            font-size: 18px;
            cursor: pointer;
            font-weight: bold;
        }
    </style>
</head>
<body>
    <div id="loading">
        <h1>🖐 VR Room Designer</h1>
        <div class="loader"></div>
        <p style="margin-top: 20px; font-size: 18px;">Загрузка оптимизированного трекинга...</p>
    </div>
    
    <button id="startButton">🎮 НАЧАТЬ ИГРУ</button>
    
    <div id="error">
        <h2>❌ Ошибка камеры</h2>
        <p id="errorMessage">Не удалось получить доступ к камере</p>
        <button onclick="location.reload()">Попробовать снова</button>
    </div>
    
    <video id="videoInput" autoplay playsinline muted></video>
    <canvas id="gameCanvas"></canvas>
    <canvas id="handOverlay"></canvas>
    
    <div id="gestureIndicator"></div>
    <div id="fpsCounter">FPS: --</div>
    <div id="status">Ожидание запуска...</div>
    <div id="instructions">
        ✋ Покажи руку камере | 🤏 Соедини большой и указательный палец 2 раза для меню | 📱 Задняя камера
    </div>
    
    <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/@mediapipe/hands@0.4.1646424915/hands.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/@mediapipe/camera_utils@0.3.1640029074/camera_utils.min.js"></script>
    
    <script>
        // ==================== ГЛОБАЛЬНЫЕ ПЕРЕМЕННЫЕ ====================
        let scene, camera, renderer;
        let objects = [];
        let handSkeletons = { left: null, right: null };
        let hands, videoElement, overlayCanvas, overlayCtx;
        let isPinching = { left: false, right: false };
        let pinchCount = 0;
        let lastPinchTime = 0;
        let radialMenu = null;
        let isMenuOpen = false;
        let gameStarted = false;
        
        // FPS counter
        let frameCount = 0;
        let lastFpsUpdate = 0;
        let currentFps = 0;
        
        // Оптимизация: throttling для MediaPipe
        let lastProcessTime = 0;
        const PROCESS_INTERVAL = 33; // ~30 FPS для трекинга
        
        const HAND_CONNECTIONS = [
            [0, 1], [1, 2], [2, 3], [3, 4],
            [0, 5], [5, 6], [6, 7], [7, 8],
            [0, 9], [9, 10], [10, 11], [11, 12],
            [0, 13], [13, 14], [14, 15], [15, 16],
            [0, 17], [17, 18], [18, 19], [19, 20]
        ];
        
        const categories = {
            furniture: [
                { name: '📺 Телевизор', type: 'tv', color: 0x2c3e50, width: 1.2, height: 0.8, depth: 0.2 },
                { name: '🛋️ Диван', type: 'sofa', color: 0xe74c3c, width: 2, height: 0.8, depth: 0.9 },
                { name: '🪑 Стул', type: 'chair', color: 0x3498db, width: 0.6, height: 0.9, depth: 0.6 },
                { name: '📚 Стол', type: 'table', color: 0x8b4513, width: 1.5, height: 0.75, depth: 0.8 }
            ],
            toys: [
                { name: '🧸 Мишка', type: 'bear', color: 0xd2691e, width: 0.4, height: 0.5, depth: 0.3 },
                { name: '🧊 Кубик', type: 'cube', color: 0xe74c3c, width: 0.3, height: 0.3, depth: 0.3 },
                { name: '⚽ Мяч', type: 'ball', color: 0x2ecc71, width: 0.3, height: 0.3, depth: 0.3, sphere: true }
            ]
        };
        
        // ==================== ЗАПУСК ИГРЫ ====================
        document.getElementById('startButton').addEventListener('click', async () => {
            document.getElementById('startButton').style.display = 'none';
            await startGame();
        });
        
        async function startGame() {
            try {
                initThreeJS();
                await initCamera();
                document.getElementById('loading').style.display = 'none';
                gameStarted = true;
                updateStatus('✅ Задняя камера активна! Покажи руку');
                animate();
            } catch (error) {
                console.error('Ошибка:', error);
                document.getElementById('loading').style.display = 'none';
                document.getElementById('errorMessage').textContent = error.message;
                document.getElementById('error').style.display = 'block';
            }
        }
        
        // ==================== THREE.JS (ОПТИМИЗИРОВАННЫЙ) ====================
        function initThreeJS() {
            scene = new THREE.Scene();
            
            camera = new THREE.PerspectiveCamera(75, window.innerWidth / window.innerHeight, 0.1, 1000);
            camera.position.set(0, 2, 5);
            camera.lookAt(0, 1, 0);
            
            renderer = new THREE.WebGLRenderer({ 
                canvas: document.getElementById('gameCanvas'), 
                antialias: false, // Отключаем для производительности
                alpha: true,
                powerPreference: "high-performance"
            });
            renderer.setSize(window.innerWidth, window.innerHeight);
            renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2)); // Ограничиваем pixel ratio
            renderer.setClearColor(0x000000, 0);
            
            // Освещение
            const ambientLight = new THREE.AmbientLight(0xffffff, 0.8);
            scene.add(ambientLight);
            
            const dirLight = new THREE.DirectionalLight(0xffffff, 0.6);
            dirLight.position.set(5, 10, 5);
            scene.add(dirLight);
            
            createRoom();
            window.addEventListener('resize', onWindowResize);
        }
        
        function createRoom() {
            // Пол (полупрозрачный)
            const floorGeometry = new THREE.PlaneGeometry(10, 10);
            const floorMaterial = new THREE.MeshBasicMaterial({ 
                color: 0x8b7355,
                transparent: true,
                opacity: 0.3
            });
            const floor = new THREE.Mesh(floorGeometry, floorMaterial);
            floor.rotation.x = -Math.PI / 2;
            scene.add(floor);
            
            // Стены (полупрозрачные)
            createWall(0, 2.5, -5, 10, 5, 0.2, 0x95a5a6);
            createWall(-5, 2.5, 0, 0.2, 5, 10, 0x95a5a6);
            createWall(5, 2.5, 0, 0.2, 5, 10, 0x95a5a6);
        }
        
        function createWall(x, y, z, w, h, d, color) {
            const geometry = new THREE.BoxGeometry(w, h, d);
            const material = new THREE.MeshBasicMaterial({ 
                color: color,
                transparent: true,
                opacity: 0.2
            });
            const wall = new THREE.Mesh(geometry, material);
            wall.position.set(x, y, z);
            scene.add(wall);
        }
        
        // ==================== КАМЕРА (ЗАДНЯЯ) ====================
        async function initCamera() {
            videoElement = document.getElementById('videoInput');
            overlayCanvas = document.getElementById('handOverlay');
            overlayCtx = overlayCanvas.getContext('2d');
            
            overlayCanvas.width = window.innerWidth;
            overlayCanvas.height = window.innerHeight;
            
            // Оптимизированный MediaPipe
            hands = new Hands({
                locateFile: (file) => {
                    return `https://cdn.jsdelivr.net/npm/@mediapipe/hands@0.4.1646424915/${file}`;
                }
            });
            
            hands.setOptions({
                maxNumHands: 2,
                modelComplexity: 0, // 0 = быстрее, 1 = точнее
                minDetectionConfidence: 0.6,
                minTrackingConfidence: 0.5
            });
            
            hands.onResults(onHandResults);
            
            // Задняя камера
            const stream = await navigator.mediaDevices.getUserMedia({ 
                video: { 
                    width: { ideal: 640 }, // Меньше разрешение = быстрее
                    height: { ideal: 480 },
                    facingMode: 'environment' // ЗАДНЯЯ КАМЕРА
                } 
            });
            
            videoElement.srcObject = stream;
            
            await new Promise((resolve, reject) => {
                videoElement.onloadedmetadata = () => {
                    videoElement.play().then(resolve).catch(reject);
                };
                videoElement.onerror = () => reject(new Error('Ошибка видео'));
            });
            
            // Запуск с throttling
            const cam = new Camera(videoElement, {
                onFrame: async () => {
                    const now = performance.now();
                    if (now - lastProcessTime >= PROCESS_INTERVAL) {
                        await hands.send({ image: videoElement });
                        lastProcessTime = now;
                    }
                },
                width: 640,
                height: 480
            });
            cam.start();
        }
        
        // ==================== ТРЕКИНГ РУК ====================
        function onHandResults(results) {
            // Очистка overlay
            overlayCtx.clearRect(0, 0, overlayCanvas.width, overlayCanvas.height);
            
            if (results.multiHandLandmarks && results.multiHandLandmarks.length > 0) {
                results.multiHandLandmarks.forEach((landmarks, index) => {
                    const handedness = results.multiHandedness[index].label;
                    
                    // Задняя камера НЕ зеркалится
                    const actualHand = handedness === 'Left' ? 'left' : 'right';
                    
                    drawHandSkeleton(landmarks, actualHand);
                    updateHandSkeleton3D(landmarks, actualHand);
                    checkGestures(landmarks, actualHand);
                });
            } else {
                // Скрываем скелеты
                if (handSkeletons.left) {
                    handSkeletons.left.joints.forEach(j => j.visible = false);
                    handSkeletons.left.bones.forEach(b => b.visible = false);
                }
                if (handSkeletons.right) {
                    handSkeletons.right.joints.forEach(j => j.visible = false);
                    handSkeletons.right.bones.forEach(b => b.visible = false);
                }
            }
        }
        
        function drawHandSkeleton(landmarks, handedness) {
            const color = handedness === 'left' ? '#00ff00' : '#ff00ff';
            
            // Рисуем кости
            overlayCtx.strokeStyle = color;
            overlayCtx.lineWidth = 3;
            overlayCtx.lineCap = 'round';
            
            HAND_CONNECTIONS.forEach(([start, end]) => {
                const startPoint = landmarks[start];
                const endPoint = landmarks[end];
                
                // Задняя камера НЕ зеркалится
                const x1 = startPoint.x * overlayCanvas.width;
                const y1 = startPoint.y * overlayCanvas.height;
                const x2 = endPoint.x * overlayCanvas.width;
                const y2 = endPoint.y * overlayCanvas.height;
                
                overlayCtx.beginPath();
                overlayCtx.moveTo(x1, y1);
                overlayCtx.lineTo(x2, y2);
                overlayCtx.stroke();
            });
            
            // Рисуем суставы
            landmarks.forEach((landmark, index) => {
                const x = landmark.x * overlayCanvas.width;
                const y = landmark.y * overlayCanvas.height;
                
                const isFingertip = [4, 8, 12, 16, 20].includes(index);
                const radius = isFingertip ? 8 : 5;
                
                overlayCtx.fillStyle = isFingertip ? '#ffff00' : color;
                overlayCtx.beginPath();
                overlayCtx.arc(x, y, radius, 0, 2 * Math.PI);
                overlayCtx.fill();
                
                overlayCtx.strokeStyle = '#ffffff';
                overlayCtx.lineWidth = 2;
                overlayCtx.stroke();
            });
        }
        
        function updateHandSkeleton3D(landmarks, handedness) {
            if (!handSkeletons[handedness]) {
                handSkeletons[handedness] = createHandSkeleton3D(handedness);
            }
            
            const skeleton = handSkeletons[handedness];
            
            skeleton.joints.forEach(j => j.visible = true);
            skeleton.bones.forEach(b => b.visible = true);
            
            // Обновляем позиции суставов
            landmarks.forEach((landmark, index) => {
                // Задняя камера НЕ зеркалится
                const x = (landmark.x - 0.5) * 4;
                const y = (0.5 - landmark.y) * 4;
                const z = -landmark.z * 3;
                
                if (skeleton.joints[index]) {
                    skeleton.joints[index].position.set(x, y + 2, z);
                }
            });
            
            // Обновляем кости
            HAND_CONNECTIONS.forEach(([startIdx, endIdx], connIdx) => {
                if (skeleton.bones[connIdx]) {
                    const start = skeleton.joints[startIdx].position;
                    const end = skeleton.joints[endIdx].position;
                    
                    const direction = new THREE.Vector3().subVectors(end, start);
                    const length = direction.length();
                    const midpoint = new THREE.Vector3().addVectors(start, end).multiplyScalar(0.5);
                    
                    skeleton.bones[connIdx].position.copy(midpoint);
                    skeleton.bones[connIdx].scale.y = length;
                    
                    const axis = new THREE.Vector3(0, 1, 0);
                    const quaternion = new THREE.Quaternion().setFromUnitVectors(axis, direction.normalize());
                    skeleton.bones[connIdx].quaternion.copy(quaternion);
                }
            });
        }
        
        function createHandSkeleton3D(handKey) {
            const skeleton = { joints: [], bones: [] };
            const color = handKey === 'left' ? 0x00ff00 : 0xff00ff;
            
            // Суставы (оптимизированная геометрия)
            for (let i = 0; i < 21; i++) {
                const isFingertip = [4, 8, 12, 16, 20].includes(i);
                const size = isFingertip ? 0.04 : 0.03;
                
                const geometry = new THREE.SphereGeometry(size, 8, 8); // Меньше сегментов
                const material = new THREE.MeshBasicMaterial({ 
                    color: color
                });
                const joint = new THREE.Mesh(geometry, material);
                joint.visible = false;
                scene.add(joint);
                skeleton.joints.push(joint);
            }
            
            // Кости (оптимизированная геометрия)
            HAND_CONNECTIONS.forEach(() => {
                const geometry = new THREE.CylinderGeometry(0.015, 0.015, 1, 6); // Меньше сегментов
                const material = new THREE.MeshBasicMaterial({ 
                    color: color
                });
                const bone = new THREE.Mesh(geometry, material);
                bone.visible = false;
                scene.add(bone);
                skeleton.bones.push(bone);
            });
            
            return skeleton;
        }
        
        // ==================== ЖЕСТЫ ====================
        function checkGestures(landmarks, handedness) {
            const thumbTip = landmarks[4];
            const indexTip = landmarks[8];
            
            const distance = Math.sqrt(
                Math.pow(thumbTip.x - indexTip.x, 2) +
                Math.pow(thumbTip.y - indexTip.y, 2) +
                Math.pow(thumbTip.z - indexTip.z, 2)
            );
            
            const threshold = 0.06;
            const now = Date.now();
            
            if (distance < threshold && !isPinching[handedness]) {
                isPinching[handedness] = true;
                
                // Показываем индикатор
                const indicator = document.getElementById('gestureIndicator');
                const x = thumbTip.x * overlayCanvas.width;
                const y = thumbTip.y * overlayCanvas.height;
                indicator.style.left = (x - 50) + 'px';
                indicator.style.top = (y - 50) + 'px';
                indicator.classList.add('active');
                
                // Считаем для двойного щипка
                if (now - lastPinchTime > 400) {
                    pinchCount++;
                    lastPinchTime = now;
                    
                    updateStatus(`🤏 Щипок #${pinchCount} (${handedness === 'left' ? 'Левая' : 'Правая'})`);
                    
                    if (pinchCount === 2) {
                        const menuPos = getHandPosition3D(thumbTip);
                        createQuest3Menu(menuPos);
                        pinchCount = 0;
                        updateStatus('✅ Двойной щипок! Меню Quest 3 открыто');
                    }
                    
                    setTimeout(() => {
                        if (pinchCount === 1) {
                            pinchCount = 0;
                        }
                    }, 800);
                }
                
                if (isMenuOpen && radialMenu) {
                    checkMenuInteraction(thumbTip);
                }
                
            } else if (distance >= threshold && isPinching[handedness]) {
                isPinching[handedness] = false;
                document.getElementById('gestureIndicator').classList.remove('active');
            }
        }
        
        function getHandPosition3D(landmark) {
            const x = (landmark.x - 0.5) * 4;
            const y = (0.5 - landmark.y) * 4;
            const z = -landmark.z * 3;
            return new THREE.Vector3(x, y + 2, z);
        }
        
        // ==================== МЕНЮ В СТИЛЕ QUEST 3 ====================
        function createQuest3Menu(position) {
            if (radialMenu) scene.remove(radialMenu);
            
            radialMenu = new THREE.Group();
            radialMenu.position.copy(position);
            radialMenu.position.z -= 1; // Перед рукой
            
            // Главная панель
            const panelGeometry = new THREE.PlaneGeometry(2.5, 1.5);
            const panelMaterial = new THREE.MeshBasicMaterial({ 
                color: 0x1a1a2e,
                transparent: true,
                opacity: 0.9,
                side: THREE.DoubleSide
            });
            const panel = new THREE.Mesh(panelGeometry, panelMaterial);
            radialMenu.add(panel);
            
            // Рамка
            const frameGeometry = new THREE.EdgesGeometry(panelGeometry);
            const frameMaterial = new THREE.LineBasicMaterial({ color: 0x00d4ff, linewidth: 2 });
            const frame = new THREE.LineSegments(frameGeometry, frameMaterial);
            radialMenu.add(frame);
            
            // Категории
            const categoriesList = Object.keys(categories);
            const spacing = 0.8;
            const startX = -((categoriesList.length - 1) * spacing) / 2;
            
            categoriesList.forEach((category, index) => {
                const x = startX + index * spacing;
                
                const buttonGeometry = new THREE.BoxGeometry(0.6, 0.6, 0.1);
                const buttonMaterial = new THREE.MeshBasicMaterial({ 
                    color: 0x3498db,
                    transparent: true,
                    opacity: 0.9
                });
                const button = new THREE.Mesh(buttonGeometry, buttonMaterial);
                button.position.set(x, 0, 0.06);
                button.userData = { category: category, originalColor: 0x3498db };
                radialMenu.add(button);
            });
            
            // Кнопка закрытия
            const closeGeometry = new THREE.SphereGeometry(0.15, 16, 16);
            const closeMaterial = new THREE.MeshBasicMaterial({ color: 0xe74c3c });
            const closeButton = new THREE.Mesh(closeGeometry, closeMaterial);
            closeButton.position.set(1.1, 0.6, 0.06);
            closeButton.userData = { isCloseButton: true };
            radialMenu.add(closeButton);
            
            scene.add(radialMenu);
            isMenuOpen = true;
        }
        
        function showCategoryItems(category) {
            if (!radialMenu) return;
            
            // Удаляем старые кнопки
            while(radialMenu.children.length > 2) {
                radialMenu.remove(radialMenu.children[2]);
            }
            
            const items = categories[category];
            const cols = 3;
            const spacing = 0.7;
            const startX = -((Math.min(items.length, cols) - 1) * spacing) / 2;
            
            items.forEach((item, index) => {
                const row = Math.floor(index / cols);
                const col = index % cols;
                const x = startX + col * spacing;
                const y = -row * spacing;
                
                const geometry = new THREE.BoxGeometry(0.5, 0.5, 0.1);
                const material = new THREE.MeshBasicMaterial({ 
                    color: item.color,
                    transparent: true,
                    opacity: 0.9
                });
                const icon = new THREE.Mesh(geometry, material);
                icon.position.set(x, y, 0.06);
                icon.userData = { item: item, originalColor: item.color };
                radialMenu.add(icon);
            });
            
            // Кнопка назад
            const backGeometry = new THREE.BoxGeometry(0.5, 0.3, 0.1);
            const backMaterial = new THREE.MeshBasicMaterial({ 
                color: 0x95a5a6,
                transparent: true,
                opacity: 0.9
            });
            const backButton = new THREE.Mesh(backGeometry, backMaterial);
            backButton.position.set(0, -1.2, 0.06);
            backButton.userData = { isBackButton: true, originalColor: 0x95a5a6 };
            radialMenu.add(backButton);
        }
        
        function checkMenuInteraction(thumbTip) {
            const handPos = getHandPosition3D(thumbTip);
            
            radialMenu.children.forEach(button => {
                if (!button.userData) return;
                
                const distance = handPos.distanceTo(button.position.clone().add(radialMenu.position));
                
                if (distance < 0.35) {
                    button.material.color.setHex(0xffff00);
                    button.scale.set(1.1, 1.1, 1.1);
                    
                    if (isPinching.left || isPinching.right) {
                        handleMenuClick(button);
                    }
                } else {
                    button.material.color.setHex(button.userData.originalColor || 0x3498db);
                    button.scale.set(1, 1, 1);
                }
            });
        }
        
        function handleMenuClick(button) {
            if (button.userData.category) {
                showCategoryItems(button.userData.category);
                updateStatus(`📂 ${button.userData.category}`);
            } else if (button.userData.isBackButton) {
                const pos = radialMenu.position.clone();
                scene.remove(radialMenu);
                createQuest3Menu(pos);
                updateStatus('🔙 Назад');
            } else if (button.userData.isCloseButton) {
                scene.remove(radialMenu);
                radialMenu = null;
                isMenuOpen = false;
                updateStatus('❌ Меню закрыто');
            } else if (button.userData.item) {
                createItem(button.userData.item, new THREE.Vector3(0, 3, 0));
                scene.remove(radialMenu);
                radialMenu = null;
                isMenuOpen = false;
                updateStatus('✅ Предмет создан!');
            }
        }
        
        // ==================== ПРЕДМЕТЫ ====================
        function createItem(itemData, position) {
            let geometry;
            if (itemData.sphere) {
                geometry = new THREE.SphereGeometry(itemData.width / 2, 16, 16);
            } else {
                geometry = new THREE.BoxGeometry(itemData.width, itemData.height, itemData.depth);
            }
            
            const material = new THREE.MeshBasicMaterial({ 
                color: itemData.color
            });
            const mesh = new THREE.Mesh(geometry, material);
            mesh.position.copy(position);
            scene.add(mesh);
            
            objects.push({ mesh: mesh });
        }
        
        // ==================== УТИЛИТЫ ====================
        function updateStatus(text) {
            document.getElementById('status').textContent = text;
        }
        
        function updateFPS() {
            frameCount++;
            const now = performance.now();
            if (now - lastFpsUpdate >= 1000) {
                currentFps = frameCount;
                document.getElementById('fpsCounter').textContent = `FPS: ${currentFps}`;
                frameCount = 0;
                lastFpsUpdate = now;
            }
        }
        
        function onWindowResize() {
            camera.aspect = window.innerWidth / window.innerHeight;
            camera.updateProjectionMatrix();
            renderer.setSize(window.innerWidth, window.innerHeight);
            overlayCanvas.width = window.innerWidth;
            overlayCanvas.height = window.innerHeight;
        }
        
        // ==================== АНИМАЦИЯ ====================
        function animate() {
            if (!gameStarted) return;
            
            requestAnimationFrame(animate);
            updateFPS();
            renderer.render(scene, camera);
        }
    </script>
</body>
</html>
