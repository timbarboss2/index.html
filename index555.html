<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
    <title>VR Room Designer - Decorate Your Space</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            touch-action: none;
        }
        
        body {
            overflow: hidden;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background: #1a1a2e;
        }
        
        #gameCanvas {
            display: block;
            width: 100vw;
            height: 100vh;
        }
        
        #gestureIndicator {
            position: fixed;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            width: 80px;
            height: 80px;
            border: 4px solid rgba(255, 255, 255, 0.8);
            border-radius: 50%;
            pointer-events: none;
            opacity: 0;
            transition: opacity 0.3s;
            z-index: 1000;
            box-shadow: 0 0 20px rgba(100, 200, 255, 0.6);
        }
        
        #gestureIndicator.active {
            opacity: 1;
            animation: pulse 1s ease-in-out infinite;
        }
        
        @keyframes pulse {
            0%, 100% { transform: translate(-50%, -50%) scale(1); }
            50% { transform: translate(-50%, -50%) scale(1.2); }
        }
        
        #instructions {
            position: fixed;
            bottom: 20px;
            left: 50%;
            transform: translateX(-50%);
            background: rgba(0, 0, 0, 0.8);
            color: white;
            padding: 15px 25px;
            border-radius: 10px;
            font-size: 14px;
            text-align: center;
            z-index: 100;
            pointer-events: none;
        }
        
        #loading {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: linear-gradient(135deg, #1a1a2e 0%, #16213e 100%);
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            z-index: 10000;
            color: white;
        }
        
        #loading h1 {
            margin-bottom: 20px;
            font-size: 32px;
            background: linear-gradient(45deg, #00d4ff, #7b2cbf);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
        }
        
        .loader {
            width: 50px;
            height: 50px;
            border: 5px solid rgba(255, 255, 255, 0.1);
            border-top-color: #00d4ff;
            border-radius: 50%;
            animation: spin 1s linear infinite;
        }
        
        @keyframes spin {
            to { transform: rotate(360deg); }
        }
    </style>
</head>
<body>
    <div id="loading">
        <h1>🏠 VR Room Designer</h1>
        <div class="loader"></div>
        <p style="margin-top: 20px;">Загрузка...</p>
    </div>
    
    <div id="gestureIndicator"></div>
    <div id="instructions">
        🖐 Зажмите ЛКМ/коснитесь для жеста "щипок" | Перетаскивайте предметы | Колесо мыши - масштаб
    </div>
    
    <canvas id="gameCanvas"></canvas>
    
    <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/controls/OrbitControls.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/libs/cannon.min.js"></script>
    
    <script>
        // ==================== ГЛОБАЛЬНЫЕ ПЕРЕМЕННЫЕ ====================
        let scene, camera, renderer, controls;
        let world; // Cannon.js физический мир
        let objects = []; // Массив объектов с физикой
        let raycaster, mouse;
        let isPinching = false;
        let selectedObject = null;
        let dragConstraint = null;
        let radialMenu = null;
        let isMenuOpen = false;
        let handPosition = { x: 0, y: 0 };
        
        // Категории предметов
        const categories = {
            furniture: [
                { name: ' Телевизор', type: 'tv', color: 0x2c3e50, width: 1.2, height: 0.8, depth: 0.2 },
                { name: '🛋️ Диван', type: 'sofa', color: 0xe74c3c, width: 2, height: 0.8, depth: 0.9 },
                { name: ' Стул', type: 'chair', color: 0x3498db, width: 0.6, height: 0.9, depth: 0.6 },
                { name: '📚 Стол', type: 'table', color: 0x8b4513, width: 1.5, height: 0.75, depth: 0.8 },
                { name: '️ Кровать', type: 'bed', color: 0x9b59b6, width: 1.8, height: 0.5, depth: 2 },
                { name: '🗄️ Шкаф', type: 'wardrobe', color: 0x95a5a6, width: 1.2, height: 2, depth: 0.6 },
                { name: '💡 Лампа', type: 'lamp', color: 0xf1c40f, width: 0.3, height: 1.5, depth: 0.3 },
                { name: '🪴 Растение', type: 'plant', color: 0x27ae60, width: 0.4, height: 1, depth: 0.4 }
            ],
            toys: [
                { name: '🧸 Мишка', type: 'bear', color: 0xd2691e, width: 0.4, height: 0.5, depth: 0.3 },
                { name: ' Кубик', type: 'cube', color: 0xe74c3c, width: 0.3, height: 0.3, depth: 0.3 },
                { name: '⚽ Мяч', type: 'ball', color: 0x2ecc71, width: 0.3, height: 0.3, depth: 0.3, sphere: true },
                { name: '🚗 Машинка', type: 'car', color: 0x3498db, width: 0.4, height: 0.2, depth: 0.7 },
                { name: '🎾 Теннисный мяч', type: 'tennis', color: 0xf1c40f, width: 0.15, height: 0.15, depth: 0.15, sphere: true },
                { name: '🎱 Бильярдный шар', type: 'billiard', color: 0x8e44ad, width: 0.12, height: 0.12, depth: 0.12, sphere: true }
            ],
            decor: [
                { name: '🖼️ Картина', type: 'painting', color: 0xf39c12, width: 0.8, height: 1, depth: 0.05 },
                { name: '️ Часы', type: 'clock', color: 0x34495e, width: 0.4, height: 0.4, depth: 0.1 },
                { name: '🏺 Ваза', type: 'vase', color: 0x1abc9c, width: 0.3, height: 0.6, depth: 0.3 },
                { name: '📦 Коробка', type: 'box', color: 0x795548, width: 0.5, height: 0.4, depth: 0.5 }
            ]
        };
        
        // ==================== ИНИЦИАЛИЗАЦИЯ ====================
        function init() {
            // Сцена Three.js
            scene = new THREE.Scene();
            scene.background = new THREE.Color(0x87ceeb);
            scene.fog = new THREE.Fog(0x87ceeb, 10, 50);
            
            // Камера
            camera = new THREE.PerspectiveCamera(
                75,
                window.innerWidth / window.innerHeight,
                0.1,
                1000
            );
            camera.position.set(5, 5, 8);
            camera.lookAt(0, 1, 0);
            
            // Рендерер
            renderer = new THREE.WebGLRenderer({ 
                canvas: document.getElementById('gameCanvas'),
                antialias: true 
            });
            renderer.setSize(window.innerWidth, window.innerHeight);
            renderer.shadowMap.enabled = true;
            renderer.shadowMap.type = THREE.PCFSoftShadowMap;
            
            // Контролы камеры
            controls = new THREE.OrbitControls(camera, renderer.domElement);
            controls.enableDamping = true;
            controls.dampingFactor = 0.05;
            controls.maxPolarAngle = Math.PI / 2 - 0.1;
            controls.minDistance = 3;
            controls.maxDistance = 15;
            
            // Физический мир Cannon.js
            world = new CANNON.World();
            world.gravity.set(0, -9.82, 0);
            world.broadphase = new CANNON.NaiveBroadphase();
            world.solver.iterations = 10;
            
            // Материалы физики
            const defaultMaterial = new CANNON.Material('default');
            const defaultContactMaterial = new CANNON.ContactMaterial(
                defaultMaterial,
                defaultMaterial,
                {
                    friction: 0.4,
                    restitution: 0.3 // упругость
                }
            );
            world.addContactMaterial(defaultContactMaterial);
            
            // Raycaster для взаимодействия
            raycaster = new THREE.Raycaster();
            mouse = new THREE.Vector2();
            
            // Создание комнаты
            createRoom();
            
            // Освещение
            setupLighting();
            
            // Обработчики событий
            setupEventListeners();
            
            // Скрываем загрузку
            setTimeout(() => {
                document.getElementById('loading').style.display = 'none';
            }, 1500);
            
            // Запуск цикла
            animate();
        }
        
        // ==================== СОЗДАНИЕ КОМНАТЫ ====================
        function createRoom() {
            // Пол
            const floorGeometry = new THREE.PlaneGeometry(10, 10);
            const floorMaterial = new THREE.MeshStandardMaterial({ 
                color: 0x8b7355,
                roughness: 0.8,
                metalness: 0.1
            });
            const floor = new THREE.Mesh(floorGeometry, floorMaterial);
            floor.rotation.x = -Math.PI / 2;
            floor.receiveShadow = true;
            scene.add(floor);
            
            // Физика пола
            const floorShape = new CANNON.Plane();
            const floorBody = new CANNON.Body({ mass: 0 });
            floorBody.addShape(floorShape);
            floorBody.quaternion.setFromAxisAngle(new CANNON.Vec3(1, 0, 0), -Math.PI / 2);
            world.addBody(floorBody);
            
            // Стены
            createWall(0, 2.5, -5, 10, 5, 0.2, 0x95a5a6); // Задняя
            createWall(0, 2.5, 5, 10, 5, 0.2, 0x95a5a6);  // Передняя
            createWall(-5, 2.5, 0, 0.2, 5, 10, 0x95a5a6); // Левая
            createWall(5, 2.5, 0, 0.2, 5, 10, 0x95a5a6);  // Правая
            
            // Ковер
            const carpetGeometry = new THREE.PlaneGeometry(4, 3);
            const carpetMaterial = new THREE.MeshStandardMaterial({ 
                color: 0xc0392b,
                roughness: 1
            });
            const carpet = new THREE.Mesh(carpetGeometry, carpetMaterial);
            carpet.rotation.x = -Math.PI / 2;
            carpet.position.y = 0.01;
            carpet.receiveShadow = true;
            scene.add(carpet);
        }
        
        function createWall(x, y, z, w, h, d, color) {
            const geometry = new THREE.BoxGeometry(w, h, d);
            const material = new THREE.MeshStandardMaterial({ color: color });
            const wall = new THREE.Mesh(geometry, material);
            wall.position.set(x, y, z);
            wall.castShadow = true;
            wall.receiveShadow = true;
            scene.add(wall);
            
            // Физика стены
            const shape = new CANNON.Box(new CANNON.Vec3(w/2, h/2, d/2));
            const body = new CANNON.Body({ mass: 0 });
            body.addShape(shape);
            body.position.set(x, y, z);
            world.addBody(body);
        }
        
        // ==================== ОСВЕЩЕНИЕ ====================
        function setupLighting() {
            // Ambient light
            const ambientLight = new THREE.AmbientLight(0xffffff, 0.6);
            scene.add(ambientLight);
            
            // Directional light (солнце)
            const dirLight = new THREE.DirectionalLight(0xffffff, 0.8);
            dirLight.position.set(5, 10, 5);
            dirLight.castShadow = true;
            dirLight.shadow.camera.left = -10;
            dirLight.shadow.camera.right = 10;
            dirLight.shadow.camera.top = 10;
            dirLight.shadow.camera.bottom = -10;
            dirLight.shadow.mapSize.width = 2048;
            dirLight.shadow.mapSize.height = 2048;
            scene.add(dirLight);
            
            // Точечный свет (лампа)
            const pointLight = new THREE.PointLight(0xffaa00, 0.5, 10);
            pointLight.position.set(0, 3, 0);
            scene.add(pointLight);
        }
        
        // ==================== СОЗДАНИЕ ПРЕДМЕТОВ ====================
        function createItem(itemData, position) {
            let geometry, mesh;
            
            if (itemData.sphere) {
                geometry = new THREE.SphereGeometry(itemData.width / 2, 32, 32);
            } else {
                geometry = new THREE.BoxGeometry(
                    itemData.width,
                    itemData.height,
                    itemData.depth
                );
            }
            
            const material = new THREE.MeshStandardMaterial({ 
                color: itemData.color,
                roughness: 0.5,
                metalness: 0.1
            });
            
            mesh = new THREE.Mesh(geometry, material);
            mesh.position.copy(position);
            mesh.castShadow = true;
            mesh.receiveShadow = true;
            mesh.userData = { itemData: itemData, isDraggable: true };
            
            scene.add(mesh);
            
            // Физика
            let shape;
            if (itemData.sphere) {
                shape = new CANNON.Sphere(itemData.width / 2);
            } else {
                shape = new CANNON.Box(new CANNON.Vec3(
                    itemData.width / 2,
                    itemData.height / 2,
                    itemData.depth / 2
                ));
            }
            
            const body = new CANNON.Body({ 
                mass: 1,
                position: new CANNON.Vec3(position.x, position.y, position.z)
            });
            body.addShape(shape);
            body.linearDamping = 0.3;
            body.angularDamping = 0.3;
            
            world.addBody(body);
            
            objects.push({ mesh: mesh, body: body });
            
            return mesh;
        }
        
        // ==================== РАДИАЛЬНОЕ МЕНЮ ====================
        function createRadialMenu(position) {
            if (radialMenu) {
                scene.remove(radialMenu);
            }
            
            radialMenu = new THREE.Group();
            radialMenu.position.copy(position);
            radialMenu.position.y = 1.5;
            radialMenu.lookAt(camera.position);
            
            const categoriesList = Object.keys(categories);
            const radius = 1.2;
            const angleStep = (Math.PI * 2) / categoriesList.length;
            
            categoriesList.forEach((category, index) => {
                const angle = index * angleStep - Math.PI / 2;
                const x = Math.cos(angle) * radius;
                const z = Math.sin(angle) * radius;
                
                // Кнопка категории
                const buttonGeometry = new THREE.CircleGeometry(0.3, 32);
                const buttonMaterial = new THREE.MeshBasicMaterial({ 
                    color: 0x3498db,
                    transparent: true,
                    opacity: 0.9
                });
                const button = new THREE.Mesh(buttonGeometry, buttonMaterial);
                button.position.set(x, 0, z);
                button.rotation.x = -Math.PI / 2;
                button.userData = { category: category, isMenuButton: true };
                
                // Текст (эмодзи)
                const emojis = { furniture: '🪑', toys: '', decor: '🖼️' };
                
                radialMenu.add(button);
            });
            
            // Центр меню
            const centerGeometry = new THREE.CircleGeometry(0.25, 32);
            const centerMaterial = new THREE.MeshBasicMaterial({ 
                color: 0xe74c3c,
                transparent: true,
                opacity: 0.95
            });
            const center = new THREE.Mesh(centerGeometry, centerMaterial);
            center.rotation.x = -Math.PI / 2;
            center.userData = { isCloseButton: true };
            radialMenu.add(center);
            
            scene.add(radialMenu);
            isMenuOpen = true;
        }
        
        function showCategoryItems(category) {
            if (!radialMenu) return;
            
            // Очищаем предыдущие предметы
            while(radialMenu.children.length > 0) {
                const child = radialMenu.children[0];
                radialMenu.remove(child);
            }
            
            const items = categories[category];
            const cols = 3;
            const spacing = 0.5;
            const startX = -((Math.min(items.length, cols) - 1) * spacing) / 2;
            
            items.forEach((item, index) => {
                const row = Math.floor(index / cols);
                const col = index % cols;
                
                const x = startX + col * spacing;
                const z = row * spacing;
                
                // Иконка предмета
                const geometry = new THREE.BoxGeometry(0.3, 0.3, 0.3);
                const material = new THREE.MeshBasicMaterial({ 
                    color: item.color,
                    transparent: true,
                    opacity: 0.9
                });
                const icon = new THREE.Mesh(geometry, material);
                icon.position.set(x, 0.15, z);
                icon.userData = { item: item, isItemIcon: true };
                
                radialMenu.add(icon);
            });
            
            // Кнопка назад
            const backGeometry = new THREE.CircleGeometry(0.2, 32);
            const backMaterial = new THREE.MeshBasicMaterial({ 
                color: 0x95a5a6,
                transparent: true,
                opacity: 0.9
            });
            const backButton = new THREE.Mesh(backGeometry, backMaterial);
            backButton.position.set(0, 0.15, 2);
            backButton.rotation.x = -Math.PI / 2;
            backButton.userData = { isBackButton: true };
            radialMenu.add(backButton);
        }
        
        function closeMenu() {
            if (radialMenu) {
                scene.remove(radialMenu);
                radialMenu = null;
            }
            isMenuOpen = false;
        }
        
        // ==================== ОБРАБОТЧИКИ СОБЫТИЙ ====================
        function setupEventListeners() {
            const canvas = renderer.domElement;
            
            // Мышь/тач начало
            canvas.addEventListener('mousedown', onPointerDown);
            canvas.addEventListener('touchstart', onPointerDown, { passive: false });
            
            // Мышь/тач движение
            canvas.addEventListener('mousemove', onPointerMove);
            canvas.addEventListener('touchmove', onPointerMove, { passive: false });
            
            // Мышь/тач конец
            canvas.addEventListener('mouseup', onPointerUp);
            canvas.addEventListener('touchend', onPointerUp);
            
            // Колесо мыши
            canvas.addEventListener('wheel', onWheel);
            
            // Изменение размера окна
            window.addEventListener('resize', onWindowResize);
        }
        
        function onPointerDown(event) {
            event.preventDefault();
            
            const clientX = event.touches ? event.touches[0].clientX : event.clientX;
            const clientY = event.touches ? event.touches[0].clientY : event.clientY;
            
            mouse.x = (clientX / window.innerWidth) * 2 - 1;
            mouse.y = -(clientY / window.innerHeight) * 2 + 1;
            
            handPosition.x = clientX;
            handPosition.y = clientY;
            
            // Показываем индикатор жеста
            const indicator = document.getElementById('gestureIndicator');
            indicator.classList.add('active');
            
            // Raycast
            raycaster.setFromCamera(mouse, camera);
            
            if (isMenuOpen) {
                // Проверка клика по меню
                const intersects = raycaster.intersectObjects(radialMenu.children, true);
                if (intersects.length > 0) {
                    const object = intersects[0].object;
                    handleMenuClick(object);
                }
            } else {
                // Проверка клика по объектам
                const intersectableObjects = objects.map(obj => obj.mesh);
                const intersects = raycaster.intersectObjects(intersectableObjects);
                
                if (intersects.length > 0) {
                    selectedObject = intersects[0].object;
                    isPinching = true;
                    controls.enabled = false;
                    
                    // Создаем ограничение для перетаскивания
                    const body = objects.find(obj => obj.mesh === selectedObject).body;
                    
                    // Визуальная обратная связь
                    selectedObject.material.emissive = new THREE.Color(0x444444);
                } else {
                    // Открываем меню
                    const point = new THREE.Vector3(0, 0, -5);
                    raycaster.ray.at(3, point);
                    createRadialMenu(point);
                }
            }
        }
        
        function onPointerMove(event) {
            event.preventDefault();
            
            const clientX = event.touches ? event.touches[0].clientX : event.clientX;
            const clientY = event.touches ? event.touches[0].clientY : event.clientY;
            
            mouse.x = (clientX / window.innerWidth) * 2 - 1;
            mouse.y = -(clientY / window.innerHeight) * 2 + 1;
            
            if (isPinching && selectedObject) {
                // Перемещение объекта
                const vector = new THREE.Vector3(mouse.x, mouse.y, 0.5);
                vector.unproject(camera);
                
                const dir = vector.sub(camera.position).normalize();
                const distance = -camera.position.z / dir.z;
                const pos = camera.position.clone().add(dir.multiplyScalar(distance));
                
                const body = objects.find(obj => obj.mesh === selectedObject).body;
                body.position.set(pos.x, pos.y, pos.z);
                body.velocity.set(0, 0, 0);
                body.angularVelocity.set(0, 0, 0);
            }
        }
        
        function onPointerUp(event) {
            event.preventDefault();
            
            // Скрываем индикатор жеста
            const indicator = document.getElementById('gestureIndicator');
            indicator.classList.remove('active');
            
            if (isPinching && selectedObject) {
                // Отпускаем объект
                selectedObject.material.emissive = new THREE.Color(0x000000);
                selectedObject = null;
                isPinching = false;
                controls.enabled = true;
            }
        }
        
        function handleMenuClick(object) {
            if (object.userData.isCloseButton) {
                closeMenu();
            } else if (object.userData.category) {
                showCategoryItems(object.userData.category);
            } else if (object.userData.isBackButton) {
                // Возврат к категориям
                if (radialMenu) {
                    scene.remove(radialMenu);
                }
                createRadialMenu(new THREE.Vector3(0, 1.5, -3));
            } else if (object.userData.item) {
                // Создаем предмет
                const item = object.userData.item;
                createItem(item, new THREE.Vector3(0, 2, 0));
                closeMenu();
            }
        }
        
        function onWheel(event) {
            event.preventDefault();
            // Масштаб уже обрабатывается OrbitControls
        }
        
        function onWindowResize() {
            camera.aspect = window.innerWidth / window.innerHeight;
            camera.updateProjectionMatrix();
            renderer.setSize(window.innerWidth, window.innerHeight);
        }
        
        // ==================== ИГРОВОЙ ЦИКЛ ====================
        function animate() {
            requestAnimationFrame(animate);
            
            const delta = 0.016;
            
            // Обновление физики
            world.step(delta);
            
            // Синхронизация Three.js с Cannon.js
            objects.forEach(obj => {
                obj.mesh.position.copy(obj.body.position);
                obj.mesh.quaternion.copy(obj.body.quaternion);
            });
            
            // Обновление контролов
            controls.update();
            
            // Анимация меню
            if (radialMenu) {
                radialMenu.lookAt(camera.position);
            }
            
            renderer.render(scene, camera);
        }
        
        // ==================== ЗАПУСК ====================
        window.addEventListener('load', init);
    </script>
</body>
</html>
